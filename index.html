<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0F172A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>جدول المدرسة</title>
<style>
:root{
  --g:#0F766E;--g2:#0D9488;--g-hover:#0F766E;--g-soft:rgba(13,148,136,.13);--g-ink:#0F766E;
  --navy:#0F172A;--gold:#D97706;--blue:#2563EB;--red:#DC2626;--red-soft:rgba(220,38,38,.12);--red-ink:#B91C1C;
  --warn-soft:rgba(245,158,11,.15);--warn-ink:#92400E;
  --bg-mesh:
    radial-gradient(circle at 88% 8%, rgba(20,184,166,.22) 0%, transparent 42%),
    radial-gradient(circle at 12% 22%, rgba(56,189,248,.20) 0%, transparent 44%),
    radial-gradient(circle at 75% 88%, rgba(129,140,248,.16) 0%, transparent 45%),
    radial-gradient(circle at 20% 85%, rgba(52,211,153,.14) 0%, transparent 40%),
    linear-gradient(160deg, #F1F7FA 0%, #EEF4F8 50%, #F4F3FB 100%);
  --glass-bg:rgba(255,255,255,.64);
  --glass-strong:rgba(255,255,255,.78);
  --glass-soft:rgba(255,255,255,.46);
  --glass-bd:rgba(255,255,255,.78);
  --glass-bd-inner:rgba(15,23,42,.07);
  --card:var(--glass-bg);--surface:var(--glass-soft);--surface2:rgba(255,255,255,.55);
  --ink:#0F172A;--mute:#526075;--line:rgba(15,23,42,.09);
  --shadow:0 8px 30px rgba(15,23,42,.06), inset 0 1px 0 rgba(255,255,255,.85);
  --shadow-lg:0 20px 50px rgba(15,23,42,.14), inset 0 1px 0 rgba(255,255,255,.9);
  --rail-w:84px;--sidebar-w:248px;
  --side-gap:10px;
  --grid-empty:rgba(255,255,255,.42);
  --smart-ok-bg:rgba(16,185,129,.16);--smart-ok-bd:#10B981;--smart-ok-ink:#047857;
  --smart-busy-bg:repeating-linear-gradient(-45deg,rgba(239,68,68,.12),rgba(239,68,68,.12) 6px,rgba(255,255,255,.4) 6px,rgba(255,255,255,.4) 12px);
  --smart-busy-ink:#B91C1C;
  --radius:20px;
}
[data-theme="dark"]{
  --g:#2DD4BF;--g2:#14B8A6;--g-hover:#0D9488;--g-soft:rgba(45,212,191,.16);--g-ink:#5EEAD4;
  --navy:#F8FAFC;--gold:#F59E0B;--blue:#60A5FA;--red:#F87171;--red-soft:rgba(248,113,113,.16);--red-ink:#FCA5A5;
  --warn-soft:rgba(245,158,11,.16);--warn-ink:#FCD34D;
  --bg-mesh:
    radial-gradient(circle at 86% 10%, rgba(20,184,166,.20) 0%, transparent 44%),
    radial-gradient(circle at 14% 25%, rgba(59,130,246,.18) 0%, transparent 45%),
    radial-gradient(circle at 70% 90%, rgba(139,92,246,.16) 0%, transparent 46%),
    linear-gradient(160deg, #070C17 0%, #0C1425 55%, #0A1020 100%);
  --glass-bg:rgba(17,25,40,.62);
  --glass-strong:rgba(17,25,40,.78);
  --glass-soft:rgba(30,41,59,.45);
  --glass-bd:rgba(255,255,255,.11);
  --glass-bd-inner:rgba(255,255,255,.07);
  --card:var(--glass-bg);--surface:var(--glass-soft);--surface2:rgba(30,41,59,.58);
  --ink:#F1F5F9;--mute:#94A3B8;--line:rgba(255,255,255,.10);
  --shadow:0 10px 32px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.09);
  --shadow-lg:0 24px 56px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
  --grid-empty:rgba(30,41,59,.38);
  --smart-ok-bg:rgba(16,185,129,.22);--smart-ok-bd:#34D399;--smart-ok-ink:#6EE7B7;
  --smart-busy-bg:repeating-linear-gradient(-45deg,rgba(239,68,68,.18),rgba(239,68,68,.18) 6px,rgba(15,23,42,.5) 6px,rgba(15,23,42,.5) 12px);
  --smart-busy-ink:#FCA5A5;
}
*{box-sizing:border-box;margin:0}
body{
  font-family:"Cairo",system-ui,"Segoe UI",Tahoma,Arial,sans-serif;
  background:var(--bg-mesh) fixed;color:var(--ink);
  padding-bottom:24px;padding-inline-start:calc(var(--rail-w) + var(--side-gap));
  transition:color .2s;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--blue)}

/* Floating Frosted-Glass Top Header */
header.topbar{
  margin:10px 12px 0;border-radius:18px;
  background:var(--glass-strong);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  color:var(--ink);padding:11px 16px;
  border:1px solid var(--glass-bd);box-shadow:var(--shadow);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  position:sticky;top:10px;z-index:20;
}
header.topbar .brand b{font-size:17.5px;font-weight:800;color:var(--ink);display:block;line-height:1.25}
header.topbar .brand small{display:block;font-size:11.5px;color:var(--mute);margin-top:1px;font-weight:600}
.top-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{
  border:1px solid var(--glass-bd);background:var(--glass-soft);color:var(--ink);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:11px;height:36px;min-width:36px;padding:0 10px;font:inherit;font-size:13px;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  transition:all .16s;box-shadow:0 2px 8px rgba(15,23,42,.04);
}
.icon-btn:hover:not(:disabled){background:var(--glass-strong);transform:translateY(-1px)}
.icon-btn:disabled{opacity:.38;cursor:not-allowed}
#warn{
  background:var(--red-soft);color:var(--red-ink);border:1px solid rgba(220,38,38,.25);
  border-radius:11px;padding:6px 11px;font-weight:800;font-size:12.5px;white-space:nowrap;cursor:pointer
}
#cl{font-size:14px}

/* Floating Frosted-Glass Right Sidebar (Seamless & Soft) */
nav.tabs{
  position:fixed;top:var(--side-gap);bottom:var(--side-gap);
  right:var(--side-gap);inset-inline-start:var(--side-gap);inset-inline-end:auto;
  width:calc(var(--rail-w) - var(--side-gap));
  border-radius:22px;
  background:var(--glass-bg);
  backdrop-filter:blur(24px) saturate(190%);-webkit-backdrop-filter:blur(24px) saturate(190%);
  border:1px solid var(--glass-bd);
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;justify-content:flex-start;
  padding:0;z-index:30;overflow:hidden;
}
nav.tabs .side-head{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:14px 6px 12px;border-bottom:1px solid var(--line);min-height:62px;gap:4px
}
nav.tabs .side-logo{
  width:38px;height:38px;border-radius:13px;
  background:linear-gradient(135deg,#0D9488,#06B6D4);color:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 16px rgba(13,148,136,.32);flex-shrink:0
}
nav.tabs .side-head .side-txt{display:none}
nav.tabs .nav-links{
  display:flex;flex-direction:column;align-items:stretch;
  padding:10px 6px;gap:5px;flex:1;overflow-y:auto
}
nav.tabs button{
  border:1px solid transparent;background:transparent;font:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:10px;font-weight:700;color:var(--mute);
  cursor:pointer;padding:8px 3px;border-radius:14px;transition:all .18s;width:100%;position:relative
}
nav.tabs button:hover{background:var(--glass-soft);color:var(--ink);border-color:var(--glass-bd)}
nav.tabs button i{
  font-style:normal;width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;color:inherit;transition:transform .18s
}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{
  background:linear-gradient(135deg,rgba(13,148,136,.16),rgba(6,182,212,.14));
  color:var(--g-ink);border-color:rgba(13,148,136,.28);
  box-shadow:0 4px 14px rgba(13,148,136,.12), inset 0 1px 0 rgba(255,255,255,.5);
}
[data-theme="dark"] nav.tabs button.on{
  box-shadow:0 4px 16px rgba(20,184,166,.18), inset 0 1px 0 rgba(255,255,255,.12);
}
nav.tabs button.on i{transform:scale(1.06)}
nav.tabs .side-foot{
  display:flex;flex-direction:column;align-items:center;padding:10px 6px;border-top:1px solid var(--line)
}
nav.tabs .side-foot .btn{
  width:100%;padding:8px 4px;font-size:11px;text-align:center;border-radius:12px;
  background:var(--glass-soft);color:var(--ink);border:1px solid var(--glass-bd);box-shadow:none
}
nav.tabs .side-foot .btn:hover{background:var(--glass-strong)}

/* Main Content & Glass Cards */
main{max-width:1120px;margin:10px auto 0;padding:0 12px 20px;position:relative;z-index:5}
.card{
  background:var(--glass-bg);
  backdrop-filter:blur(20px) saturate(175%);-webkit-backdrop-filter:blur(20px) saturate(175%);
  border:1px solid var(--glass-bd);border-radius:var(--radius);
  padding:16px;margin:12px 0;box-shadow:var(--shadow);transition:border-color .18s,box-shadow .18s
}
.dashgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dashstat{
  padding:16px;border-radius:16px;background:var(--glass-soft);
  border:1px solid var(--glass-bd);position:relative;overflow:hidden;
  transition:transform .18s,box-shadow .18s,background .18s
}
.dashstat:hover{transform:translateY(-2px);background:var(--glass-strong);box-shadow:var(--shadow)}
.dashstat::before{content:"";position:absolute;top:0;inset-inline:0;height:3px;background:linear-gradient(90deg,#0D9488,#06B6D4)}
.dashstat:nth-child(2)::before{background:linear-gradient(90deg,#3B82F6,#60A5FA)}
.dashstat:nth-child(3)::before{background:linear-gradient(90deg,#8B5CF6,#A78BFA)}
.dashstat:nth-child(4)::before{background:linear-gradient(90deg,#F59E0B,#FBBF24)}
.dashstat b{display:block;font-size:30px;font-weight:800;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums}
.dashstat small{color:var(--mute);font-size:12.5px;font-weight:600;margin-top:4px;display:block}
.dashlist{display:grid;gap:8px}
.dashrow{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 14px;background:var(--glass-soft);border:1px solid var(--glass-bd);border-radius:13px
}
.dashrow b{font-size:14px;font-weight:700}.dashrow small{color:var(--mute)}

/* Dropzone */
.dropzone{
  border:2px dashed rgba(13,148,136,.45);border-radius:16px;background:var(--g-soft);
  padding:18px;text-align:center;cursor:pointer;transition:all .18s
}
.dropzone:hover,.dropzone.drag{border-color:var(--g2);background:rgba(13,148,136,.2)}
.dropzone b{display:block;color:var(--g-ink);font-size:14.5px}
.dropzone small{display:block;color:var(--mute);margin-top:4px;font-size:12.5px}

/* Glass-Tinted Modern Buttons */
.c{text-align:center;line-height:1.8}
.btn{
  border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;font-size:13.5px;
  background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;cursor:pointer;transition:all .16s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 4px 14px rgba(217,119,6,.22), inset 0 1px 0 rgba(255,255,255,.28)
}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.alt{background:linear-gradient(135deg,#3B82F6,#2563EB);box-shadow:0 4px 14px rgba(37,99,235,.22), inset 0 1px 0 rgba(255,255,255,.25)}
.btn.red{background:linear-gradient(135deg,#EF4444,#DC2626);box-shadow:0 4px 14px rgba(220,38,38,.22), inset 0 1px 0 rgba(255,255,255,.25)}
.btn.g{background:linear-gradient(135deg,#14B8A6,#0D9488);box-shadow:0 4px 14px rgba(13,148,136,.24), inset 0 1px 0 rgba(255,255,255,.28)}
.btn.ghost{background:var(--glass-soft);color:var(--ink);border:1px solid var(--glass-bd);box-shadow:none}
.btn.ghost:hover{background:var(--glass-strong);filter:none}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.acts .btn{flex:1;min-width:115px}

/* Glass Segmented Control */
.seg{
  display:flex;gap:4px;margin:10px 0;padding:4px;
  background:var(--glass-soft);border-radius:14px;border:1px solid var(--glass-bd);flex-wrap:wrap
}
.seg button{
  flex:1;min-width:74px;border:0;background:transparent;border-radius:10px;
  padding:8px 8px;font:inherit;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer;transition:all .16s
}
.seg button:hover{color:var(--ink)}
.seg button.on{
  background:var(--glass-strong);color:var(--g-ink);
  box-shadow:0 2px 10px rgba(15,23,42,.08);
}
.seg button.on[data-v=x]{color:#B45309}
.seg button.on[data-v=e]{color:#6D28D9}
[data-theme="dark"] .seg button.on{color:var(--g)}
[data-theme="dark"] .seg button.on[data-v=x]{color:#FCD34D}
[data-theme="dark"] .seg button.on[data-v=e]{color:#C4B5FD}

/* Frosted Inputs & Selects */
select,input{
  width:100%;padding:10px 12px;border:1px solid var(--glass-bd);border-radius:12px;
  font:inherit;font-size:13.5px;background:var(--glass-strong);color:var(--ink);
  box-shadow:inset 0 1px 2px rgba(15,23,42,.04);transition:border-color .15s,box-shadow .15s
}
select:focus,input:focus{outline:0;border-color:var(--g2);box-shadow:0 0 0 3px var(--g-soft)}
label{display:block;font-size:12.5px;margin:10px 0 4px;color:var(--mute);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}

/* Search & Filter Chips */
.search-bar{display:flex;gap:8px;align-items:center;margin:10px 0 6px;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:180px}
.search-box input{padding-inline-start:36px}
.search-box::before{content:"🔍";position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;opacity:.65}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.chip{
  border:1px solid var(--glass-bd);background:var(--glass-soft);color:var(--mute);
  border-radius:999px;padding:5px 13px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .16s
}
.chip:hover{background:var(--glass-strong);color:var(--ink)}
.chip.on{background:linear-gradient(135deg,#14B8A6,#0D9488);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(13,148,136,.24)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 11px;font-weight:700;font-size:12px}
.pill.ok{background:var(--g-soft);color:var(--g-ink)}.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}.pill.bad{background:var(--red-soft);color:var(--red-ink)}

/* Smart Highlighting Bar */
.smart-bar{
  background:var(--glass-soft);border:1px solid var(--glass-bd);border-inline-start:4px solid var(--g2);
  border-radius:14px;padding:10px 12px;margin:10px 0;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap
}
.smart-bar .smart-title{font-size:13px;font-weight:800;color:var(--g);white-space:nowrap}
.smart-bar select{flex:1;min-width:170px;padding:8px 10px;font-size:13px}
.smart-legend{width:100%;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:2px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-inline-end:4px}
.dot.ok{background:var(--smart-ok-bg);border:1.5px solid var(--smart-ok-bd)}
.dot.busy{background:var(--smart-busy-bg);border:1px solid var(--red)}

/* Glass Timetable Grid */
.gwrap{
  overflow-x:auto;margin-top:8px;border:1px solid var(--glass-bd);
  border-radius:16px;padding:7px;background:var(--glass-soft)
}
table.grid{width:100%;border-collapse:separate;border-spacing:5px;table-layout:fixed;min-width:460px}
.grid th,.grid td{text-align:center;padding:0;border:0;border-radius:11px}
.grid th{color:#fff;font-size:12.5px;padding:9px 4px;font-weight:700;box-shadow:0 2px 8px rgba(15,23,42,.1)}
.grid th.pc{width:64px;background:rgba(15,23,42,.82);color:#F8FAFC}
.grid td{height:58px;font-weight:700;color:var(--ink);background:var(--grid-empty);font-size:13.5px;line-height:1.25;position:relative;transition:all .15s}
.grid td.pc{background:var(--glass-strong);border:1px solid var(--glass-bd);color:var(--ink);font-size:15px;font-weight:800}
.grid td.pc small{display:block;font-size:10px;font-weight:600;color:var(--mute)}
.grid td.e{border:1.5px dashed var(--line);cursor:pointer}
.grid td.e:hover{border-color:var(--g2);background:var(--g-soft)}
.grid td.e.smart-ok{background:var(--smart-ok-bg);border:1.5px dashed var(--smart-ok-bd);color:var(--smart-ok-ink)}
.grid td.e.smart-ok::after{content:"✓ متاح";font-size:11px;font-weight:800;display:block}
.grid td.e.smart-busy{background:var(--smart-busy-bg);border:1px solid rgba(220,38,38,.3);color:var(--smart-busy-ink);opacity:.85}
.grid td.e.smart-busy::after{content:"✕ مشغول";font-size:10.5px;font-weight:700;display:block}
.grid td.c{box-shadow:0 4px 12px rgba(15,23,42,.14), inset 0 1px 0 rgba(255,255,255,.28);cursor:pointer;padding:4px 5px}
.grid td.c:hover{filter:brightness(1.06);transform:scale(1.015)}
.grid td.c small{display:block;font-size:10.5px;font-weight:600;opacity:.92;margin-top:1px}
.grid td.bad{outline:2.5px solid var(--red);outline-offset:1px}
.grid tr.brk-row td{height:30px;background:var(--warn-soft);color:var(--warn-ink);font-size:12px;font-weight:700;border-radius:9px}

/* Glass List Items */
.item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-inline-start:4px solid var(--g2);padding:12px 14px;cursor:pointer;transition:all .16s
}
.item:hover{transform:translateX(-2px);background:var(--glass-strong)}
.item b{font-size:15px;font-weight:700;display:block}.item small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.code{direction:ltr;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--glass-soft);border:1px solid var(--glass-bd);color:var(--ink);border-radius:8px;padding:2px 8px;font-size:12px;display:inline-block}
.subject-logo{display:block;width:30px;height:30px;object-fit:contain;margin:0 auto 2px;font-size:20px;line-height:30px;font-weight:800}
.print-table .subject-logo{width:26px;height:26px;font-size:20px;line-height:26px}
h3{color:var(--ink);margin-bottom:4px;font-size:16.5px;font-weight:800}
h4{margin:14px 0 6px;color:var(--g);font-size:14.5px;font-weight:800}
.note{font-size:13px;color:var(--mute);line-height:1.65}
.err{color:var(--red);font-size:13px;min-height:16px;margin-top:8px;font-weight:700}
.live-status{margin-top:10px;padding:9px 12px;border-radius:11px;font-size:13px;font-weight:700}
.live-status.ok{background:var(--g-soft);color:var(--g-ink)}
.live-status.bad{background:var(--red-soft);color:var(--red-ink)}

/* Glass Dialog & Toast */
dialog{
  border:1px solid var(--glass-bd);background:var(--glass-strong);color:var(--ink);
  backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border-radius:22px;padding:20px;width:min(94vw,470px);margin:auto;direction:rtl;
  max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg)
}
dialog::backdrop{background:rgba(15,23,42,.38);backdrop-filter:blur(6px)}
#toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;
  background:rgba(15,23,42,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:#F8FAFC;border:1px solid rgba(255,255,255,.16);
  border-radius:14px;padding:10px 18px;font-weight:700;font-size:13.5px;text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.22);max-width:92vw
}
[hidden]{display:none!important}
.ptab{width:100%;border-collapse:collapse}.ptab td,.ptab th{padding:5px;text-align:right;border-bottom:1px solid var(--line)}.ptab input{padding:6px;font-size:13px}.ptab td:first-child{width:68px;font-size:13px;font-weight:700}

/* Print Styles (Always Crisp White) */
.print-page{background:#fff;color:#111;direction:rtl;page-break-after:always;break-after:page}
.print-page:last-child{page-break-after:auto;break-after:auto}
.print-page h1{text-align:center;font-size:21px;margin-bottom:3px;color:#111}
.print-page h2{text-align:center;font-size:17px;margin-bottom:8px;color:#0F766E}
.print-page .print-meta{text-align:center;color:#444;font-size:11.5px;margin-bottom:8px}
.print-table{width:100%;border-collapse:collapse;table-layout:fixed}
.print-table th,.print-table td{border:1px solid #222;text-align:center;padding:5px 3px;height:54px;vertical-align:middle;color:#111;background:#fff}
.print-table th{background:#E5E7EB;font-weight:800;font-size:11.5px}
.print-table th small{display:block;font-size:9.5px;font-weight:600;color:#333;margin-top:2px}
.print-table th.day,.print-table td.day{width:84px;background:#F1F5F9;font-weight:800;font-size:12px}
.print-table td small{display:block;font-size:10px;margin-top:2px;color:#333}
.print-table hr{border:0;border-top:1px dashed #999;margin:3px 0}
.print-actions{display:flex;gap:8px;flex-wrap:wrap}.print-actions .btn{flex:1;min-width:140px}


.sub-card{border-inline-start:4px solid var(--gold);padding:14px}
.sub-slot{background:var(--glass-soft);border:1px solid var(--glass-bd);border-radius:13px;padding:10px 12px;margin-top:8px;display:grid;gap:8px}
.sub-slot-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.sub-slot-pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub-slot-pick select{flex:1;min-width:200px}
.cand-chips{display:flex;gap:6px;flex-wrap:wrap}
.cand-chip{border:1px solid var(--glass-bd);background:var(--glass-strong);color:var(--ink);border-radius:999px;padding:4px 10px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;transition:.15s}
.cand-chip:hover{border-color:var(--g2);color:var(--g-ink)}
.cand-chip.same{border-color:rgba(16,185,129,.45);background:var(--g-soft);color:var(--g-ink)}
.cand-chip.on{background:var(--g2);color:#fff;border-color:transparent}


.grid td.c[draggable="true"]{cursor:grab}
.grid td.c.dragging{opacity:.45;transform:scale(.96)}
.grid td.drop-over{outline:2.5px dashed var(--blue)!important;background:rgba(37,99,235,.14)!important}

/* Pastel Subject Cards (Live Grid + Premium Print Layout) */
.grid td.c{
  padding:4px 5px;border-radius:11px;
  border:1.5px solid var(--sc-bd,#CBD5E1);
  border-top:3.5px solid var(--sc-bd,#0D9488);
  background:var(--sc-bg,#F8FAFC)!important;
  color:var(--sc-ink,#0F172A)!important;
  box-shadow:0 2px 8px rgba(15,23,42,.06);
}
[data-theme="dark"] .grid td.c{
  background:var(--sc-dbg,rgba(30,41,59,.82))!important;
  color:var(--sc-dink,#F8FAFC)!important;
  border-color:var(--sc-bd,#334155);
}
.grid td.c .cell-in{display:flex;align-items:center;justify-content:center;gap:5px;flex-direction:column;height:100%}
.grid td.c .sub-svg{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.grid td.c .sub-svg svg{width:22px;height:22px;display:block}
.grid td.c .cell-txt b{display:block;font-size:12.5px;font-weight:800;line-height:1.15}
.grid td.c .cell-txt small{display:block;font-size:10px;font-weight:600;opacity:.82;margin-top:1px}

/* Premium Print Schedule (matching reference card layout) */
.print-page{
  background:#fff;color:#111;direction:rtl;
  page-break-after:always;break-after:page;
  border:1.5px solid #1B4353;border-radius:12px;overflow:hidden;
  padding:0;margin-bottom:10px;
}
.print-page:last-child{page-break-after:auto;break-after:auto}
.p-banner{
  background:#1B4353;color:#fff;padding:10px 16px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.p-banner-r{display:flex;align-items:center;gap:10px}
.p-banner-ico{
  width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.12);
  border:1.5px solid #F59E0B;color:#FCD34D;display:flex;align-items:center;justify-content:center;flex-shrink:0
}
.p-banner h1{font-size:19px;font-weight:800;color:#fff;text-align:right;margin:0;line-height:1.2}
.p-banner .p-sub{font-size:11.5px;color:#CBD5E1;margin-top:2px;text-align:right}
.p-badge{
  background:#fff;color:#1B4353;border:2px solid #F59E0B;border-radius:10px;
  padding:4px 14px;text-align:center;min-width:86px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.p-badge small{display:block;font-size:9px;font-weight:700;color:#64748B;line-height:1.1}
.p-badge b{display:block;font-size:16px;font-weight:800;color:#1B4353;line-height:1.2}
.p-body{padding:8px 10px 6px}
.print-table{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed}
.print-table th{
  background:#1B4353;color:#fff;font-weight:800;font-size:10.5px;
  border:0;border-radius:7px;padding:5px 2px;height:auto;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.print-table th small{display:block;font-size:8.5px;font-weight:600;color:#CBD5E1;margin-top:1px}
.print-table th.day{width:76px;background:#133240}
.print-table td.day{
  width:76px;background:#F1F5F9;color:#1B4353;font-weight:800;font-size:12px;
  border:1px solid #CBD5E1;border-radius:8px;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.print-table td.p-empty{
  background:#FAFBFD;border:1px solid #E2E8F0;border-radius:8px;height:52px;
}
.print-table td.p-slot{
  border-radius:9px;padding:4px 6px;height:52px;vertical-align:middle;
  border:1.5px solid var(--sc-bd,#CBD5E1);
  border-top:3.5px solid var(--sc-bd,#0D9488);
  background:var(--sc-bg,#F8FAFC);
  color:var(--sc-ink,#0F172A);
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.p-card{display:flex;align-items:center;justify-content:center;gap:8px;height:100%}
.p-card.single{flex-direction:column;gap:2px}
.p-card .p-ico{flex-shrink:0;display:flex;align-items:center;justify-content:center}
.p-card .p-ico svg{width:34px;height:28px;display:block}
.p-card.single .p-ico svg{width:26px;height:22px}
.p-card .p-ico img{width:28px;height:28px;object-fit:contain}
.p-card .p-txt{text-align:center;min-width:0}
.p-card .p-txt b{display:block;font-size:12px;font-weight:800;color:var(--sc-ink,#0F172A);line-height:1.15}
.p-card.single .p-txt b{font-size:10.5px}
.p-card .p-txt small{display:block;font-size:9.5px;font-weight:600;color:#334155;margin-top:1px}
.p-footer{
  display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
  padding:6px 12px 8px;border-top:1px solid #E2E8F0;background:#F8FAFC;font-size:10px;color:#334155;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.p-legend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:700}
.p-legend span{display:inline-flex;align-items:center;gap:4px}
.p-legend i{display:inline-block;width:8px;height:8px;border-radius:50%}

/* 4-per-A4 ink & paper saver grid */
.print-sheet-4{
  display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:4mm;
  width:100%;height:190mm;background:#fff;color:#111;direction:rtl;
  page-break-after:always;break-after:page;box-sizing:border-box
}
.print-sheet-4:last-child{page-break-after:auto;break-after:auto}
.mini-card{
  border:0.7pt dashed #888;border-radius:3mm;padding:2.5mm;
  display:flex;flex-direction:column;justify-content:space-between;
  background:#fff;color:#111;overflow:hidden
}
.mini-head{display:flex;justify-content:space-between;align-items:baseline;gap:4px;border-bottom:0.8pt solid #333;padding-bottom:1.5mm;margin-bottom:1.5mm}
.mini-head b{font-size:10.5px;color:#000}
.mini-head small{font-size:8.5px;color:#444;white-space:nowrap}
.mini-table{width:100%;border-collapse:collapse;table-layout:fixed;flex:1}
.mini-table th,.mini-table td{border:0.5pt solid #444;text-align:center;padding:1px;vertical-align:middle;color:#111;background:#fff;line-height:1.15}
.mini-table th{background:#F3F4F6;font-size:7.5px;font-weight:800;height:6mm}
.mini-table th small{display:block;font-size:6.5px;font-weight:600;color:#444}
.mini-table th.day,.mini-table td.day{width:13mm;background:#F8FAFC;font-size:7.5px;font-weight:800}
.mini-table td{font-size:8px;height:11.2mm}
.mini-table td b{display:block;font-size:8.5px;font-weight:800;color:#000}
.mini-table td small{display:block;font-size:6.8px;color:#333}
.mini-foot{display:flex;justify-content:space-between;font-size:7.5px;color:#555;margin-top:1mm}
#printArea{display:none}

/* Tablet */
@media(min-width:680px){
  .dashgrid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .grid td{height:64px;font-size:14.5px}
}

/* Desktop Expanded Floating Glass Sidebar */
@media(min-width:900px){
  :root{--side-gap:14px}
  body{padding-inline-start:calc(var(--sidebar-w) + var(--side-gap))}
  header.topbar{margin:14px 22px 0;padding:12px 22px;top:14px}
  nav.tabs{width:calc(var(--sidebar-w) - var(--side-gap))}
  nav.tabs .side-head{flex-direction:row;align-items:center;justify-content:flex-start;text-align:right;padding:16px;gap:11px}
  nav.tabs .side-head .side-txt{display:block;min-width:0}
  nav.tabs .side-head b{display:block;font-size:15.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.tabs .side-head small{display:block;font-size:11.5px;color:var(--mute);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav.tabs .nav-links{padding:12px 10px;gap:5px}
  nav.tabs button{
    flex-direction:row;justify-content:flex-start;gap:11px;
    padding:10px 12px;border-radius:13px;font-size:13.5px;text-align:right
  }
  nav.tabs .side-foot{padding:12px}
  nav.tabs .side-foot .btn{padding:9px 12px;font-size:13px}
  main{max-width:1180px;margin:12px auto 0;padding:0 22px 28px}
}


/* Sidebar groups & desktop collapse */
nav.tabs .nav-grp{
  font-size:10.5px;font-weight:800;color:var(--mute);opacity:.78;
  padding:8px 10px 3px;display:none;letter-spacing:.2px
}
nav.tabs .nav-sep{height:1px;background:var(--line);margin:6px 10px}
nav.tabs .side-collapse{
  display:none;border:1px solid var(--glass-bd);background:var(--glass-soft);color:var(--mute);
  width:28px;height:28px;border-radius:9px;cursor:pointer;align-items:center;justify-content:center;
  flex-shrink:0;margin-inline-start:auto;transition:all .15s;font-size:13px
}
nav.tabs .side-collapse:hover{background:var(--glass-strong);color:var(--ink)}
nav.tabs .side-foot{gap:5px}

/* Interactive KPI cards & Progress Bar */
.dashstat.click{cursor:pointer}
.dashstat .kpi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dashstat .kpi-ico{
  width:32px;height:32px;border-radius:10px;background:var(--g-soft);color:var(--g-ink);
  display:flex;align-items:center;justify-content:center
}
.dashstat .kpi-ico svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dashstat:nth-child(2) .kpi-ico{background:rgba(59,130,246,.14);color:#2563EB}
.dashstat:nth-child(3) .kpi-ico{background:rgba(139,92,246,.14);color:#7C3AED}
.dashstat:nth-child(4) .kpi-ico{background:var(--warn-soft);color:var(--warn-ink)}
.dashstat .kpi-arr{font-size:13px;color:var(--mute);opacity:.6;transition:transform .15s}
.dashstat.click:hover .kpi-arr{transform:translateX(-3px);opacity:1;color:var(--g)}

.prog-wrap{margin-top:12px}
.prog-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-bottom:6px}
.prog-track{height:10px;border-radius:999px;background:var(--glass-soft);border:1px solid var(--glass-bd);overflow:hidden}
.prog-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#0D9488,#06B6D4);transition:width .35s ease}
.dash-cols{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:760px){.dash-cols{grid-template-columns:1.25fr 1fr}}

/* Compact Plan Toolbar */
.plan-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.plan-top .seg{margin:0;flex:0 0 auto}
.plan-top .seg button{padding:7px 12px;min-width:auto}
.plan-top .search-box{flex:1;min-width:140px}
.plan-top select#pSel{flex:1.2;min-width:165px;padding:8px 10px}
.plan-sub{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:8px}
.plan-sub .seg{margin:0;flex:0 0 auto}
.plan-sub .seg button{padding:6px 11px;min-width:auto;font-size:12.5px}
.smart-toggle{
  border:1px solid var(--glass-bd);background:var(--glass-soft);color:var(--ink);
  border-radius:11px;padding:7px 12px;font:inherit;font-size:12.5px;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:all .15s
}
.smart-toggle:hover{background:var(--glass-strong)}
.smart-toggle.on{background:var(--g-soft);color:var(--g-ink);border-color:rgba(13,148,136,.35)}

@media(min-width:900px){
  nav.tabs .nav-grp{display:block}
  nav.tabs .nav-sep{display:none}
  nav.tabs .side-collapse{display:inline-flex}
  body.side-mini{padding-inline-start:calc(var(--rail-w) + var(--side-gap))}
  body.side-mini nav.tabs{width:calc(var(--rail-w) - var(--side-gap))}
  body.side-mini nav.tabs .side-head{flex-direction:column;padding:12px 6px;gap:6px}
  body.side-mini nav.tabs .side-head .side-txt,
  body.side-mini nav.tabs .nav-grp{display:none}
  body.side-mini nav.tabs .nav-sep{display:block}
  body.side-mini nav.tabs .side-collapse{margin-inline-start:0}
  body.side-mini nav.tabs button{flex-direction:column;justify-content:center;gap:3px;padding:8px 3px;font-size:10px}
  body.side-mini nav.tabs .side-foot .btn{padding:7px 4px;font-size:10.5px}
}

@page{size:A4 landscape;margin:6mm}
@media print{
  body{background:#fff!important;color:#111!important;padding:0!important}
  body>header,body>main,body>nav,body>dialog,body>#toast{display:none!important}
  #printArea{display:block!important;padding:0}
  .print-page{display:block!important}.print-sheet-4{display:grid!important}
  .print-table td.p-empty,.print-table td.p-slot,.print-table td.day{height:21mm;font-size:11px}
  .print-table td small{font-size:9.5px}
}

<script>
const $=s=>document.querySelector(s),pad2=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins=t=>{const[a,b]=String(t||'0:0').split(':');return+a*60+ +b};
const hm=t=>{const[h,m]=String(t||'0:0').split(':').map(Number);return(h%12||12)+':'+pad2(m||0)};

const classIsNumbered=n=>{const p=String(n).split('/').map(Number);return p.length===2&&p[0]>=1&&p[0]<=6&&p[1]>=1};
const classSelectOptions=(selected,filterTxt='')=>{
  const q=normAr(filterTxt),groups=[],usedIds=new Set();
  for(let g=1;g<=6;g++){
    const list=S.classes.filter(c=>String(c.name).startsWith(g+'/')&&(!q||normAr(c.name).includes(q)))
      .sort((a,b)=>a.name.localeCompare(b.name,'en',{numeric:true}));
    if(list.length){
      list.forEach(c=>usedIds.add(c.id));
      groups.push('<optgroup label="الصف '+g+'">'+list.map(c=>'<option value="'+c.id+'"'+(c.id===selected?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</optgroup>');
    }
  }
  const rest=S.classes.filter(c=>!usedIds.has(c.id)&&(!q||normAr(c.name).includes(q)));
  return groups.join('')+(rest.length?'<optgroup label="فصول أخرى">'+rest.map(c=>'<option value="'+c.id+'"'+(c.id===selected?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</optgroup>':'');
};

/* ---------- Theme (Dark Mode) ---------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('sp1theme',t);
  const isD=t==='dark';
  $('#btnTheme').textContent=isD?'☀️':'🌙';
  $('#btnTheme').title=isD?'تبديل للوضع الفاتح':'تبديل للوضع الليلي';
  $('#sideTheme').textContent=isD?'☀️ فاتح':'🌙 ليلي';
  const meta=$('meta[name="theme-color"]');if(meta)meta.content=isD?'#070B14':'#0F172A';
}
(function initTheme(){
  const saved=localStorage.getItem('sp1theme');
  const pref=saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  applyTheme(pref);
})();
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')}

/* ---------- Undo / Redo ---------- */
const UNDO=[],REDO=[],MAX_HIST=35;
function pushUndo(label){
  UNDO.push({snap:JSON.stringify(S),label:label||'تعديل'});
  if(UNDO.length>MAX_HIST)UNDO.shift();
  REDO.length=0;
  updUndoBtns();
}
function updUndoBtns(){
  const u=$('#btnUndo'),r=$('#btnRedo');
  if(u){u.disabled=!UNDO.length;u.title=UNDO.length?'تراجع عن: '+UNDO[UNDO.length-1].label+' (Ctrl+Z)':'لا يوجد تراجع'}
  if(r){r.disabled=!REDO.length;r.title=REDO.length?'إعادة: '+REDO[REDO.length-1].label+' (Ctrl+Y)':'لا توجد إعادة'}
}
function doUndo(){
  if(!UNDO.length)return;
  const prev=UNDO.pop();
  REDO.push({snap:JSON.stringify(S),label:prev.label});
  S=Object.assign(def(),JSON.parse(prev.snap));norm();
  save();updUndoBtns();go();
  toast('↩️ تم التراجع عن: '+prev.label);
}
function doRedo(){
  if(!REDO.length)return;
  const next=REDO.pop();
  UNDO.push({snap:JSON.stringify(S),label:next.label});
  S=Object.assign(def(),JSON.parse(next.snap));norm();
  save();updUndoBtns();go();
  toast('↪️ تمت إعادة: '+next.label);
}

const normAr=s=>String(s||'').toLowerCase().replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();
const tById=id=>S.teachers.find(t=>t.id===id),cById=id=>S.classes.find(c=>c.id===id),rById=id=>(S.rooms||[]).find(r=>r.id===id);
const tName=id=>(tById(id)||{}).name||'؟',cName=id=>(cById(id)||{}).name||'؟',rName=id=>(rById(id)||{}).name||'';
const used=t=>S.slots.filter(s=>s.t===t.id).reduce((a,s)=>a+s.n,0);
const st=s=>S.periods[s.sh][s.p-1].s,en=s=>S.periods[s.sh][s.p+s.n-2].e;
const rng=s=>[mins(st(s)),mins(en(s))],ovl=(a,b)=>a[0]<b[1]&&b[0]<a[1];

function conflicts(s,ignore){
  const out=new Set(),r=rng(s);
  const tObj=tById(s.t);
  if(tObj&&Array.isArray(tObj.offDays)&&tObj.offDays.includes(s.day)){
    out.add('المدرّس '+tName(s.t)+' غير متاح يوم '+DN[s.day]+' (يوم راحة)');
  }
  S.slots.forEach(o=>{
    if(o.id===ignore||o.day!==s.day||!ovl(r,rng(o)))return;
    if(o.t===s.t)out.add('المدرّس '+tName(s.t)+' عنده حصة تانية في نفس الوقت ('+SI[o.sh]+' '+SHN[o.sh]+')');
    if(o.c===s.c)out.add('الفصل '+cName(s.c)+' عنده حصة مع '+tName(s.t)+' في نفس الوقت');
    if(s.r&&o.r&&s.r===o.r)out.add('القاعة '+rName(s.r)+' محجوزة في نفس الوقت للفصل '+cName(o.c));
  });
  return[...out];
}
function allConflicts(){
  const g=new Map(),out=new Set();
  S.slots.forEach(s=>{
    const tObj=tById(s.t);
    if(tObj&&Array.isArray(tObj.offDays)&&tObj.offDays.includes(s.day)){
      out.add(DN[s.day]+': '+tName(s.t)+' مجدول في يوم راحته');
    }
    const r=rng(s);
    const pairs=[['t',s.t],['c',s.c]];
    if(s.r)pairs.push(['r',s.r]);
    pairs.forEach(([k,id])=>{const key=s.day+'|'+k+'|'+id;let a=g.get(key);if(!a){a=[];g.set(key,a)}a.push({s,r})});
  });
  g.forEach((arr,key)=>{if(arr.length<2)return;arr.sort((a,b)=>a.r[0]-b.r[0]);let mx=arr[0];
    for(let i=1;i<arr.length;i++){const x=arr[i];
      if(x.r[0]<mx.r[1]){const p=key.split('|');out.add(DN[p[0]]+': '+(p[1]==='t'?tName(x.s.t)+' عنده حصتين في نفس الوقت':p[1]==='r'?'القاعة '+rName(x.s.r)+' محجوزة مرتين':'الفصل '+cName(x.s.c)+' عنده حصتين في نفس الوقت'))}
      if(x.r[1]>mx.r[1])mx=x}});
  return[...out];
}

function csvRows(text){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const ch=text[i],nx=text[i+1];if(ch==='"'&&quote&&nx==='"'){cell+='"';i++;continue}if(ch==='"'){quote=!quote;continue}if(ch===','&&!quote){row.push(cell.trim());cell='';continue}if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&nx==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell='';continue}cell+=ch}if(cell||row.length){row.push(cell.trim());rows.push(row)}return rows}
function mapTeacherRows(rows){

  if(ix.name<0&&ix.code<0)return[];return rows.slice(1).map(r=>({code:String(r[ix.code<0?0:ix.code]||'').trim(),nationalId:String(r[ix.nationalId<0?'':ix.nationalId]||'').trim(),name:String(r[ix.name<0?1:ix.name]||'').trim(),subject:String(r[ix.subject<0?'':ix.subject]||'').trim(),quota:String(r[ix.quota<0?'':ix.quota]||'').trim(),phone:String(r[ix.phone<0?'':ix.phone]||'').trim()})).filter(x=>x.name||x.code)}

function restoreBackupFile(f){
  if(!f)return;
  f.text().then(x=>{
    try{
      const o=JSON.parse(x),d=o.data||o;
      if(!d||!Array.isArray(d.teachers)||!Array.isArray(d.slots))throw 0;
      if(!confirm('هيتم استرجاع النسخة الاحتياطية ('+d.teachers.length+' مدرّس و '+d.slots.length+' حصة) واستبدال البيانات الحالية. موافق؟'))return;
      pushUndo('استرجاع نسخة احتياطية');
      S=Object.assign(def(),d);norm();save();UI.sel={t:null,c:null};go();toast('اتسترجعت النسخة بنجاح ✓');
    }catch(err){const m=$('#bkMsg');if(m)m.textContent='الملف مش نسخة احتياطية صالحة.';toast('الملف مش نسخة احتياطية صالحة.')}
  });
}
function bindBackupDrop(){
  const dz=$('#bkDrop'),fi=$('#bkFile');if(!dz||!fi)return;
  dz.onclick=()=>{fi.value='';fi.click()};
  ['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));
  ['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));
  dz.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)restoreBackupFile(f)});
}
/* Find break position (after which period index) */
function breakAfterPeriod(sh){
  const b=S.brk[sh];if(!b||!b.s||!b.e)return -1;
  const bs=mins(b.s),P=S.periods[sh];
  for(let i=0;i<P.length-1;i++){
    if(mins(P[i].e)<=bs && bs<=mins(P[i+1].s))return i+1;
  }
  return -1;
}

function dayFromDate(iso){
  const parts=String(iso||'').split('-').map(Number);
  if(parts.length!==3)return new Date().getDay();
  return new Date(parts[0],parts[1]-1,parts[2]).getDay();
}
function coverCandidates(slot,dateStr,absentIds){
  const r=rng(slot),day=slot.day;
  const subKey=normAr(slot.sub);
  const busySubTeachers=new Set(
    (S.subs||[]).filter(x=>x.date===dateStr&&x.sh===slot.sh&&x.p===slot.p&&x.coverId).map(x=>x.coverId)
  );
  const out=[];
  S.teachers.forEach(t=>{
    if(t.id===slot.t||absentIds.has(t.id))return;
    if(Array.isArray(t.offDays)&&t.offDays.includes(day))return;
    if(busySubTeachers.has(t.id))return;
    const hasClass=S.slots.some(o=>o.t===t.id&&o.day===day&&ovl(r,rng(o)));
    if(hasClass)return;
    const sameSub=!!(subKey&&normAr(t.subject)===subKey);
    const daySubs=(S.subs||[]).filter(x=>x.date===dateStr&&x.coverId===t.id).length;
    const wkLoad=used(t);
    out.push({t,sameSub,daySubs,wkLoad});
  });
  out.sort((a,b)=>{
    if(a.sameSub!==b.sameSub)return a.sameSub?-1:1;
    if(a.daySubs!==b.daySubs)return a.daySubs-b.daySubs;
    return a.wkLoad-b.wkLoad;
  });
  return out;
}

function applyClassBudget(){
  const b=S.budget||{stage:'prim',counts:{}};
  const st=STAGES[b.stage]||STAGES.prim;
  const wanted=[];
  st.grades.forEach(g=>{
    const cnt=Math.max(0,Math.min(40,+b.counts[g]||0));
    const pref=(st.prefix&&st.prefix[g])||(g+'/');
    for(let n=1;n<=cnt;n++)wanted.push(pref+n);
  });
  if(!wanted.length){toast('اكتب عدد الفصول في صف واحد على الأقل.');return}
  pushUndo('توليد الفصول من الإحصائية');
  const wantedSet=new Set(wanted);
  let added=0,removed=0,keptBusy=0;
  // Remove unused numbered/KG classes not in new budget (keep any class that has scheduled slots)
  S.classes=S.classes.filter(c=>{
    if(wantedSet.has(c.name))return true;
    const isManaged=classIsNumbered(c.name)||/^KG[12]\//.test(c.name);
    if(!isManaged)return true;
    const hasSlots=S.slots.some(s=>s.c===c.id);
    if(hasSlots){keptBusy++;return true}
    removed++;return false;
  });
  const existing=new Set(S.classes.map(c=>c.name));
  wanted.forEach(name=>{
    if(!existing.has(name)){S.classes.push({id:uid(),name});existing.add(name);added++}
  });
  // Sort classes naturally
  S.classes.sort((a,b)=>a.name.localeCompare(b.name,'en',{numeric:true}));
  save();go();
  toast('✓ تم توليد '+wanted.length+' فصل ('+(added?'أُضيف '+added:'')+(added&&removed?' · ':'')+(removed?'حُذف '+removed:'')+((!added&&!removed)?'محدّث بالفعل':'')+')'+(keptBusy?' · تم الإبقاء على '+keptBusy+' فصل به حصص':''));
}

function buildPrintSection(kind,id,sh){
  const isAll=sh==='all';
  const P=S.periods[isAll?'m':sh];
  const shLabel=isAll?'كل الفترات':('الفترة '+SHN[sh]);
  const brk=!isAll&&S.brk[sh]&&S.brk[sh].s&&S.brk[sh].e?' · الفسحة: '+hm(S.brk[sh].s)+' - '+hm(S.brk[sh].e):'';
  const mainTitle=kind==='general'?'الجدول العام الأسبوعي':kind==='teacher'?'جدول الحصص الأسبوعي للمدرّس':'جدول الحصص الأسبوعي للفصل';
  const badgeLbl=kind==='general'?'الجدول':kind==='teacher'?'المدرّس':'الفصل الدراسي';
  const badgeVal=kind==='general'?shLabel:kind==='teacher'?tName(id):cName(id);

  // Count periods per subject for the footer legend
  const counts=new Map();
  const matchingSlots=S.slots.filter(s=>(isAll||s.sh===sh)&&(kind==='general'||(kind==='teacher'?s.t===id:s.c===id)));
  matchingSlots.forEach(s=>{const k=s.sub||'مادة';counts.set(k,(counts.get(k)||0)+s.n)});

  const rows=DAYS.map(d=>{
    let tds='';
    for(let i=0;i<P.length;){
      const p=i+1;
      const items=matchingSlots.filter(s=>s.day===d&&s.p<=p&&p<s.p+s.n);
      if(!items.length){tds+='<td class="p-empty"></td>';i++;continue}
      if(kind!=='general'&&items.length===1){
        const s=items[0];
        let span=1;
        // Merge consecutive periods of the exact same slot (or adjacent identical subject+teacher/class)
        if(s.p===p&&s.n>1){span=Math.min(s.n,P.length-i)}
        else{
          while(i+span<P.length){
            const nx=matchingSlots.filter(x=>x.day===d&&x.p<=(p+span)&&(p+span)<x.p+x.n);
            if(nx.length===1&&nx[0].sub===s.sub&&nx[0].t===s.t&&nx[0].c===s.c&&nx[0].sh===s.sh)span++;
            else break;
          }
        }
        const primary=kind==='teacher'?cName(s.c):(s.sub||tName(s.t));
        const rm=s.r?rName(s.r):'';const secondary=(kind==='teacher'?s.sub:tName(s.t))+(rm?' · '+rm:'');
        tds+='<td class="p-slot" colspan="'+span+'" style="'+subjectStyleVars(s.sub)+'"><div class="p-card'+(span===1?' single':'')+'"><div class="p-ico">'+subjectIconHTML(s.sub)+'</div><div class="p-txt"><b>'+esc(primary)+'</b><small>'+esc(secondary)+(isAll?' · '+SI[s.sh]:'')+'</small></div></div></td>';
        i+=span;
      }else{
        const s0=items[0];
        tds+='<td class="p-slot" style="'+subjectStyleVars(s0.sub)+'">'+items.map(s=>'<div style="font-size:9px;line-height:1.15"><b>'+esc(cName(s.c))+'</b> <small>'+esc(s.sub||tName(s.t))+'</small></div>').join('<hr>')+'</td>';
        i++;
      }
    }
    return'<tr><td class="day">'+DN[d]+'</td>'+tds+'</tr>';
  }).join('');

  const legendHTML=[...counts.entries()].map(([sub,cnt])=>{
    const th=subjectTheme(sub);
    const cntTxt=cnt===1?'حصة واحدة':cnt===2?'حصتان':cnt+' حصص';
    return'<span><i style="background:'+th.bd+'"></i>'+esc(sub)+' ('+cntTxt+')</span>';
  }).join('');

  const schoolMeta=[S.school.name||'جدول المدرسة',S.school.admin,S.school.gov].filter(Boolean).join(' · ')+' · '+shLabel+brk;
  return'<section class="print-page">'
   +'<div class="p-banner">'
   +'<div class="p-banner-r"><div class="p-banner-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>'
   +'<div><h1>'+esc(mainTitle)+'</h1><div class="p-sub">'+esc(schoolMeta)+'</div></div></div>'
   +'<div class="p-badge"><small>'+esc(badgeLbl)+'</small><b>'+esc(badgeVal)+'</b></div>'
   +'</div>'
   +'<div class="p-body"><table class="print-table"><thead><tr><th class="day">اليوم / الحصة</th>'
   +P.map((pr,i)=>'<th>الحصة '+(i+1)+(isAll?'':'<small>'+hm(pr.s)+'</small>')+'</th>').join('')
   +'</tr></thead><tbody>'+rows+'</tbody></table></div>'
   +'<div class="p-footer"><div class="p-legend">'+(legendHTML||'<span>لا توجد حصص مسجلة</span>')+'</div><div>تاريخ الطباعة: '+esc(printStamp())+'</div></div>'
   +'</section>';
}

function printAll(kind){
  applyPrintCfg();const sh=(S.printCfg&&S.printCfg.sh)||UI.printSh;UI.printLayout=(S.printCfg&&S.printCfg.layout)||UI.printLayout;
  const list=kind==='teacher'
    ? S.teachers
    : S.classes.filter(c=>S.slots.some(s=>s.c===c.id&&(sh==='all'||s.sh===sh)));
  if(!list.length){toast(kind==='teacher'?'لا يوجد مدرسون للطباعة.':'لا توجد فصول بها حصص في هذه الفترة.');return}
  if(kind==='teacher'&&UI.printLayout==='4'){
    const sheets=[];
    for(let i=0;i<list.length;i+=4){
      const chunk=list.slice(i,i+4);
      sheets.push('<section class="print-sheet-4">'+chunk.map(t=>buildMiniTeacherCard(t,sh)).join('')+'</section>');
    }
    $('#printArea').innerHTML=sheets.join('');
  }else{
    $('#printArea').innerHTML=list.map(x=>buildPrintSection(kind,x.id,sh)).join('');
  }
  setTimeout(()=>window.print(),80);
}

   +'<div class="row"><div><label>أقصى حصص في اليوم لنفس المادة/الفصل</label><select id="agMaxDay"><option value="1">حصة واحدة</option><option value="2" selected>حصتان كحد أقصى</option><option value="9">بدون قيد</option></select></div>'
   +'<div><label>الحصص الحالية</label><select id="agMode"><option value="fill">إكمال الفارغ فقط (الحفاظ على الموزّع)</option><option value="reset">إعادة توزيع الفترة بالكامل</option></select></div></div>'
   +'<div class="err" id="agErr"></div>'
   +'<div class="acts"><button class="btn g" id="agRun">⚡ ابدأ التوزيع التلقائي</button><button class="btn ghost" id="agNo">إلغاء</button></div>');
  $('#agNo').onclick=closeM;
  $('#agRun').onclick=()=>{
    const target=$('#agTarget').value,maxDay=+$('#agMaxDay').value,mode=$('#agMode').value;
    let clsList=target==='active'?activeCls:S.classes.filter(c=>String(c.name).startsWith(target+'/'));
    if(!clsList.length){$('#agErr').textContent='لا توجد فصول في النطاق المختار (أو اختر صفًا دراسيًا).';return}
    const P=S.periods[sh];
    const teachers=S.teachers.filter(t=>(+t.quota||0)>0);
    if(!teachers.length){$('#agErr').textContent='أضف نصابًا للمدرسين أولًا ليتمكن البرنامج من التوزيع.';return}
    pushUndo('توليد تلقائي للجدول');
    if(mode==='reset'){S.slots=S.slots.filter(s=>s.sh!==sh)}
    let added=0,unplaced=0;
    const tasks=[];
    teachers.forEach(t=>{
      const rem=Math.max(0,(+t.quota||0)-used(t));
      for(let i=0;i<rem;i++)tasks.push(t);
    });
    tasks.forEach(t=>{
      let placed=false;
      const orderedCls=[...clsList].sort((a,b)=>{
        const ca=S.slots.filter(s=>s.c===a.id&&s.sub===t.subject).length;
        const cb=S.slots.filter(s=>s.c===b.id&&s.sub===t.subject).length;
        return ca-cb;
      });
      for(const c of orderedCls){
        if(placed)break;
        const orderedDays=[...DAYS].sort((a,b)=>{
          const da=S.slots.filter(s=>s.c===c.id&&s.day===a&&s.sh===sh).length;
          const db=S.slots.filter(s=>s.c===c.id&&s.day===b&&s.sh===sh).length;
          return da-db;
        });
        for(const d of orderedDays){
          if(Array.isArray(t.offDays)&&t.offDays.includes(d))continue;
          const sameSubDay=S.slots.filter(s=>s.c===c.id&&s.day===d&&s.sh===sh&&s.sub===(t.subject||'')).reduce((a,s)=>a+s.n,0);
          if(sameSubDay>=maxDay)continue;
          for(let p=1;p<=P.length;p++){
            const probe={id:uid(),t:t.id,c:c.id,r:'',sub:t.subject||'',day:d,sh,p,n:1};
            if(!conflicts(probe,null).length){
              S.slots.push(probe);added++;placed=true;break;
            }
          }
          if(placed)break;
        }
      }
      if(!placed)unplaced++;
    });
    save();closeM();go();
    toast('✓ تم توزيع '+added+' حصة تلقائيًا'+(unplaced?' (تعذّر توزيع '+unplaced+' حصة بسبب القيود)':''));
  };
}

/* ---------- GitHub: مزامنة البيانات + النشر ---------- */
let syncing=false;
const hasData=()=>S.teachers.length||S.classes.length||S.slots.length;
const b64e=t=>btoa(unescape(encodeURIComponent(t))),b64d=b=>decodeURIComponent(escape(atob(b.replace(/\s/g,''))));
function gh(method,repo,path,body,raw){
  const u=CFG.api+'/repos/'+repo+'/contents/'+path.split('/').map(encodeURIComponent).join('/')+(method==='GET'?'?t='+Date.now():'');
  return fetch(u,{method,cache:'no-store',headers:Object.assign({'Authorization':'Bearer '+CFG.token,'Accept':raw?'application/vnd.github.raw+json':'application/vnd.github+json'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
}
async function ghGet(repo,path){
  const r=await gh('GET',repo,path);if(r.status===404)return null;if(!r.ok)throw new Error('http '+r.status);
  const j=await r.json();let text;
  if(j.content&&j.encoding==='base64')text=b64d(j.content);else{const rr=await gh('GET',repo,path,null,true);text=await rr.text()}
  return{sha:j.sha,text};
}
async function ghPut(repo,path,text,sha,msg){
  const body={message:msg,content:b64e(text)};if(sha)body.sha=sha;
  const r=await gh('PUT',repo,path,body);
  if(r.status===409||r.status===422){const e=new Error('conflict');e.conflict=true;throw e}
  if(!r.ok)throw new Error('http '+r.status);
  const j=await r.json();return j.content.sha;
}
const masterText=()=>JSON.stringify({app:'school-planner',v:1,data:S});
function cloud(){const e=$('#cl');if(!e)return;e.textContent=!cfgOk()?'':CFG.dirty?'☁️⏳':'☁️✓'}
const gitStatus=()=>!cfgOk()?'لسه ما اتضبطتش.':(CFG.dirty?'⏳ فيه تعديلات لسه ما اترفعتش. ':'')+(CFG.at?'آخر مزامنة: '+CFG.at:'');
function askSide(msg){return new Promise(res=>{modal('<h3>⚠️ اختلاف في البيانات</h3><p class="note" style="font-size:14px">'+msg+'</p><div class="acts"><button class="btn g" id="aR">⬇️ خد نسخة GitHub</button><button class="btn red" id="aL">⬆️ ارفع نسختي</button></div>');
  $('#aR').onclick=()=>{closeM();res('remote')};$('#aL').onclick=()=>{closeM();res('local')};$('#dlg').addEventListener('cancel',()=>res('none'),{once:true})})}
function applyRemote(g){
  try{const o=JSON.parse(g.text),d=o.data||o;S=Object.assign(def(),d);norm();persist();CFG.sha=g.sha;CFG.dirty=false;saveCfg();UI.sel={t:null,c:null};go();toast('اتحدّثت البيانات من GitHub ✓')}
  catch(e){toast('النسخة اللي على GitHub مش صالحة')}}
async function pushMaster(fromPull){
  if(!cfgOk())return;
  try{const sha=await ghPut(CFG.m.repo,CFG.m.path,masterText(),CFG.sha||undefined,'تحديث بيانات المدرسة');CFG.sha=sha;CFG.dirty=false;CFG.at=nowTxt();saveCfg()}
  catch(e){if(e.conflict&&!fromPull){syncing=false;await pullMaster(true);return}}
  cloud();const m=$('#gMsg');if(m)m.textContent=gitStatus()}
async function pullMaster(manual){
  if(!cfgOk()||syncing)return;syncing=true;
  try{
    const g=await ghGet(CFG.m.repo,CFG.m.path);
    if(!g){if(hasData())await pushMaster(true);else if(manual)toast('مفيش بيانات على GitHub لسه')}
    else if(g.sha===CFG.sha){if(CFG.dirty)await pushMaster(true);else if(manual)toast('كل حاجة محدّثة ✓')}
    else{let side='remote';
      if(CFG.dirty||(!CFG.sha&&hasData()))side=await askSide(CFG.dirty?'عندك تعديلات على الجهاز ده، وفيه نسخة تانية أحدث على GitHub.':'الجهاز ده فيه بيانات، وعلى GitHub بيانات تانية.');
      if(side==='remote')applyRemote(g);else if(side==='local'){CFG.sha=g.sha;saveCfg();await pushMaster(true)}}
    CFG.at=nowTxt();saveCfg()
  }catch(e){if(manual)toast('مقدرتش أتصل بـ GitHub. اتأكد من النت والمفتاح.')}
  syncing=false;cloud();const m=$('#gMsg');if(m)m.textContent=gitStatus()}
async function publishGH(){
  if(!CFG.token||!CFG.p.repo){toast('اضبط مستودع تطبيق المدرّس في الإعدادات الأول');return}
  const o=buildPub(),text=JSON.stringify(o);
  try{const cur=await ghGet(CFG.p.repo,CFG.p.path);await ghPut(CFG.p.repo,CFG.p.path,text,cur&&cur.sha,'نشر الجداول (النسخة '+o.version+')');toast('اتنشر ✓ هيوصل للمدرسين خلال دقيقة أو اتنين');go()}
  catch(e){toast(e.conflict?'حصل تعارض، جرّب تاني':'فشل النشر. اتأكد من النت والمفتاح.')}}
async function gitTest(){
  const out=[];
  for(const [lbl,repo,priv] of [['بيانات المدرسة',CFG.m.repo,true],['تطبيق المدرّس',CFG.p.repo,false]]){
    if(!repo){out.push(lbl+': مش مكتوب');continue}
    try{const r=await fetch(CFG.api+'/repos/'+repo,{headers:{Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json'},cache:'no-store'});
      if(!r.ok){out.push(lbl+': ✗ مش متاح ('+r.status+')');continue}
      const j=await r.json(),w=j.permissions&&j.permissions.push;
      out.push(lbl+': '+(w?'✓ تمام':'✗ المفتاح ملوش صلاحية كتابة')+(priv&&!j.private?' ⚠️ المستودع ده عام! لازم يكون خاص':''))}
    catch(e){out.push(lbl+': ✗ مفيش اتصال')}}
  $('#gTest').innerHTML=out.map(esc).join('<br>')}
function vGit(){return'<div class="card"><h3>المزامنة مع GitHub</h3><p class="note">البيانات بتتحفظ في مستودع خاص بيك وتتزامن بين موبايلك وكمبيوترك، والنشر للمدرسين بضغطة من غير رفع ملفات. المفتاح بيتحفظ على الجهاز ده بس.</p>'
  +'<label>مفتاح GitHub (Token)</label><input type="password" id="gT" value="'+esc(CFG.token)+'" style="direction:ltr" autocomplete="off">'
  +'<label>مستودع بيانات المدرسة (لازم يكون خاص)</label><input id="gM" value="'+esc(CFG.m.repo)+'" placeholder="اسمك/school-data" style="direction:ltr">'
  +'<label>مستودع تطبيق المدرّس (اللي عليه Pages)</label><input id="gP" value="'+esc(CFG.p.repo)+'" placeholder="اسمك/golden-schedule" style="direction:ltr">'
  +'<div class="note" id="gMsg" style="margin-top:8px">'+esc(gitStatus())+'</div><div class="note" id="gTest" style="font-weight:700"></div>'
  +'<div class="acts"><button class="btn alt" data-a="gtest">اختبار الاتصال</button><button class="btn g" data-a="gpull">⬇️ سحب</button><button class="btn" data-a="gpush">⬆️ حفظ الآن</button></div></div>'}

/* ---------- events ---------- */
$('#btnUndo').onclick=doUndo;
$('#btnRedo').onclick=doRedo;
$('#btnTheme').onclick=toggleTheme;
$('#sideTheme').onclick=toggleTheme;
if(localStorage.getItem('sp1mini')==='1')document.body.classList.add('side-mini');
const btnCol=$('#btnCollapse');
if(btnCol)btnCol.onclick=()=>{const on=document.body.classList.toggle('side-mini');localStorage.setItem('sp1mini',on?'1':'0')};
$('#warn').onclick=()=>{UI.tab='publish';go()};
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey){
    const tag=(document.activeElement||{}).tagName;
    if(tag==='INPUT'||tag==='TEXTAREA')return;
    if(e.key.toLowerCase()==='z'&&!e.shiftKey){e.preventDefault();doUndo()}
    else if(e.key.toLowerCase()==='y'||(e.key.toLowerCase()==='z'&&e.shiftKey)){e.preventDefault();doRedo()}
  }
});

$('#tabs').onclick=e=>{const b=e.target.closest('button[data-tab]');if(b){UI.tab=b.dataset.tab;go()}};
$('#main').onclick=e=>{
  const g=e.target.closest('[data-sid]');if(g&&UI.tab==='plan'){slotDlg(g.dataset.sid);return}
  const em=e.target.closest('td.e');if(em){slotDlg(null,+em.dataset.d,+em.dataset.p);return}
  const a=e.target.closest('[data-a]');if(!a)return;const v=a.dataset.v,id=a.dataset.id;
  switch(a.dataset.a){
    case'tab':UI.tab=v;go();break;
    case'print':printTable(a.dataset.kind,a.dataset.kind==='teacher'?(S.teachers[0]||{}).id:a.dataset.kind==='class'?(S.classes[0]||{}).id:null);break;
    case'printSelected':printTable(a.dataset.kind,$('#'+(a.dataset.kind==='teacher'?'printTeacher':'printClass')).value);break;
    case'printAll':printAll(a.dataset.kind);break;
    case'psh':UI.printSh=v;S.printCfg.sh=v;save();go();break;
    case'ply':UI.printLayout=v;S.printCfg.layout=v;save();go();break;
    case'mode':UI.mode=v;UI.planQ='';go();break;
    case'sh':UI.sh=v;go();break;
    case'clearSmart':UI.smart[UI.mode]='';UI.smartOpen=false;go();break;
    case'toggleSmart':UI.smartOpen=!UI.smartOpen;if(!UI.smartOpen)UI.smart[UI.mode]='';go();break;
    case'tf':UI.tF=v;go();break;
    case'cg':UI.cG=v;go();break;
    case'cused':UI.cUsedOnly=!UI.cUsedOnly;go();break;
    case'tadd':teacherDlg();break;case'tedit':teacherDlg(id);break;
    case'cadd':classDlg();break;case'cedit':classDlg(id);break;
    case'radd':roomDlg();break;case'redit':roomDlg(id);break;
    case'autoGen':autoGenDlg();break;
    case'subSh':UI.subSh=v;go();break;
    case'bStage':if(!S.budget)S.budget={stage:'prim',counts:{}};S.budget.stage=v;save();go();break;
    case'bStep':{if(!S.budget)S.budget={stage:'prim',counts:{}};if(!S.budget.counts)S.budget.counts={};const g=a.dataset.g,d=+a.dataset.d;S.budget.counts[g]=Math.max(0,Math.min(40,(+S.budget.counts[g]||0)+d));save();go();break}
    case'bApply':applyClassBudget();break;
    case'subAddAbs':{const sel=$('#subAddSel');const tid=sel&&sel.value;if(!tid){toast('اختر مدرّسًا أولًا.');return}if(!S.absents)S.absents={};const dt=UI.subDate;if(!Array.isArray(S.absents[dt]))S.absents[dt]=[];if(!S.absents[dt].includes(tid)){pushUndo('تسجيل غياب مدرّس');S.absents[dt].push(tid);save()}go();break}
    case'subRmAbs':{pushUndo('إلغاء غياب مدرّس');const dt=UI.subDate;if(S.absents&&Array.isArray(S.absents[dt]))S.absents[dt]=S.absents[dt].filter(x=>x!==id);S.subs=(S.subs||[]).filter(x=>!(x.date===dt&&x.absentId===id));save();go();break}
    case'subPick':setSubCover(a.dataset.slot,a.dataset.cid);break;
    case'subAutoFill':{
      const dt=UI.subDate,sh=UI.subSh,day=dayFromDate(dt),absSet=new Set((S.absents&&S.absents[dt])||[]);
      const need=S.slots.filter(s=>s.day===day&&s.sh===sh&&absSet.has(s.t)&&!(S.subs||[]).some(x=>x.date===dt&&x.slotId===s.id&&x.coverId)).sort((a,b)=>a.p-b.p);
      if(!need.length){toast('كل الحصص مغطاة بالفعل ✓');return}
      pushUndo('ترشيح تلقائي للاحتياطي');let ok=0;
      need.forEach(s=>{const cands=coverCandidates(s,dt,absSet);if(cands.length){S.subs.push({date:dt,slotId:s.id,sh:s.sh,day:s.day,p:s.p,n:s.n,absentId:s.t,coverId:cands[0].t.id,c:s.c,sub:s.sub,r:s.r||''});ok++}});
      save();go();toast('تم ترشيح بدلاء لـ '+ok+' من '+need.length+' حصة ✓');break}
    case'subPrint':printSubs();break;
    case'subWA':{
      const s=S.slots.find(x=>x.id===a.dataset.slot),rec=(S.subs||[]).find(x=>x.date===UI.subDate&&x.slotId===a.dataset.slot);
      if(!s||!rec||!rec.coverId)return;
      const cov=tById(rec.coverId),ph=String((cov&&cov.phone)||'').replace(/\D/g,''),num=ph?(ph.startsWith('0')?'2'+ph:ph):'';
      open('https://wa.me/'+num+'?text='+encodeURIComponent(subNotifyText(s,rec.coverId,UI.subDate)),'_blank');break}
    case'subShareAll':{
      const dt=UI.subDate,sh=UI.subSh,day=dayFromDate(dt),absSet=new Set((S.absents&&S.absents[dt])||[]);
      const list=S.slots.filter(s=>s.day===day&&s.sh===sh&&absSet.has(s.t)).sort((a,b)=>a.p-b.p);
      const lines=['📋 كشف الاحتياطي ليوم '+(DN[day]||'')+' '+dt+' ('+SHN[sh]+'):'];
      list.forEach(s=>{const rec=(S.subs||[]).find(x=>x.date===dt&&x.slotId===s.id);lines.push('• ح'+s.p+' | '+cName(s.c)+' ('+s.sub+') ← بديل: '+(rec&&rec.coverId?tName(rec.coverId):'لم يحدد')+' (بدل '+tName(s.t)+')')});
      open('https://wa.me/?text='+encodeURIComponent(lines.join('\n')),'_blank');break}
    case'pub':if(CFG.token&&CFG.p.repo)publishGH();else{const o=buildPub();dl('school.json',JSON.stringify(o,null,1));toast('اضبط GitHub عشان النشر يبقى تلقائي. اتنزّل الملف (النسخة '+o.version+')');go()}break;
    case'pubfile':{const o=buildPub();dl('school.json',JSON.stringify(o,null,1));toast('اتجهّز school.json (النسخة '+o.version+')');go();break}
    case'gtest':gitTest();break;case'gpull':pullMaster(true);break;case'gpush':pushMaster(false).then(()=>toast('اتحفظ على GitHub ✓'));break;
    case'copy':{const t=tById(id),l=linkOf(t);(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast('اتنسخ الرابط ✓')).catch(()=>prompt('انسخ الرابط:',l));break}
    case'wa':{const t=tById(id);const ph=String(t.phone||'').replace(/\D/g,'');const num=ph?(ph.startsWith('0')?'2'+ph:ph):'';open('https://wa.me/'+num+'?text='+encodeURIComponent('جدولك على تطبيق جدول الحصص:\n'+linkOf(t)+'\nكودك: '+t.code),'_blank');break}
    case'bk':dl('school-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'school-planner',v:1,data:S},null,2));try{localStorage.setItem('sp1bkAt',nowTxt())}catch(e){}go();toast('تم حفظ النسخة الاحتياطية بنجاح ✓');break;
    case'bkxlsx':exportExcelBackup();break;
    case'bkpick':{const fi=$('#bkFile');if(fi){fi.value='';fi.click()}break}
    case'bkreset':{if(!confirm('هل تريد مسح كل البيانات التجريبية الحالية (المدرسين والفصول والحصص) والبدء على نظافة؟'))return;pushUndo('مسح البيانات التجريبية');S=def();save();UI.sel={t:null,c:null};go();toast('تم مسح البيانات، البرنامج جاهز لإدخال بيانات مدرستك ✓');break}
  }
};

/* Live search inputs without losing focus */
$('#main').oninput=e=>{
  const t=e.target;
    if(t.dataset.bg){if(!S.budget)S.budget={stage:'prim',counts:{}};if(!S.budget.counts)S.budget.counts={};S.budget.counts[t.dataset.bg]=Math.max(0,+t.value||0);save();const st=STAGES[S.budget.stage]||STAGES.prim;const tot=st.grades.reduce((s,g)=>s+Math.max(0,+S.budget.counts[g]||0),0);const el=$('#bTotal');if(el)el.textContent=tot+' فصل';return}
  if(t.id==='tSearch'){UI.tQ=t.value;const el=$('#tList');if(el)el.innerHTML=renderTeachersList();return}
  if(t.id==='cSearch'){UI.cQ=t.value;const el=$('#cList');if(el)el.innerHTML=renderClassesList();return}
  if(t.id==='planSearch'){
    UI.planQ=t.value;
    const sel=$('#pSel');if(!sel)return;
    const m=UI.mode,q=normAr(UI.planQ);
    if(m==='c'){
      sel.innerHTML=classSelectOptions(UI.sel.c,UI.planQ);
      if(sel.value&&sel.value!==UI.sel.c){UI.sel.c=sel.value;go();$('#planSearch').focus();$('#planSearch').setSelectionRange(UI.planQ.length,UI.planQ.length)}
    }else{
      const fl=S.teachers.filter(x=>!q||normAr(x.name+' '+x.subject+' '+x.code).includes(q));
      sel.innerHTML=fl.length?fl.map(x=>'<option value="'+x.id+'"'+(x.id===UI.sel.t?' selected':'')+'>'+esc(x.name)+(x.subject?' - '+esc(x.subject):'')+'</option>').join(''):'<option value="">لا توجد نتائج مطابقة</option>';
      if(fl.length&&!fl.some(x=>x.id===UI.sel.t)){UI.sel.t=fl[0].id;go();$('#planSearch').focus();$('#planSearch').setSelectionRange(UI.planQ.length,UI.planQ.length)}
    }
  }
};

$('#main').onchange=e=>{
  const t=e.target;
    if(t.id==='subDate'){UI.subDate=t.value;go();return}
  if(t.dataset.subSlot){setSubCover(t.dataset.subSlot,t.value);return}
    if(t.id==='pFont'){S.printCfg.font=+t.value;save();go();return}
  if(t.id==='pRowH'){S.printCfg.rowH=+t.value;save();go();return}
  if(t.id==='pMargin'){S.printCfg.margin=+t.value;save();go();return}
  if(t.id==='pColors'){S.printCfg.colors=(t.value==='1');save();go();return}
  if(t.id==='pSel'){if(t.value){UI.sel[UI.mode]=t.value;go()}return}
  if(t.id==='smartSel'){UI.smart[UI.mode]=t.value;go();return}
  if(t.id==='gT'){CFG.token=t.value.trim();saveCfg();cloud();return}
  if(t.id==='gM'){CFG.m.repo=t.value.trim();CFG.sha='';saveCfg();cloud();return}
  if(t.id==='gP'){CFG.p.repo=t.value.trim();saveCfg();return}
  if(t.id==='base'){S.base=t.value.trim();save();return}
  if(t.dataset.logoText){const sub=t.dataset.logoText.trim();if(!S.subjectLogos)S.subjectLogos={};S.subjectLogos[sub]=t.value.trim()||defaultLogo(sub);save();go();return}
  if(t.dataset.logoFile){const f=t.files[0];if(!f)return;if(f.size>250000){toast('اللوجو كبير. اختار صورة أقل من 250 كيلوبايت');t.value='';return}const sub=t.dataset.logoFile.trim(),r=new FileReader();r.onload=()=>{if(!S.subjectLogos)S.subjectLogos={};S.subjectLogos[sub]=r.result;save();go();toast('اتحفظ لوجو '+sub+' ✓')};r.readAsDataURL(f);return}
  if(t.dataset.sc){S.school[t.dataset.sc]=t.value.trim();save();go();return}
  if(t.dataset.pk){const p=S.periods[t.dataset.pk][+t.dataset.i];const cur={s:p.s,e:p.e};cur[t.dataset.w]=t.value;
    if(!cur.s||!cur.e||mins(cur.e)<=mins(cur.s)){t.value=p[t.dataset.w];toast('النهاية لازم تكون بعد البداية');return}
    p[t.dataset.w]=t.value;save();go();return}
  if(t.dataset.bk){const b=S.brk[t.dataset.bk];b[t.dataset.w]=t.value;save();return}
  if(t.id==='bkFile'){restoreBackupFile(t.files[0])}
};


let dragSid=null;
$('#main').addEventListener('dragstart',e=>{
  const td=e.target.closest('td.c[data-sid]');
  if(!td||UI.tab!=='plan')return;
  dragSid=td.dataset.sid;td.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragSid);
});
$('#main').addEventListener('dragend',e=>{
  const td=e.target.closest('td.c');if(td)td.classList.remove('dragging');
  document.querySelectorAll('.drop-over').forEach(x=>x.classList.remove('drop-over'));
  dragSid=null;
});
$('#main').addEventListener('dragover',e=>{
  if(!dragSid||UI.tab!=='plan')return;
  const target=e.target.closest('td.e,td.c[data-sid]');
  if(!target||target.dataset.sid===dragSid)return;
  e.preventDefault();target.classList.add('drop-over');
});
$('#main').addEventListener('dragleave',e=>{
  const target=e.target.closest('td.e,td.c[data-sid]');
  if(target)target.classList.remove('drop-over');
});
$('#main').addEventListener('drop',e=>{
  if(!dragSid||UI.tab!=='plan')return;
  const target=e.target.closest('td.e,td.c[data-sid]');
  if(!target)return;
  e.preventDefault();
  document.querySelectorAll('.drop-over').forEach(x=>x.classList.remove('drop-over'));
  const src=S.slots.find(x=>x.id===dragSid);if(!src)return;
  if(target.classList.contains('e')){
    const nd=+target.dataset.d,np=+target.dataset.p;
    if(np+src.n-1>S.periods[src.sh].length){toast('الحصة المدمجة لا تتسع هنا.');return}
    const probe=Object.assign({},src,{day:nd,p:np});
    const cf=conflicts(probe,src.id);
    if(cf.length&&!confirm('تنبيه تعارض:\n'+cf.join('\n')+'\n\nهل تريد النقل يدويًا على أي حال؟'))return;
    pushUndo('نقل حصة يدويًا');src.day=nd;src.p=np;save();go();toast('✓ تم نقل الحصة');
  }else if(target.dataset.sid&&target.dataset.sid!==src.id){
    const dst=S.slots.find(x=>x.id===target.dataset.sid);if(!dst)return;
    if(src.n!==dst.n){toast('لا يمكن تبديل حصة مفردة مع حصة مدمجة مباشرة.');return}
    pushUndo('تبديل حصتين يدويًا');
    const td1=src.day,tp1=src.p;
    src.day=dst.day;src.p=dst.p;dst.day=td1;dst.p=tp1;
    save();go();toast('✓ تم تبديل الحصتين');
  }
});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go();
if(cfgOk())setTimeout(()=>pullMaster(false),800);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfgOk())pullMaster(false)});
