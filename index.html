<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<style>

*{box-sizing:border-box;margin:0}

.c{text-align:center;line-height:1.8}
.btn{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:800;background:var(--gold);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);cursor:pointer}
.btn.alt{background:#2563EB}.btn.red{background:var(--red)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.g{background:var(--g2)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:9px}

.seg button.on{border-color:var(--g2);background:#DCFCE7;color:#14532D}
.seg button.on[data-v=x]{border-color:#B45309;background:#FFE9C7;color:#7C2D12}.seg button.on[data-v=e]{border-color:#6D28D9;background:#EDE3FF;color:#4C1D95}
select,input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
label{display:block;font-size:13.5px;margin:10px 0 4px;color:var(--mute)}
.row{display:flex;gap:8px}.row>*{flex:1}
.pill{display:inline-block;border-radius:12px;padding:4px 10px;font-weight:800;font-size:13.5px}
.pill.ok{background:#DCFCE7;color:#166534}.pill.warn{background:#FEF3C7;color:#92400E}.pill.bad{background:#FEE2E2;color:#B91C1C}
.gwrap{overflow-x:auto}
table.grid{width:100%;border-collapse:separate;border-spacing:4px;table-layout:fixed;min-width:340px}
.grid th,.grid td{text-align:center;padding:0;border:0;border-radius:10px}
.grid th{color:#fff;font-size:12px;padding:9px 0;font-weight:800}.grid th.pc{width:52px;background:var(--g)}
.grid td{height:54px;font-weight:800;color:var(--navy);background:rgba(255,255,255,.75);font-size:15px;line-height:1.25}
.grid td.pc{background:#DCFCE7;font-size:17px}.grid td.pc small{display:block;font-size:10px;font-weight:600;color:var(--mute)}
.grid td.e{border:2px dashed rgba(20,83,45,.25);cursor:pointer}.grid td.c{box-shadow:0 2px 0 rgba(0,0,0,.2);cursor:pointer}

.code{direction:ltr;font-family:monospace;background:#F1F5F9;border-radius:8px;padding:2px 8px;font-size:13px}.subject-logo{display:block;width:34px;height:34px;object-fit:contain;margin:0 auto 3px;font-size:25px;line-height:34px;font-weight:900}.print-table .subject-logo{width:30px;height:30px;font-size:23px}
h3{color:var(--g);margin-bottom:4px}h4{margin:14px 0 4px;color:var(--g)}
.note{font-size:13px;color:var(--mute);line-height:1.7}.err{color:var(--red);font-size:13px;min-height:16px;margin-top:8px;font-weight:700}
.tabs{position:fixed;bottom:0;inset-inline:0;background:rgba(255,255,255,.97);border-top:4px solid #FFC62E;border-radius:18px 18px 0 0;display:flex;justify-content:space-around;padding:8px 4px 10px;z-index:5}
.tabs button{border:0;background:none;font:inherit;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:800;color:var(--mute);cursor:pointer;min-width:58px}

.tabs button.on{color:var(--g)}.tabs button.on i{background:var(--g2);color:#fff}
dialog{border:0;border-radius:18px;padding:16px;width:min(94vw,460px);margin:auto;direction:rtl;max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(20,40,30,.55)}
#toast{position:fixed;top:10px;inset-inline:10px;z-index:99;background:var(--g2);color:#fff;border-radius:14px;padding:12px 14px;font-weight:800;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.3)}
[hidden]{display:none!important}
.ptab{width:100%;border-collapse:collapse}.ptab td{padding:3px}.ptab input{padding:6px;font-size:13px}.ptab td:first-child{width:52px;font-size:13px}
.print-page{background:#fff;color:#111;direction:rtl}.print-page h1{text-align:center;font-size:24px;margin-bottom:4px}.print-page h2{text-align:center;font-size:20px;margin-bottom:12px}.print-page .print-meta{text-align:center;color:#555;font-size:12px;margin-bottom:10px}.print-table{width:100%;border-collapse:collapse;table-layout:fixed}.print-table th,.print-table td{border:1px solid #222;text-align:center;padding:6px 3px;height:58px;vertical-align:middle}.print-table th{background:#E5E7EB;font-weight:800}.print-table th.day,.print-table td.day{width:92px;background:#F1F5F9;font-weight:800}.print-table td small{display:block;font-size:10px;margin-top:3px;color:#444}.print-actions{display:flex;gap:8px;flex-wrap:wrap}.print-actions .btn{flex:1;min-width:150px}
#printArea{display:none}
@media(min-width:700px){.grid td{height:62px;font-size:17px}.tabs{justify-content:center;gap:24px}}
@media print{body{background:#fff;padding:0}body>header,body>main,body>.tabs,body>dialog,body>#toast{display:none!important}#printArea{display:block!important;padding:8mm}.print-page{display:block!important}.print-table th,.print-table td{height:18mm;font-size:12px}.print-table td small{font-size:10px}}
</style>
</head>

<header><div><b id="hn"></b><small id="hs"></small></div><span><span id="cl" style="font-size:15px;margin-inline-end:6px"></span><span id="warn" hidden></span></span></header>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s),pad2=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mins=t=>{const[a,b]=t.split(':');return+a*60+ +b};
const hm=t=>{const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+pad2(m)};
const fm=m=>pad2(Math.floor(m/60))+':'+pad2(m%60);
const uid=()=>Math.random().toString(36).slice(2,9);
const DN={6:'السبت',0:'الأحد',1:'الاثنين',2:'الثلاثاء',3:'الأربعاء',4:'الخميس'},DAYS=[6,0,1,2,3,4];
const DAYC={6:'#7C3AED',0:'#2563EB',1:'#059669',2:'#F59E0B',3:'#EF4444',4:'#0EA5E9'};
const SI={m:'☀️',x:'🌤️',e:'🌙'},SHN={m:'صباحي',x:'ممتد',e:'مسائي'};
const PAL=['#F2545B','#3A86FF','#FFD93D','#8B5CF6','#2FBF71','#FF9F1C','#FF8FC7','#2EC4B6'],PFG=['#fff','#fff','#3B3000','#fff','#06361C','#3B2300','#4A0D2B','#05403B'];
const mkP=(a,len,gap)=>Array.from({length:9},(_,i)=>{const s=a+i*gap;return{s:fm(s),e:fm(s+len)}});
const def=()=>({v:1,pubVer:0,base:'',subjectLogos:{},school:{gov:'',admin:'',name:''},periods:{m:mkP(480,40,45),x:mkP(420,50,60),e:mkP(810,40,45)},brk:{m:{s:'',e:''},x:{s:'',e:''},e:{s:'',e:''}},teachers:[],classes:[],slots:[]});
const LS='sp1';let S=def();
try{Object.assign(S,JSON.parse(localStorage.getItem(LS)||'null')||{})}catch(e){}
function norm(){const d=def();Object.keys(d).forEach(k=>{if(S[k]===undefined)S[k]=d[k]});['m','x','e'].forEach(k=>{if(!Array.isArray(S.periods[k]))S.periods[k]=d.periods[k];if(!S.brk[k])S.brk[k]={s:'',e:''}})}
norm();
function ensureNumberedClasses(){
  const names=[];for(let g=1;g<=6;g++)for(let n=1;n<=20;n++)names.push(g+'/'+n);
  const existing=new Set(S.classes.map(c=>c.name));let added=0;
  names.forEach(name=>{if(!existing.has(name)){S.classes.push({id:uid(),name});existing.add(name);added++}});
  if(added)persist();
}
const classIsNumbered=n=>{const p=String(n).split('/').map(Number);return p.length===2&&p[0]>=1&&p[0]<=6&&p[1]>=1&&p[1]<=20};
const classSelectOptions=selected=>{const groups=[];for(let g=1;g<=6;g++){const names=[];for(let n=1;n<=20;n++){const c=S.classes.find(x=>x.name===g+'/'+n);if(c)names.push('<option value="'+c.id+'"'+(c.id===selected?' selected':'')+'>'+c.name+'</option>')}groups.push('<optgroup label="الصف '+g+'">'+names.join('')+'</optgroup>')}const rest=S.classes.filter(c=>!classIsNumbered(c.name));return groups.join('')+(rest.length?'<optgroup label="فصول أخرى">'+rest.map(c=>'<option value="'+c.id+'"'+(c.id===selected?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</optgroup>':'')};
let CFG={token:'',m:{repo:'',path:'master.json'},p:{repo:'',path:'school.json'},api:'https://api.github.com',sha:'',dirty:false,at:''};
try{Object.assign(CFG,JSON.parse(localStorage.getItem('sp1cfg')||'{}'))}catch(e){}
const saveCfg=()=>{try{localStorage.setItem('sp1cfg',JSON.stringify(CFG))}catch(e){}};
const cfgOk=()=>!!(CFG.token&&CFG.m.repo);
const nowTxt=()=>{const n=new Date();return n.toISOString().slice(0,10)+' '+pad2(n.getHours())+':'+pad2(n.getMinutes())};
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){} };
ensureNumberedClasses();
let pushT=null;
function markDirty(){if(!cfgOk())return;CFG.dirty=true;saveCfg();cloud();clearTimeout(pushT);pushT=setTimeout(()=>{if(!syncing)pushMaster(false)},2500)}
const save=()=>{persist();markDirty()};
let UI={tab:'dashboard',mode:'t',sh:'m',sel:{t:null,c:null}};

/* ---------- helpers ---------- */
const tById=id=>S.teachers.find(t=>t.id===id),cById=id=>S.classes.find(c=>c.id===id);
const tName=id=>(tById(id)||{}).name||'؟',cName=id=>(cById(id)||{}).name||'؟';
const used=t=>S.slots.filter(s=>s.t===t.id).reduce((a,s)=>a+s.n,0);
const st=s=>S.periods[s.sh][s.p-1].s,en=s=>S.periods[s.sh][s.p+s.n-2].e;
const rng=s=>[mins(st(s)),mins(en(s))],ovl=(a,b)=>a[0]<b[1]&&b[0]<a[1];
function conflicts(s,ignore){
  const out=new Set(),r=rng(s);
  S.slots.forEach(o=>{if(o.id===ignore||o.day!==s.day||!ovl(r,rng(o)))return;
    if(o.t===s.t)out.add('المدرّس '+tName(s.t)+' عنده حصة تانية في نفس الوقت ('+SI[o.sh]+' '+SHN[o.sh]+')');
    if(o.c===s.c)out.add('الفصل '+cName(s.c)+' عنده حصة مع '+tName(o.t)+' في نفس الوقت');});
  return[...out]}
function allConflicts(){
  const g=new Map(),out=new Set();
  S.slots.forEach(s=>{const r=rng(s);[['t',s.t],['c',s.c]].forEach(([k,id])=>{const key=s.day+'|'+k+'|'+id;let a=g.get(key);if(!a){a=[];g.set(key,a)}a.push({s,r})})});
  g.forEach((arr,key)=>{if(arr.length<2)return;arr.sort((a,b)=>a.r[0]-b.r[0]);let mx=arr[0];
    for(let i=1;i<arr.length;i++){const x=arr[i];
      if(x.r[0]<mx.r[1]){const p=key.split('|');out.add(DN[p[0]]+': '+(p[1]==='t'?tName(x.s.t)+' عنده حصتين في نفس الوقت':'الفصل '+cName(x.s.c)+' عنده حصتين في نفس الوقت'))}
      if(x.r[1]>mx.r[1])mx=x}});
  return[...out]}
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2600)}
function modal(html){const d=$('#dlg');d.innerHTML=html;if(!d.open)d.showModal();return d}
const closeM=()=>{if($('#dlg').open)$('#dlg').close()};
const newCode=()=>{let c;do{c='t-'+Math.random().toString(36).slice(2,10)}while(S.teachers.some(t=>t.code===c));return c};
const defaultLogo=sub=>{const s=String(sub||'').toLowerCase();if(/انجل|إنجل|english|eng/.test(s))return'Ｅ';if(/رياض|math/.test(s))return'➗';if(/عرب|arabic/.test(s))return'ع';if(/دين|relig|اسلام|إسلام/.test(s))return'🕌';if(/علوم|science/.test(s))return'⚗️';if(/دراسات|social/.test(s))return'🌍';if(/كمبيوتر|حاسب|computer/.test(s))return'💻';if(/فن|رسم|art/.test(s))return'🎨';if(/رياضة|بدن|sport/.test(s))return'⚽';return'📘'};
const logoFor=sub=>(S.subjectLogos&&S.subjectLogos[sub])||defaultLogo(sub);
const logoHTML=(sub,cls='subject-logo')=>{const v=logoFor(sub);return/^data:image\//.test(v)?'<img class="'+cls+'" src="'+esc(v)+'" alt="">':'<span class="'+cls+'">'+esc(v)+'</span>'};
const dl=(name,text)=>{const f=new File([text],name,{type:'application/json'});
  return(async()=>{try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();a.remove()})()};

function normHeader(v){return String(v||'').toLowerCase().replace(/[\\s_\-]/g,'').replace(/[إأآ]/g,'ا')}
function csvRows(text){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const ch=text[i],nx=text[i+1];if(ch==='"'&&quote&&nx==='"'){cell+='"';i++;continue}if(ch==='"'){quote=!quote;continue}if(ch===','&&!quote){row.push(cell.trim());cell='';continue}if((ch==='\\n'||ch==='\\r')&&!quote){if(ch==='\\r'&&nx==='\\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell='';continue}cell+=ch}if(cell||row.length){row.push(cell.trim());rows.push(row)}return rows}
function mapTeacherRows(rows){
  if(!rows.length)return[];const headers=rows[0].map(normHeader),find=names=>{const i=headers.findIndex(h=>names.some(n=>h.includes(n)));return i<0?-1:i};
  const ix={code:find(['الكود','code','كود']),nationalId:find(['الرقم القومي','الرقمالقومي','nationalid','national']),name:find(['اسم المعلم','الاسم','name']),subject:find(['المادة','subject']),quota:find(['النصاب','quota']),phone:find(['التليفون','الهاتف','الموبايل','phone'])};
  if(ix.name<0&&ix.code<0)return[];return rows.slice(1).map(r=>({code:String(r[ix.code<0?0:ix.code]||'').trim(),nationalId:String(r[ix.nationalId<0?'':ix.nationalId]||'').trim(),name:String(r[ix.name<0?1:ix.name]||'').trim(),subject:String(r[ix.subject<0?'':ix.subject]||'').trim(),quota:String(r[ix.quota<0?'':ix.quota]||'').trim(),phone:String(r[ix.phone<0?'':ix.phone]||'').trim()})).filter(x=>x.name||x.code)}
async function importTeacherFile(file){
  try{let rows=[];if(window.XLSX){const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''})}else{if(!/\\.csv$/i.test(file.name))throw new Error('xlsx');rows=csvRows(await file.text())}
    const list=mapTeacherRows(rows);if(!list.length){toast('لم أجد أعمدة مفهومة. استخدم: الكود، الرقم القومي، الاسم، المادة، النصاب، التليفون');return}
    const valid=list.filter(x=>x.name&&x.code),duplicates=valid.filter((x,i)=>valid.findIndex(y=>y.code===x.code)!==i||S.teachers.some(t=>t.code===x.code));
    modal('<h3>معاينة استيراد المعلمين</h3><p class="note">تم العثور على '+list.length+' صف، الصالح منها '+valid.length+'. سيتم تجاهل الأكواد المكررة أو الصفوف الناقصة.</p><div style="overflow:auto;max-height:45vh"><table class="ptab"><tr><th>الكود</th><th>الاسم</th><th>المادة</th><th>النصاب</th><th>التليفون</th></tr>'+valid.slice(0,30).map(x=>'<tr><td>'+esc(x.code)+'</td><td>'+esc(x.name)+'</td><td>'+esc(x.subject)+'</td><td>'+esc(x.quota)+'</td><td>'+esc(x.phone)+'</td></tr>').join('')+'</table></div><div class="err" id="impErr"></div><div class="acts"><button class="btn g" id="impOk">استيراد وحفظ</button><button class="btn ghost" id="impNo">إلغاء</button></div>');
    $('#impNo').onclick=closeM;$('#impOk').onclick=()=>{const usedCodes=new Set(S.teachers.map(t=>t.code)),add=valid.filter(x=>{if(!x.code||usedCodes.has(x.code))return false;usedCodes.add(x.code);return true});if(!add.length){$('#impErr').textContent='لا توجد صفوف جديدة صالحة للاستيراد.';return}add.forEach(x=>S.teachers.push({id:uid(),name:x.name,subject:x.subject,quota:x.quota===''?'':(+x.quota||0),code:x.code,nationalId:x.nationalId,phone:x.phone}));save();closeM();go();toast('تم استيراد '+add.length+' مدرس ✓')}
  }catch(e){toast('تعذر قراءة الملف. تأكد أنه Excel أو CSV صحيح.')}
}
function bindTeacherDrop(){const dz=$('#teacherDrop'),fi=$('#teacherFile');if(!dz||!fi)return;dz.onclick=()=>fi.click();fi.onchange=()=>{if(fi.files[0])importTeacherFile(fi.files[0]);fi.value=''};['dragenter','dragover'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',e=>{const f=e.dataTransfer.files[0];if(f)importTeacherFile(f)})}
/* ---------- views ---------- */
function vDashboard(){
  const cf=allConflicts(),totalQuota=S.teachers.reduce((a,t)=>a+(+t.quota||0),0),assigned=S.slots.reduce((a,s)=>a+s.n,0),remaining=Math.max(0,totalQuota-assigned);
  const workload=S.teachers.map(t=>({t,n:used(t),q:+t.quota||0})).sort((a,b)=>(b.n-b.q)-(a.n-a.q));
  const attention=workload.filter(x=>x.q&&x.n!==x.q).slice(0,6);
  const status=cf.length?'<span class="pill bad">'+cf.length+' تعارض يحتاج مراجعة</span>':S.slots.length?'<span class="pill ok">الجدول بلا تعارضات ✓</span>':'<span class="pill warn">لم تتم إضافة حصص بعد</span>';
  return'<div class="card"><h3>📊 لوحة الإدارة</h3><p class="note">ملخص سريع لحالة الجدول، ويمكنك الانتقال مباشرة إلى الجزء الذي يحتاج تعديلًا.</p><div style="margin-top:8px">'+status+'</div></div>'
   +'<div class="card"><div class="dashgrid">'
   +'<div class="dashstat"><b>'+S.teachers.length+'</b><small>مدرس</small></div>'
   +'<div class="dashstat"><b>'+S.classes.length+'</b><small>فصل</small></div>'
   +'<div class="dashstat"><b>'+assigned+'</b><small>حصة موزعة</small></div>'
   +'<div class="dashstat"><b>'+cf.length+'</b><small>تعارض</small></div>'
   +'</div></div>'
   +'<div class="card"><h3>📌 متابعة النصاب</h3>'+(attention.length?'<div class="dashlist">'+attention.map(x=>'<div class="dashrow"><div><b>'+esc(x.t.name)+'</b><small> · '+(x.q>x.n?'متبقي '+(x.q-x.n):'زيادة '+(x.n-x.q))+'</small></div><span class="pill '+(x.n>x.q?'bad':'warn')+'">'+x.n+' / '+x.q+'</span></div>').join('')+'</div>':'<p class="note">لا توجد ملاحظات على نصاب المدرسين حاليًا.</p>')+'</div>'
   +'<div class="card"><h3>⚡ إجراءات سريعة</h3><div class="acts"><button class="btn g" data-a="tab" data-v="teachers">إدارة المدرسين</button><button class="btn alt" data-a="tab" data-v="classes">إدارة الفصول</button><button class="btn" data-a="tab" data-v="plan">فتح الجدول</button><button class="btn ghost" data-a="tab" data-v="publish">النشر</button></div><p class="note" style="margin-top:8px">آخر نسخة منشورة: '+(S.pubVer||'لم يتم النشر بعد')+(CFG.at?' · آخر مزامنة '+esc(CFG.at):'')+'</p></div>'
   +'<div class="card"><h3>✅ حالة الإعداد</h3><div class="dashlist"><div class="dashrow"><b>مواعيد الحصص</b><span class="pill ok">'+Object.values(S.periods).filter(Array.isArray).length+' فترات</span></div><div class="dashrow"><b>الفصول التي بها حصص</b><span class="pill '+(S.classes.filter(c=>S.slots.some(s=>s.c===c.id)).length===S.classes.length?'ok':'warn')+'">'+S.classes.filter(c=>S.slots.some(s=>s.c===c.id)).length+' / '+S.classes.length+'</span></div><div class="dashrow"><b>المتبقي من النصاب المسجل</b><span class="pill '+(remaining?'warn':'ok')+'">'+remaining+'</span></div></div></div>'}
function vPlan(){
  if(!S.teachers.length||!S.classes.length)return'<div class="card c"><h3>ابدأ من هنا 👋</h3><p class="note">ضيف المدرسين والفصول الأول، وبعدين وزّع الحصص.</p><div class="acts"><button class="btn g" data-a="tab" data-v="teachers">👩‍🏫 المدرسين ('+S.teachers.length+')</button><button class="btn alt" data-a="tab" data-v="classes">🏫 الفصول ('+S.classes.length+')</button></div></div>';
  const m=UI.mode,list=m==='t'?S.teachers:S.classes;
  if(!list.some(x=>x.id===UI.sel[m]))UI.sel[m]=list[0].id;
  const id=UI.sel[m];let info='';
  if(m==='t'){const t=tById(id),u=used(t),q=+t.quota||0,d=q-u;info='<span class="pill '+(!q?'warn':d===0?'ok':d<0?'bad':'warn')+'">النصاب '+(q||'؟')+' · موزّع '+u+(q?(d>0?' · باقي '+d:d<0?' · زيادة '+(-d):' ✓'):'')+'</span>'}
  else info='<span class="pill ok">حصص الفصل: '+S.slots.filter(s=>s.c===id).reduce((a,s)=>a+s.n,0)+' في الأسبوع</span>';
  const P=S.periods[UI.sh],sl=S.slots.filter(s=>s.sh===UI.sh&&(m==='t'?s.t===id:s.c===id));
  let g='<div class="gwrap"><table class="grid"><tr><th class="pc">الحصة</th>'+DAYS.map(d=>'<th style="background:'+DAYC[d]+'">'+DN[d]+'</th>').join('')+'</tr>';
  for(let p=1;p<=P.length;p++){g+='<tr><td class="pc">'+p+'<small>'+hm(P[p-1].s)+'</small></td>';
    for(const d of DAYS){const c=sl.find(x=>x.day===d&&x.p<=p&&p<x.p+x.n);
      if(c){if(c.p===p){const k=m==='t'?S.classes.findIndex(z=>z.id===c.c):S.teachers.findIndex(z=>z.id===c.t),bad=conflicts(c,c.id).length;
        g+='<td class="c'+(bad?' bad':'')+'" rowspan="'+c.n+'" data-sid="'+c.id+'" style="background:'+PAL[Math.max(k,0)%8]+';color:'+PFG[Math.max(k,0)%8]+'">'+esc(m==='t'?cName(c.c):tName(c.t))+'<small>'+esc(m==='t'?c.sub:c.sub)+'</small></td>'}}
      else g+='<td class="e" data-d="'+d+'" data-p="'+p+'"></td>'}
    g+='</tr>'}
  g+='</table></div>';
  const sel='<select id="pSel">'+(m==='c'?classSelectOptions(id):list.map(x=>'<option value="'+x.id+'"'+(x.id===id?' selected':'')+'>'+esc(x.name)+(m==='t'&&x.subject?' - '+esc(x.subject):'')+'</option>').join(''))+'</select>';
  return'<div class="card"><div class="seg"><button data-a="mode" data-v="t" class="'+(m==='t'?'on':'')+'">👩‍🏫 بالمدرّس</button><button data-a="mode" data-v="c" class="'+(m==='c'?'on':'')+'">🏫 بالفصل</button></div>'
   +sel+'<div style="margin:8px 0">'+info+'</div><div class="seg">'+['m','x','e'].map(k=>'<button data-a="sh" data-v="'+k+'" class="'+(UI.sh===k?'on':'')+'">'+SI[k]+' '+SHN[k]+'</button>').join('')+'</div>'+g
   +'<p class="note" style="margin-top:6px">اضغط على أي خانة فاضية لإضافة حصة، أو على حصة موجودة لتعديلها.</p></div>'}
function vTeachers(){
  const tot=S.teachers.reduce((a,t)=>a+(+t.quota||0),0),us=S.teachers.reduce((a,t)=>a+used(t),0);
  return'<div class="card"><h3>👩‍🏫 المدرسين ('+S.teachers.length+')</h3><p class="note">إجمالي النصاب '+tot+' · الموزّع '+us+'</p><button class="btn g" data-a="tadd" style="width:100%;margin-top:6px">＋ إضافة مدرّس</button><div class="dropzone" id="teacherDrop" style="margin-top:10px"><b>اسحب ملف المعلمين هنا</b><small>Excel أو CSV · الكود، الرقم القومي، الاسم، المادة، النصاب، التليفون</small><input type="file" id="teacherFile" accept=".xlsx,.xls,.csv,text/csv" hidden></div></div>'
   +S.teachers.map(t=>{const u=used(t),q=+t.quota||0,d=q-u;return'<div class="card item" data-a="tedit" data-id="'+t.id+'"><div><b>'+esc(t.name)+'</b><small>'+esc(t.subject||'من غير مادة')+' · النصاب '+(q||'؟')+'</small></div><span class="pill '+(!q?'warn':d===0?'ok':d<0?'bad':'warn')+'">'+u+(q?' / '+q:'')+'</span></div>'}).join('')}
function vClasses(){
  return'<div class="card"><h3>🏫 الفصول ('+S.classes.length+')</h3><button class="btn g" data-a="cadd" style="width:100%;margin-top:6px">＋ إضافة فصول</button></div>'
   +S.classes.map(c=>'<div class="card item" data-a="cedit" data-id="'+c.id+'"><div><b>'+esc(c.name)+'</b><small>'+S.slots.filter(s=>s.c===c.id).reduce((a,s)=>a+s.n,0)+' حصة في الأسبوع</small></div><span>✏️</span></div>').join('')}
function printSelect(id,arr){return'<select id="'+id+'">'+(id==='printClass'?classSelectOptions(arr[0]&&arr[0].id):arr.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join(''))+'</select>'}
function vPrint(){
  return'<div class="card"><h3>🖨️ طباعة الجداول الأسبوعية</h3><p class="note">اختر نوع الجدول، ثم اضغط طباعة. كل نموذج يخرج في صفحة منظمة مناسبة للطباعة.</p><div class="print-actions"><button class="btn g" data-a="print" data-kind="general">🖨️ الجدول العام</button><button class="btn alt" data-a="print" data-kind="teacher">🖨️ جدول مدرس</button><button class="btn" data-a="print" data-kind="class">🖨️ جدول فصل</button></div></div>'
   +'<div class="card"><h4>طباعة جدول مدرس محدد</h4>'+printSelect('printTeacher',S.teachers)+'<button class="btn g" data-a="printSelected" data-kind="teacher" style="width:100%;margin-top:8px">طباعة المدرس المختار</button></div>'
   +'<div class="card"><h4>طباعة جدول فصل محدد</h4>'+printSelect('printClass',S.classes)+'<button class="btn" data-a="printSelected" data-kind="class" style="width:100%;margin-top:8px">طباعة الفصل المختار</button></div>'
   +'<div class="card"><p class="note">الجدول العام يعرض كل الفصول والمدرسين في شبكة واحدة. نموذج الفصل يعرض الأيام والحصص مع المادة واسم المدرس، مثل النموذج الورقي الذي طلبته.</p></div>'}
function printTable(kind,id){
  const title=kind==='general'?'الجدول العام':kind==='teacher'?'جدول المدرس: '+tName(id):'جدول الفصل: '+cName(id);
  const rows=DAYS.map(d=>'<tr><td class="day">'+DN[d]+'</td>'+Array.from({length:9},(_,i)=>{const p=i+1,items=S.slots.filter(s=>s.day===d&&s.p<=p&&p<s.p+s.n&&(kind==='general'||(kind==='teacher'?s.t===id:s.c===id)));return'<td>'+items.map(s=>logoHTML(s.sub)+'<b>'+esc(kind==='teacher'?cName(s.c):kind==='class'?s.sub:cName(s.c))+'</b><small>'+esc(kind==='teacher'?s.sub:kind==='class'?tName(s.t):tName(s.t))+'</small>').join('<hr>')+'</td>'}).join('')+'</tr>').join('');
  $('#printArea').innerHTML='<section class="print-page"><h1>'+esc(S.school.name||'جدول المدرسة')+'</h1><h2>'+esc(title)+'</h2><div class="print-meta">'+esc([S.school.gov,S.school.admin].filter(Boolean).join(' · '))+' · أسبوعي · تم الإنشاء '+nowTxt()+'</div><table class="print-table"><thead><tr><th class="day">اليوم</th>'+Array.from({length:9},(_,i)=>'<th>الحصة '+(i+1)+'<small>'+hm(S.periods.m[i].s)+' - '+hm(S.periods.m[i].e)+'</small></th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></section>';
  setTimeout(()=>window.print(),60)
}
function vPublish(){
  const cf=allConflicts();
  return'<div class="card"><h3>📤 نشر الجداول للمدرسين</h3>'
   +(cf.length?'<div class="pill bad">فيه '+cf.length+' تعارض لازم يتصلّح الأول</div><ul style="margin:8px 18px;font-size:13px">'+cf.slice(0,12).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<div class="pill ok">مفيش تعارضات ✓</div>')
   +'<div class="acts"><button class="btn g" data-a="pub">📤 نشر للمدرسين</button><button class="btn ghost" data-a="pubfile">⬇️ تنزيل الملف</button></div>'
   +'<p class="note" style="margin-top:8px">«نشر للمدرسين» بيرفع الملف <b>school.json</b> على مستودع تطبيق المدرّس لوحده (اضبطه من الإعدادات). وتطبيقات المدرسين بتتحدّث لما تتفتح. «تنزيل الملف» لو عايز ترفعه بإيدك.</p>'
   +'<label>رابط تطبيق المدرّس (للروابط اللي هتبعتها)</label><input id="base" placeholder="https://اسمك.github.io/golden-schedule/" value="'+esc(S.base)+'" style="direction:ltr">'
   +'<p class="note">آخر نسخة اتجهّزت: '+(S.pubVer||'لسه')+'</p></div>'
   +'<div class="card"><h4>🔗 رابط كل مدرّس</h4>'+(S.teachers.length?S.teachers.map(t=>'<div class="item" style="border-color:#2563EB"><div><b>'+esc(t.name)+'</b><small class="code">'+esc(t.code)+'</small></div><div style="display:flex;gap:6px"><button class="btn sm alt" data-a="copy" data-id="'+t.id+'">نسخ</button><button class="btn sm g" data-a="wa" data-id="'+t.id+'">واتساب</button></div></div>').join(''):'<p class="note">ضيف المدرسين الأول.</p>')+'</div>'}
function vSubjectLogos(){
  const subs=[...new Set(S.teachers.map(t=>t.subject).concat(S.slots.map(s=>s.sub)).filter(Boolean))];
  if(!subs.length)return'';
  return'<div class="card"><h3>🎨 شعارات المواد</h3><p class="note">لكل مادة شعار تلقائي. اكتب رمزًا قصيرًا أو ارفع صورة خاصة بها، وستظهر في جداول المدرسين والفصول والطباعة.</p>'+subs.map(sub=>'<div class="row" style="align-items:center;margin-top:8px"><div style="flex:0 0 42px;text-align:center">'+logoHTML(sub)+'</div><div><b>'+esc(sub)+'</b><input data-logo-text="'+esc(sub)+'" value="'+(S.subjectLogos&&S.subjectLogos[sub]&&String(S.subjectLogos[sub]).indexOf('data:image/')!==0?esc(S.subjectLogos[sub]):'')+'" placeholder="رمز مثل 📘" style="margin-top:4px"><input type="file" accept="image/*" data-logo-file="'+esc(sub)+'" style="margin-top:4px;font-size:12px"></div></div>').join('')+'</div>'}
function vSettings(){
  const pt=k=>'<table class="ptab">'+S.periods[k].map((p,i)=>'<tr><td>حصة '+(i+1)+'</td><td><input type="time" data-pk="'+k+'" data-i="'+i+'" data-w="s" value="'+p.s+'"></td><td><input type="time" data-pk="'+k+'" data-i="'+i+'" data-w="e" value="'+p.e+'"></td></tr>').join('')+'<tr><td>☕ فسحة</td><td><input type="time" data-bk="'+k+'" data-w="s" value="'+S.brk[k].s+'"></td><td><input type="time" data-bk="'+k+'" data-w="e" value="'+S.brk[k].e+'"></td></tr></table>';
  return'<div class="card"><h3>🏫 بيانات المدرسة</h3><label>المحافظة</label><input data-sc="gov" value="'+esc(S.school.gov)+'"><label>الإدارة</label><input data-sc="admin" value="'+esc(S.school.admin)+'"><label>اسم المدرسة</label><input data-sc="name" value="'+esc(S.school.name)+'"></div>'
   +'<div class="card"><h3>⏰ مواعيد الحصص والفسحة</h3><p class="note">التغيير بيتحفظ لوحده. النهاية لازم تكون بعد البداية.</p>'+['m','x','e'].map(k=>'<h4>'+SI[k]+' '+SHN[k]+'</h4>'+pt(k)).join('')+'</div>'+vSubjectLogos()
   +'<div class="card"><h3>💾 النسخة الاحتياطية</h3><div class="acts"><button class="btn g" data-a="bk">💾 أخذ نسخة احتياطية</button></div><label>استرجاع نسخة</label><input type="file" id="bkFile" accept=".json,application/json"><div class="err" id="bkMsg"></div></div>'+vGit()}
function go(){
  $('#hn').textContent=S.school.name||'جدول المدرسة';
  $('#hs').textContent=[S.school.gov,S.school.admin].filter(Boolean).join(' · ')||'توزيع الحصص على المدرسين';
  const cf=allConflicts().length;$('#warn').hidden=!cf;$('#warn').textContent='⚠️ '+cf+' تعارض';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===UI.tab));
  $('#main').innerHTML=({dashboard:vDashboard,plan:vPlan,teachers:vTeachers,classes:vClasses,publish:vPublish,print:vPrint,settings:vSettings})[UI.tab]();if(UI.tab==='teachers')bindTeacherDrop()}

/* ---------- dialogs ---------- */
function slotDlg(sid,day,p){
  const ex=sid?S.slots.find(s=>s.id===sid):null;
  const cur=ex||{t:UI.mode==='t'?UI.sel.t:S.teachers[0].id,c:UI.mode==='c'?UI.sel.c:S.classes[0].id,sub:'',day,sh:UI.sh,p,n:1};
  if(!ex)cur.sub=(tById(cur.t)||{}).subject||'';
  const P=S.periods[cur.sh],opt=(a,v)=>a.map(x=>'<option value="'+x.id+'"'+(x.id===v?' selected':'')+'>'+esc(x.name)+'</option>').join('');
  modal('<h3>'+(ex?'تعديل حصة':'إضافة حصة')+' ('+SI[cur.sh]+' '+SHN[cur.sh]+')</h3><label>المدرّس</label><select id="sT">'+opt(S.teachers,cur.t)+'</select><label>الفصل</label><select id="sC">'+classSelectOptions(cur.c)+'</select><label>المادة</label><input id="sS" value="'+esc(cur.sub)+'">'
   +'<div class="row"><div><label>اليوم</label><select id="sD">'+DAYS.map(d=>'<option value="'+d+'"'+(d===cur.day?' selected':'')+'>'+DN[d]+'</option>').join('')+'</select></div><div><label>تبدأ من</label><select id="sP">'+P.map((q,i)=>'<option value="'+(i+1)+'"'+(i+1===cur.p?' selected':'')+'>الحصة '+(i+1)+' ('+hm(q.s)+')</option>').join('')+'</select></div><div><label>المدة</label><select id="sN"><option value="1">حصة</option><option value="2"'+(cur.n===2?' selected':'')+'>حصتين</option></select></div></div>'
   +'<div class="err" id="sE"></div><div class="acts"><button class="btn g" id="sOk">حفظ</button><button class="btn ghost" id="sNo">إلغاء</button></div>'+(ex?'<div class="acts"><button class="btn red" id="sDel">🗑️ حذف الحصة</button></div>':''));
  let lastSub=cur.sub;
  $('#sT').onchange=()=>{const t=tById($('#sT').value);if(!$('#sS').value||$('#sS').value===lastSub){lastSub=t.subject||'';$('#sS').value=lastSub}};
  $('#sNo').onclick=closeM;
  if(ex)$('#sDel').onclick=()=>{if(confirm('تحذف الحصة دي؟')){S.slots=S.slots.filter(s=>s.id!==sid);save();closeM();go()}};
  $('#sOk').onclick=()=>{
    const s={id:sid||uid(),t:$('#sT').value,c:$('#sC').value,sub:$('#sS').value.trim(),day:+$('#sD').value,sh:cur.sh,p:+$('#sP').value,n:+$('#sN').value};
    if(s.p+s.n-1>P.length){$('#sE').textContent='الحصتين خارج عدد الحصص.';return}
    const cf=conflicts(s,sid);if(cf.length){$('#sE').innerHTML=cf.map(esc).join('<br>');return}
    if(sid)Object.assign(ex,s);else S.slots.push(s);
    save();closeM();go()}}
function teacherDlg(id){
  const ex=id?tById(id):null,t=ex||{name:'',subject:'',quota:'',code:newCode()};
  modal('<h3>'+(ex?'تعديل مدرّس':'مدرّس جديد')+'</h3><label>الاسم</label><input id="tN" value="'+esc(t.name)+'"><label>المادة</label><input id="tS" value="'+esc(t.subject)+'" placeholder="مثال: اللغة الإنجليزية"><label>النصاب (حصص الأسبوع)</label><input id="tQ" type="number" min="0" max="60" value="'+esc(t.quota)+'">'
   +'<label>كود المدرّس</label><div class="row"><input id="tC" value="'+esc(t.code)+'" style="direction:ltr"><button class="btn ghost sm" id="tG" style="flex:0 0 auto">🔄</button></div><p class="note">الكود بيدخّله المدرّس في تطبيقه عشان يستقبل جدوله.</p>'
   +'<div class="err" id="tE"></div><div class="acts"><button class="btn g" id="tOk">حفظ</button><button class="btn ghost" id="tNo">إلغاء</button></div>'+(ex?'<div class="acts"><button class="btn red" id="tDel">🗑️ حذف المدرّس</button></div>':''));
  $('#tG').onclick=()=>{$('#tC').value=newCode()};$('#tNo').onclick=closeM;
  if(ex)$('#tDel').onclick=()=>{if(confirm('هتحذف المدرّس وكل حصصه. متأكد؟')){S.teachers=S.teachers.filter(x=>x.id!==id);S.slots=S.slots.filter(s=>s.t!==id);save();closeM();go()}};
  $('#tOk').onclick=()=>{const n=$('#tN').value.trim(),c=$('#tC').value.trim();
    if(!n){$('#tE').textContent='اكتب الاسم.';return}if(!c||S.teachers.some(x=>x.code===c&&x.id!==id)){$('#tE').textContent='الكود فاضي أو مستخدم.';return}
    const rec={name:n,subject:$('#tS').value.trim(),quota:$('#tQ').value===''?'':+$('#tQ').value,code:c};
    if(ex)Object.assign(ex,rec);else S.teachers.push(Object.assign({id:uid()},rec));save();closeM();go()}}
function classDlg(id){
  const ex=id?cById(id):null;
  modal((ex?'<h3>تعديل فصل</h3><label>اسم الفصل</label><input id="cN" value="'+esc(ex.name)+'">':'<h3>اختيار فصل</h3><label>اختر الفصل من القائمة</label><select id="cNSelect"><option value="">اختر الفصل</option>'+classSelectOptions('')+'</select>')
   +'<div class="err" id="cE"></div><div class="acts"><button class="btn g" id="cOk">حفظ</button><button class="btn ghost" id="cNo">إلغاء</button></div>'+(ex?'<div class="acts"><button class="btn red" id="cDel">🗑️ حذف الفصل</button></div>':''));
  $('#cNo').onclick=closeM;
  if(ex)$('#cDel').onclick=()=>{if(confirm('هتحذف الفصل وكل حصصه. متأكد؟')){S.classes=S.classes.filter(x=>x.id!==id);S.slots=S.slots.filter(s=>s.c!==id);save();closeM();go()}};
  $('#cOk').onclick=()=>{if(ex){const name=$('#cN').value.trim();if(!name){$('#cE').textContent='اكتب اسم الفصل.';return}if(S.classes.some(x=>x.name===name&&x.id!==id)){$('#cE').textContent='الاسم مستخدم.';return}ex.name=name;save();closeM();go();return}
    const picked=cById($('#cNSelect').value);if(!picked){$('#cE').textContent='اختر فصلًا من القائمة.';return}save();closeM();go();toast('الفصل '+picked.name+' جاهز للاستخدام ✓')}}

/* ---------- publish / backup ---------- */
function buildPub(){
  S.pubVer=(S.pubVer||0)+1;save();
  return{type:'school-schedule',v:2,version:S.pubVer,updatedAt:new Date().toISOString(),
    school:{gov:S.school.gov,admin:S.school.admin,school:S.school.name},
    periods:Object.fromEntries(['m','x','e'].map(k=>[k,S.periods[k].map(p=>[p.s,p.e])])),
    brk:S.brk,
    teachers:S.teachers.map(t=>({code:t.code,name:t.name,classes:S.slots.filter(s=>s.t===t.id).map(s=>({day:DN[s.day],p:s.p,n:s.n,name:cName(s.c),subject:s.sub,logo:logoFor(s.sub),sh:s.sh}))}))}}
const linkOf=t=>{let b=(S.base||'').trim();if(b&&!/[?#]$/.test(b)&&!b.endsWith('/')&&!/\.html?$/.test(b))b+='/';return b+'?c='+encodeURIComponent(t.code)};

/* ---------- GitHub: مزامنة البيانات + النشر ---------- */
let syncing=false;
const hasData=()=>S.teachers.length||S.classes.length||S.slots.length;
const b64e=t=>btoa(unescape(encodeURIComponent(t))),b64d=b=>decodeURIComponent(escape(atob(b.replace(/\s/g,''))));
function gh(method,repo,path,body,raw){
  const u=CFG.api+'/repos/'+repo+'/contents/'+path.split('/').map(encodeURIComponent).join('/')+(method==='GET'?'?t='+Date.now():'');
  return fetch(u,{method,cache:'no-store',headers:Object.assign({'Authorization':'Bearer '+CFG.token,'Accept':raw?'application/vnd.github.raw+json':'application/vnd.github+json'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined})}
async function ghGet(repo,path){
  const r=await gh('GET',repo,path);if(r.status===404)return null;if(!r.ok)throw new Error('http '+r.status);
  const j=await r.json();let text;
  if(j.content&&j.encoding==='base64')text=b64d(j.content);else{const rr=await gh('GET',repo,path,null,true);text=await rr.text()}
  return{sha:j.sha,text}}
async function ghPut(repo,path,text,sha,msg){
  const body={message:msg,content:b64e(text)};if(sha)body.sha=sha;
  const r=await gh('PUT',repo,path,body);
  if(r.status===409||r.status===422){const e=new Error('conflict');e.conflict=true;throw e}
  if(!r.ok)throw new Error('http '+r.status);
  const j=await r.json();return j.content.sha}
const masterText=()=>JSON.stringify({app:'school-planner',v:1,data:S});
function cloud(){const e=$('#cl');if(!e)return;e.textContent=!cfgOk()?'':CFG.dirty?'☁️⏳':'☁️✓'}
const gitStatus=()=>!cfgOk()?'لسه ما اتضبطتش.':(CFG.dirty?'⏳ فيه تعديلات لسه ما اترفعتش. ':'')+(CFG.at?'آخر مزامنة: '+CFG.at:'');
function askSide(msg){return new Promise(res=>{modal('<h3>⚠️ اختلاف في البيانات</h3><p class="note" style="font-size:14px">'+msg+'</p><div class="acts"><button class="btn g" id="aR">⬇️ خد نسخة GitHub</button><button class="btn red" id="aL">⬆️ ارفع نسختي</button></div>');
  $('#aR').onclick=()=>{closeM();res('remote')};$('#aL').onclick=()=>{closeM();res('local')};$('#dlg').addEventListener('cancel',()=>res('none'),{once:true})})}
function applyRemote(g){
  try{const o=JSON.parse(g.text),d=o.data||o;S=Object.assign(def(),d);norm();persist();CFG.sha=g.sha;CFG.dirty=false;saveCfg();UI.sel={t:null,c:null};go();toast('اتحدّثت البيانات من GitHub ✓')}
  catch(e){toast('النسخة اللي على GitHub مش صالحة')}}
async function pushMaster(fromPull){
  if(!cfgOk())return;
  try{const sha=await ghPut(CFG.m.repo,CFG.m.path,masterText(),CFG.sha||undefined,'تحديث بيانات المدرسة');CFG.sha=sha;CFG.dirty=false;CFG.at=nowTxt();saveCfg()}
  catch(e){if(e.conflict&&!fromPull){syncing=false;await pullMaster(true);return}}
  cloud();const m=$('#gMsg');if(m)m.textContent=gitStatus()}
async function pullMaster(manual){
  if(!cfgOk()||syncing)return;syncing=true;
  try{
    const g=await ghGet(CFG.m.repo,CFG.m.path);
    if(!g){if(hasData())await pushMaster(true);else if(manual)toast('مفيش بيانات على GitHub لسه')}
    else if(g.sha===CFG.sha){if(CFG.dirty)await pushMaster(true);else if(manual)toast('كل حاجة محدّثة ✓')}
    else{let side='remote';
      if(CFG.dirty||(!CFG.sha&&hasData()))side=await askSide(CFG.dirty?'عندك تعديلات على الجهاز ده، وفيه نسخة تانية أحدث على GitHub.':'الجهاز ده فيه بيانات، وعلى GitHub بيانات تانية.');
      if(side==='remote')applyRemote(g);else if(side==='local'){CFG.sha=g.sha;saveCfg();await pushMaster(true)}}
    CFG.at=nowTxt();saveCfg()
  }catch(e){if(manual)toast('مقدرتش أتصل بـ GitHub. اتأكد من النت والمفتاح.')}
  syncing=false;cloud();const m=$('#gMsg');if(m)m.textContent=gitStatus()}
async function publishGH(){
  if(!CFG.token||!CFG.p.repo){toast('اضبط مستودع تطبيق المدرّس في الإعدادات الأول');return}
  const o=buildPub(),text=JSON.stringify(o);
  try{const cur=await ghGet(CFG.p.repo,CFG.p.path);await ghPut(CFG.p.repo,CFG.p.path,text,cur&&cur.sha,'نشر الجداول (النسخة '+o.version+')');toast('اتنشر ✓ هيوصل للمدرسين خلال دقيقة أو اتنين');go()}
  catch(e){toast(e.conflict?'حصل تعارض، جرّب تاني':'فشل النشر. اتأكد من النت والمفتاح.')}}
async function gitTest(){
  const out=[];
  for(const [lbl,repo,priv] of [['بيانات المدرسة',CFG.m.repo,true],['تطبيق المدرّس',CFG.p.repo,false]]){
    if(!repo){out.push(lbl+': مش مكتوب');continue}
    try{const r=await fetch(CFG.api+'/repos/'+repo,{headers:{Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json'},cache:'no-store'});
      if(!r.ok){out.push(lbl+': ✗ مش متاح ('+r.status+')');continue}
      const j=await r.json(),w=j.permissions&&j.permissions.push;
      out.push(lbl+': '+(w?'✓ تمام':'✗ المفتاح ملوش صلاحية كتابة')+(priv&&!j.private?' ⚠️ المستودع ده عام! لازم يكون خاص':''))}
    catch(e){out.push(lbl+': ✗ مفيش اتصال')}}
  $('#gTest').innerHTML=out.map(esc).join('<br>')}
function vGit(){return'<div class="card"><h3>🔗 المزامنة مع GitHub</h3><p class="note">البيانات بتتحفظ في مستودع خاص بيك وتتزامن بين موبايلك وكمبيوترك، والنشر للمدرسين بضغطة من غير رفع ملفات. المفتاح بيتحفظ على الجهاز ده بس.</p>'
  +'<label>مفتاح GitHub (Token)</label><input type="password" id="gT" value="'+esc(CFG.token)+'" style="direction:ltr" autocomplete="off">'
  +'<label>مستودع بيانات المدرسة (لازم يكون خاص)</label><input id="gM" value="'+esc(CFG.m.repo)+'" placeholder="اسمك/school-data" style="direction:ltr">'
  +'<label>مستودع تطبيق المدرّس (اللي عليه Pages)</label><input id="gP" value="'+esc(CFG.p.repo)+'" placeholder="اسمك/golden-schedule" style="direction:ltr">'
  +'<div class="note" id="gMsg" style="margin-top:8px">'+esc(gitStatus())+'</div>'+'<div class="note" id="gTest" style="font-weight:700"></div>'
  +'<div class="acts"><button class="btn alt" data-a="gtest">اختبار الاتصال</button><button class="btn g" data-a="gpull">⬇️ سحب</button><button class="btn" data-a="gpush">⬆️ حفظ الآن</button></div></div>'}

/* ---------- events ---------- */
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){UI.tab=b.dataset.tab;go()}};
$('#main').onclick=e=>{
  const g=e.target.closest('[data-sid]');if(g&&UI.tab==='plan'){slotDlg(g.dataset.sid);return}
  const em=e.target.closest('td.e');if(em){slotDlg(null,+em.dataset.d,+em.dataset.p);return}
  const a=e.target.closest('[data-a]');if(!a)return;const v=a.dataset.v,id=a.dataset.id;
  switch(a.dataset.a){
    case'tab':UI.tab=v;go();break;
    case'print':printTable(a.dataset.kind,a.dataset.kind==='teacher'?(S.teachers[0]||{}).id:a.dataset.kind==='class'?(S.classes[0]||{}).id:null);break;
    case'printSelected':printTable(a.dataset.kind,$('#'+(a.dataset.kind==='teacher'?'printTeacher':'printClass')).value);break;
    case'mode':UI.mode=v;go();break;
    case'sh':UI.sh=v;go();break;
    case'tadd':teacherDlg();break;case'tedit':teacherDlg(id);break;
    case'cadd':classDlg();break;case'cedit':classDlg(id);break;
    case'pub':if(CFG.token&&CFG.p.repo)publishGH();else{const o=buildPub();dl('school.json',JSON.stringify(o,null,1));toast('اضبط GitHub عشان النشر يبقى تلقائي. اتنزّل الملف (النسخة '+o.version+')');go()}break;
    case'pubfile':{const o=buildPub();dl('school.json',JSON.stringify(o,null,1));toast('اتجهّز school.json (النسخة '+o.version+')');go();break}
    case'gtest':gitTest();break;case'gpull':pullMaster(true);break;case'gpush':pushMaster(false).then(()=>toast('اتحفظ على GitHub ✓'));break;
    case'copy':{const t=tById(id),l=linkOf(t);(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast('اتنسخ الرابط ✓')).catch(()=>prompt('انسخ الرابط:',l));break}
    case'wa':{const t=tById(id);open('https://wa.me/?text='+encodeURIComponent('جدولك على تطبيق جدول الحصص:\n'+linkOf(t)+'\nكودك: '+t.code),'_blank');break}
    case'bk':dl('school-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'school-planner',v:1,data:S}));toast('اتحفظت النسخة ✓');break}};
$('#main').onchange=e=>{
  const t=e.target;
  if(t.id==='pSel'){UI.sel[UI.mode]=t.value;go();return}
  if(t.id==='gT'){CFG.token=t.value.trim();saveCfg();cloud();return}
  if(t.id==='gM'){CFG.m.repo=t.value.trim();CFG.sha='';saveCfg();cloud();return}
  if(t.id==='gP'){CFG.p.repo=t.value.trim();saveCfg();return}
  if(t.id==='base'){S.base=t.value.trim();save();return}
  if(t.dataset.logoText){const sub=t.dataset.logoText.trim();if(!S.subjectLogos)S.subjectLogos={};S.subjectLogos[sub]=t.value.trim()||defaultLogo(sub);save();go();return}
  if(t.dataset.logoFile){const f=t.files[0];if(!f)return;if(f.size>250000){toast('اللوجو كبير. اختار صورة أقل من 250 كيلوبايت');t.value='';return}const sub=t.dataset.logoFile.trim(),r=new FileReader();r.onload=()=>{if(!S.subjectLogos)S.subjectLogos={};S.subjectLogos[sub]=r.result;save();go();toast('اتحفظ لوجو '+sub+' ✓')};r.readAsDataURL(f);return}
  if(t.dataset.sc){S.school[t.dataset.sc]=t.value.trim();save();go();return}
  if(t.dataset.pk){const p=S.periods[t.dataset.pk][+t.dataset.i];const cur={s:p.s,e:p.e};cur[t.dataset.w]=t.value;
    if(!cur.s||!cur.e||mins(cur.e)<=mins(cur.s)){t.value=p[t.dataset.w];toast('النهاية لازم تكون بعد البداية');return}
    p[t.dataset.w]=t.value;save();go();return}
  if(t.dataset.bk){const b=S.brk[t.dataset.bk];b[t.dataset.w]=t.value;save();return}
  if(t.id==='bkFile'){const f=t.files[0];if(!f)return;f.text().then(x=>{
    try{const o=JSON.parse(x),d=o.data||o;if(!d||!Array.isArray(d.teachers)||!Array.isArray(d.slots))throw 0;
      if(!confirm('هيتم استبدال كل البيانات الحالية بالنسخة دي. موافق؟'))return;
      S=Object.assign(def(),d);norm();save();UI.sel={t:null,c:null};go();toast('اتسترجعت النسخة ✓')}catch(err){$('#bkMsg').textContent='الملف مش نسخة صالحة.'}})}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
go();
if(cfgOk())setTimeout(()=>pullMaster(false),800);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cfgOk())pullMaster(false)});
</script>
