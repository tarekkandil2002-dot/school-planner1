<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0F172A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>جدول المدرسة</title>
<style>
:root{
  --g:#0F766E;--g2:#0D9488;--g-hover:#0F766E;--g-soft:rgba(13,148,136,.13);--g-ink:#0F766E;
  --navy:#0F172A;--gold:#D97706;--blue:#2563EB;--red:#DC2626;--red-soft:rgba(220,38,38,.12);--red-ink:#B91C1C;
  --warn-soft:rgba(245,158,11,.15);--warn-ink:#92400E;
  --bg-mesh:
    radial-gradient(circle at 88% 8%, rgba(20,184,166,.22) 0%, transparent 42%),
    radial-gradient(circle at 12% 22%, rgba(56,189,248,.20) 0%, transparent 44%),
    radial-gradient(circle at 75% 88%, rgba(129,140,248,.16) 0%, transparent 45%),
    radial-gradient(circle at 20% 85%, rgba(52,211,153,.14) 0%, transparent 40%),
    linear-gradient(160deg, #F1F7FA 0%, #EEF4F8 50%, #F4F3FB 100%);
  --glass-bg:rgba(255,255,255,.64);
  --glass-strong:rgba(255,255,255,.78);
  --glass-soft:rgba(255,255,255,.46);
  --glass-bd:rgba(255,255,255,.78);
  --glass-bd-inner:rgba(15,23,42,.07);
  --card:var(--glass-bg);--surface:var(--glass-soft);--surface2:rgba(255,255,255,.55);
  --ink:#0F172A;--mute:#526075;--line:rgba(15,23,42,.09);
  --shadow:0 8px 30px rgba(15,23,42,.06), inset 0 1px 0 rgba(255,255,255,.85);
  --shadow-lg:0 20px 50px rgba(15,23,42,.14), inset 0 1px 0 rgba(255,255,255,.9);
  --rail-w:84px;--sidebar-w:248px;
  --side-gap:10px;
  --grid-empty:rgba(255,255,255,.42);
  --smart-ok-bg:rgba(16,185,129,.16);--smart-ok-bd:#10B981;--smart-ok-ink:#047857;
  --smart-busy-bg:repeating-linear-gradient(-45deg,rgba(239,68,68,.12),rgba(239,68,68,.12) 6px,rgba(255,255,255,.4) 6px,rgba(255,255,255,.4) 12px);
  --smart-busy-ink:#B91C1C;
  --radius:20px;
}
[data-theme="dark"]{
  --g:#2DD4BF;--g2:#14B8A6;--g-hover:#0D9488;--g-soft:rgba(45,212,191,.16);--g-ink:#5EEAD4;
  --navy:#F8FAFC;--gold:#F59E0B;--blue:#60A5FA;--red:#F87171;--red-soft:rgba(248,113,113,.16);--red-ink:#FCA5A5;
  --warn-soft:rgba(245,158,11,.16);--warn-ink:#FCD34D;
  --bg-mesh:
    radial-gradient(circle at 86% 10%, rgba(20,184,166,.20) 0%, transparent 44%),
    radial-gradient(circle at 14% 25%, rgba(59,130,246,.18) 0%, transparent 45%),
    radial-gradient(circle at 70% 90%, rgba(139,92,246,.16) 0%, transparent 46%),
    linear-gradient(160deg, #070C17 0%, #0C1425 55%, #0A1020 100%);
  --glass-bg:rgba(17,25,40,.62);
  --glass-strong:rgba(17,25,40,.78);
  --glass-soft:rgba(30,41,59,.45);
  --glass-bd:rgba(255,255,255,.11);
  --glass-bd-inner:rgba(255,255,255,.07);
  --card:var(--glass-bg);--surface:var(--glass-soft);--surface2:rgba(30,41,59,.58);
  --ink:#F1F5F9;--mute:#94A3B8;--line:rgba(255,255,255,.10);
  --shadow:0 10px 32px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.09);
  --shadow-lg:0 24px 56px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.12);
  --grid-empty:rgba(30,41,59,.38);
  --smart-ok-bg:rgba(16,185,129,.22);--smart-ok-bd:#34D399;--smart-ok-ink:#6EE7B7;
  --smart-busy-bg:repeating-linear-gradient(-45deg,rgba(239,68,68,.18),rgba(239,68,68,.18) 6px,rgba(15,23,42,.5) 6px,rgba(15,23,42,.5) 12px);
  --smart-busy-ink:#FCA5A5;
}
*{box-sizing:border-box;margin:0}
body{
  font-family:"Cairo",system-ui,"Segoe UI",Tahoma,Arial,sans-serif;
  background:var(--bg-mesh) fixed;color:var(--ink);
  padding-bottom:24px;padding-inline-start:calc(var(--rail-w) + var(--side-gap));
  transition:color .2s;min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--blue)}

/* Floating Frosted-Glass Top Header */

.icon-btn.listening{background:var(--red-soft)!important;color:var(--red-ink)!important;border-color:var(--red)!important;animation:micPulse 1.1s infinite}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.35)}50%{box-shadow:0 0 0 6px rgba(220,38,38,0)}}

header.topbar{
  margin:10px 12px 0;border-radius:18px;
  background:var(--glass-strong);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  color:var(--ink);padding:11px 16px;
  border:1px solid var(--glass-bd);box-shadow:var(--shadow);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  position:sticky;top:10px;z-index:20;
}
header.topbar .brand b{font-size:17.5px;font-weight:800;color:var(--ink);display:block;line-height:1.25}
header.topbar .brand small{display:block;font-size:11.5px;color:var(--mute);margin-top:1px;font-weight:600}
.top-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.icon-btn{
  border:1px solid var(--glass-bd);background:var(--glass-soft);color:var(--ink);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-radius:11px;height:36px;min-width:36px;padding:0 10px;font:inherit;font-size:13px;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  transition:all .16s;box-shadow:0 2px 8px rgba(15,23,42,.04);
}
.icon-btn:hover:not(:disabled){background:var(--glass-strong);transform:translateY(-1px)}
.icon-btn:disabled{opacity:.38;cursor:not-allowed}
#warn{
  background:var(--red-soft);color:var(--red-ink);border:1px solid rgba(220,38,38,.25);
  border-radius:11px;padding:6px 11px;font-weight:800;font-size:12.5px;white-space:nowrap;cursor:pointer
}
#cl{font-size:14px}

/* Floating Frosted-Glass Right Sidebar (Seamless & Soft) */
nav.tabs{
  position:fixed;top:var(--side-gap);bottom:var(--side-gap);
  right:var(--side-gap);inset-inline-start:var(--side-gap);inset-inline-end:auto;
  width:calc(var(--rail-w) - var(--side-gap));
  border-radius:22px;
  background:var(--glass-bg);
  backdrop-filter:blur(24px) saturate(190%);-webkit-backdrop-filter:blur(24px) saturate(190%);
  border:1px solid var(--glass-bd);
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;justify-content:flex-start;
  padding:0;z-index:30;overflow:hidden;
}
nav.tabs .side-head{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:14px 6px 12px;border-bottom:1px solid var(--line);min-height:62px;gap:4px
}
nav.tabs .side-logo{
  width:44px;height:44px;border-radius:50%;
  background:transparent;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px rgba(15,23,42,.28);flex-shrink:0
}
nav.tabs .side-logo img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
nav.tabs .side-head .side-txt{display:none}
nav.tabs .nav-links{
  display:flex;flex-direction:column;align-items:stretch;
  padding:10px 6px;gap:5px;flex:1;overflow-y:auto
}
nav.tabs button{
  border:1px solid transparent;background:transparent;font:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  font-size:10px;font-weight:700;color:var(--mute);
  cursor:pointer;padding:8px 3px;border-radius:14px;transition:all .18s;width:100%;position:relative
}
nav.tabs button:hover{background:var(--glass-soft);color:var(--ink);border-color:var(--glass-bd)}
nav.tabs button i{
  font-style:normal;width:24px;height:24px;
  display:flex;align-items:center;justify-content:center;color:inherit;transition:transform .18s
}
nav.tabs button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{
  background:linear-gradient(135deg,rgba(13,148,136,.16),rgba(6,182,212,.14));
  color:var(--g-ink);border-color:rgba(13,148,136,.28);
  box-shadow:0 4px 14px rgba(13,148,136,.12), inset 0 1px 0 rgba(255,255,255,.5);
}
[data-theme="dark"] nav.tabs button.on{
  box-shadow:0 4px 16px rgba(20,184,166,.18), inset 0 1px 0 rgba(255,255,255,.12);
}
nav.tabs button.on i{transform:scale(1.06)}
nav.tabs .side-foot{
  display:flex;flex-direction:column;align-items:center;padding:10px 6px;border-top:1px solid var(--line)
}
nav.tabs .side-foot .btn{
  width:100%;padding:8px 4px;font-size:11px;text-align:center;border-radius:12px;
  background:var(--glass-soft);color:var(--ink);border:1px solid var(--glass-bd);box-shadow:none
}
nav.tabs .side-foot .btn:hover{background:var(--glass-strong)}

/* Main Content & Glass Cards */
main{max-width:1120px;margin:10px auto 0;padding:0 12px 20px;position:relative;z-index:5}
.card{
  background:var(--glass-bg);
  backdrop-filter:blur(20px) saturate(175%);-webkit-backdrop-filter:blur(20px) saturate(175%);
  border:1px solid var(--glass-bd);border-radius:var(--radius);
  padding:16px;margin:12px 0;box-shadow:var(--shadow);transition:border-color .18s,box-shadow .18s
}
.dashgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dashstat{
  padding:16px;border-radius:16px;background:var(--glass-soft);
  border:1px solid var(--glass-bd);position:relative;overflow:hidden;
  transition:transform .18s,box-shadow .18s,background .18s
}
.dashstat:hover{transform:translateY(-2px);background:var(--glass-strong);box-shadow:var(--shadow)}
.dashstat::before{content:"";position:absolute;top:0;inset-inline:0;height:3px;background:linear-gradient(90deg,#0D9488,#06B6D4)}
.dashstat:nth-child(2)::before{background:linear-gradient(90deg,#3B82F6,#60A5FA)}
.dashstat:nth-child(3)::before{background:linear-gradient(90deg,#8B5CF6,#A78BFA)}
.dashstat:nth-child(4)::before{background:linear-gradient(90deg,#F59E0B,#FBBF24)}
.dashstat b{display:block;font-size:30px;font-weight:800;color:var(--ink);line-height:1.15;font-variant-numeric:tabular-nums}
.dashstat small{color:var(--mute);font-size:12.5px;font-weight:600;margin-top:4px;display:block}
.dashlist{display:grid;gap:8px}
.dashrow{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 14px;background:var(--glass-soft);border:1px solid var(--glass-bd);border-radius:13px
}
.dashrow b{font-size:14px;font-weight:700}.dashrow small{color:var(--mute)}

/* Dropzone */
.dropzone{
  border:2px dashed rgba(13,148,136,.45);border-radius:16px;background:var(--g-soft);
  padding:18px;text-align:center;cursor:pointer;transition:all .18s
}
.dropzone:hover,.dropzone.drag{border-color:var(--g2);background:rgba(13,148,136,.2)}
.dropzone b{display:block;color:var(--g-ink);font-size:14.5px}
.dropzone small{display:block;color:var(--mute);margin-top:4px;font-size:12.5px}

/* Glass-Tinted Modern Buttons */
.c{text-align:center;line-height:1.8}
.btn{
  border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;font-size:13.5px;
  background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;cursor:pointer;transition:all .16s;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 4px 14px rgba(217,119,6,.22), inset 0 1px 0 rgba(255,255,255,.28)
}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:translateY(0)}
.btn.alt{background:linear-gradient(135deg,#3B82F6,#2563EB);box-shadow:0 4px 14px rgba(37,99,235,.22), inset 0 1px 0 rgba(255,255,255,.25)}
.btn.red{background:linear-gradient(135deg,#EF4444,#DC2626);box-shadow:0 4px 14px rgba(220,38,38,.22), inset 0 1px 0 rgba(255,255,255,.25)}
.btn.g{background:linear-gradient(135deg,#14B8A6,#0D9488);box-shadow:0 4px 14px rgba(13,148,136,.24), inset 0 1px 0 rgba(255,255,255,.28)}
.btn.ghost{background:var(--glass-soft);color:var(--ink);border:1px solid var(--glass-bd);box-shadow:none}
.btn.ghost:hover{background:var(--glass-strong);filter:none}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:10px}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.acts .btn{flex:1;min-width:115px}

/* Glass Segmented Control */
.seg{
  display:flex;gap:4px;margin:10px 0;padding:4px;
  background:var(--glass-soft);border-radius:14px;border:1px solid var(--glass-bd);flex-wrap:wrap
}
.seg button{
  flex:1;min-width:74px;border:0;background:transparent;border-radius:10px;
  padding:8px 8px;font:inherit;font-size:13px;font-weight:700;color:var(--mute);cursor:pointer;transition:all .16s
}
.seg button:hover{color:var(--ink)}
.seg button.on{
  background:var(--glass-strong);color:var(--g-ink);
  box-shadow:0 2px 10px rgba(15,23,42,.08);
}
.seg button.on[data-v=x]{color:#B45309}
.seg button.on[data-v=e]{color:#6D28D9}
[data-theme="dark"] .seg button.on{color:var(--g)}
[data-theme="dark"] .seg button.on[data-v=x]{color:#FCD34D}
[data-theme="dark"] .seg button.on[data-v=e]{color:#C4B5FD}

/* Frosted Inputs & Selects */
select,input{
  width:100%;padding:10px 12px;border:1px solid var(--glass-bd);border-radius:12px;
  font:inherit;font-size:13.5px;background:var(--glass-strong);color:var(--ink);
  box-shadow:inset 0 1px 2px rgba(15,23,42,.04);transition:border-color .15s,box-shadow .15s
}
select:focus,input:focus{outline:0;border-color:var(--g2);box-shadow:0 0 0 3px var(--g-soft)}
label{display:block;font-size:12.5px;margin:10px 0 4px;color:var(--mute);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}

/* Search & Filter Chips */
.search-bar{display:flex;gap:8px;align-items:center;margin:10px 0 6px;flex-wrap:wrap}
.search-box{position:relative;flex:1;min-width:180px}
.search-box input{padding-inline-start:36px}
.search-box::before{content:"🔍";position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;opacity:.65}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 2px}
.chip{
  border:1px solid var(--glass-bd);background:var(--glass-soft);color:var(--mute);
  border-radius:999px;padding:5px 13px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .16s
}
.chip:hover{background:var(--glass-strong);color:var(--ink)}
.chip.on{background:linear-gradient(135deg,#14B8A6,#0D9488);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(13,148,136,.24)}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 11px;font-weight:700;font-size:12px}
.pill.ok{background:var(--g-soft);color:var(--g-ink)}.pill.warn{background:var(--warn-soft);color:var(--warn-ink)}.pill.bad{background:var(--red-soft);color:var(--red-ink)}

/* Smart Highlighting Bar */
.smart-bar{
  background:var(--glass-soft);border:1px solid var(--glass-bd);border-inline-start:4px solid var(--g2);
  border-radius:14px;padding:10px 12px;margin:10px 0;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap
}
.smart-bar .smart-title{font-size:13px;font-weight:800;color:var(--g);white-space:nowrap}
.smart-bar select{flex:1;min-width:170px;padding:8px 10px;font-size:13px}
.smart-legend{width:100%;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:2px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-inline-end:4px}
.dot.ok{background:var(--smart-ok-bg);border:1.5px solid var(--smart-ok-bd)}
.dot.busy{background:var(--smart-busy-bg);border:1px solid var(--red)}

/* Glass Timetable Grid */
.gwrap{
  overflow-x:auto;margin-top:8px;border:1px solid var(--glass-bd);
  border-radius:16px;padding:7px;background:var(--glass-soft)
}
table.grid{width:100%;border-collapse:separate;border-spacing:5px;table-layout:fixed;min-width:460px}
.grid th,.grid td{text-align:center;padding:0;border:0;border-radius:11px}
.grid th{color:#fff;font-size:12.5px;padding:9px 4px;font-weight:700;box-shadow:0 2px 8px rgba(15,23,42,.1)}
.grid th.pc{width:64px;background:rgba(15,23,42,.82);color:#F8FAFC}
.grid td{height:58px;font-weight:700;color:var(--ink);background:var(--grid-empty);font-size:13.5px;line-height:1.25;position:relative;transition:all .15s}
.grid td.pc{background:var(--glass-strong);border:1px solid var(--glass-bd);color:var(--ink);font-size:15px;font-weight:800}
.grid td.pc small{display:block;font-size:10px;font-weight:600;color:var(--mute)}
.grid td.e{border:1.5px dashed var(--line);cursor:pointer}
.grid td.e:hover{border-color:var(--g2);background:var(--g-soft)}
.grid td.e.smart-ok{background:var(--smart-ok-bg);border:1.5px dashed var(--smart-ok-bd);color:var(--smart-ok-ink)}
.grid td.e.smart-ok::after{content:"✓ متاح";font-size:11px;font-weight:800;display:block}
.grid td.e.smart-busy{background:var(--smart-busy-bg);border:1px solid rgba(220,38,38,.3);color:var(--smart-busy-ink);opacity:.85}
.grid td.e.smart-busy::after{content:"✕ مشغول";font-size:10.5px;font-weight:700;display:block}
.grid td.c{box-shadow:0 4px 12px rgba(15,23,42,.14), inset 0 1px 0 rgba(255,255,255,.28);cursor:pointer;padding:4px 5px}
.grid td.c:hover{filter:brightness(1.06);transform:scale(1.015)}
.grid td.c small{display:block;font-size:10.5px;font-weight:600;opacity:.92;margin-top:1px}
.grid td.bad{outline:2.5px solid var(--red);outline-offset:1px}
.grid tr.brk-row td{height:30px;background:var(--warn-soft);color:var(--warn-ink);font-size:12px;font-weight:700;border-radius:9px}

/* Glass List Items */
.item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-inline-start:4px solid var(--g2);padding:12px 14px;cursor:pointer;transition:all .16s
}
.item:hover{transform:translateX(-2px);background:var(--glass-strong)}
.item b{font-size:15px;font-weight:700;display:block}.item small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.code{direction:ltr;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--glass-soft);border:1px solid var(--glass-bd);color:var(--ink);border-radius:8px;padding:2px 8px;font-size:12px;display:inline-block}
.subject-logo{display:block;width:30px;height:30px;object-fit:contain;margin:0 auto 2px;font-size:20px;line-height:30px;font-weight:800}
.print-table .subject-logo{width:26px;height:26px;font-size:20px;line-height:26px}
h3{color:var(--ink);margin-bottom:4px;font-size:16.5px;font-weight:800}
h4{margin:14px 0 6px;color:var(--g);font-size:14.5px;font-weight:800}
.note{font-size:13px;color:var(--mute);line-height:1.65}
.err{color:var(--red);font-size:13px;min-height:16px;margin-top:8px;font-weight:700}
.live-status{margin-top:10px;padding:9px 12px;border-radius:11px;font-size:13px;font-weight:700}
.live-status.ok{background:var(--g-soft);color:var(--g-ink)}
.live-status.bad{background:var(--red-soft);color:var(--red-ink)}

/* Glass Dialog & Toast */
dialog{
  border:1px solid var(--glass-bd);background:var(--glass-strong);color:var(--ink);
  backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border-radius:22px;padding:20px;width:min(94vw,470px);margin:auto;direction:rtl;
  max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg)
}
dialog::backdrop{background:rgba(15,23,42,.38);backdrop-filter:blur(6px)}
#toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:99;
  background:rgba(15,23,42,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  color:#F8FAFC;border:1px solid rgba(255,255,255,.16);
  border-radius:14px;padding:10px 18px;font-weight:700;font-size:13.5px;text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,.22);max-width:92vw
}
[hidden]{display:none!important}

const classIsNumbered=n=>{const p=String(n).split('/').map(Number);return p.length===2&&p[0]>=1&&p[0]<=6&&p[1]>=1};
const classSelectOptions=(selected,filterTxt='')=>{
  const q=normAr(filterTxt),groups=[],usedIds=new Set();
  for(let g=1;g<=6;g++){
    const list=S.classes.filter(c=>String(c.name).startsWith(g+'/')&&(!q||normAr(c.name).includes(q)))
      .sort((a,b)=>a.name.localeCompare(b.name,'en',{numeric:true}));
    if(list.length){
      list.forEach(c=>usedIds.add(c.id));
      groups.push('<optgroup label="الصف '+g+'">'+list.map(c=>'<option value="'+c.id+'"'+(c.id===selected?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</optgroup>');
    }
  }
  const rest=S.classes.filter(c=>!usedIds.has(c.id)&&(!q||normAr(c.name).includes(q)));
  return groups.join('')+(rest.length?'<optgroup label="فصول أخرى">'+rest.map(c=>'<option value="'+c.id+'"'+(c.id===selected?' selected':'')+'>'+esc(c.name)+'</option>').join('')+'</optgroup>':'');
};

function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('sp1theme',t);
  const isD=t==='dark';
  $('#btnTheme').textContent=isD?'☀️':'🌙';
  $('#btnTheme').title=isD?'تبديل للوضع الفاتح':'تبديل للوضع الليلي';

  const meta=$('meta[name="theme-color"]');if(meta)meta.content=isD?'#070B14':'#0F172A';
}
(function initTheme(){
  const saved=localStorage.getItem('sp1theme');
  const pref=saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  applyTheme(pref);
})();
function toggleTheme(){applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')}

/* ---------- Undo / Redo ---------- */
const UNDO=[],REDO=[],MAX_HIST=35;
function pushUndo(label){
  UNDO.push({snap:JSON.stringify(S),label:label||'تعديل'});
  if(UNDO.length>MAX_HIST)UNDO.shift();
  REDO.length=0;
  updUndoBtns();
}
function updUndoBtns(){
  const u=$('#btnUndo'),r=$('#btnRedo');
  if(u){u.disabled=!UNDO.length;u.title=UNDO.length?'تراجع عن: '+UNDO[UNDO.length-1].label+' (Ctrl+Z)':'لا يوجد تراجع'}
  if(r){r.disabled=!REDO.length;r.title=REDO.length?'إعادة: '+REDO[REDO.length-1].label+' (Ctrl+Y)':'لا توجد إعادة'}
}
function doUndo(){
  if(!UNDO.length)return;
  const prev=UNDO.pop();
  REDO.push({snap:JSON.stringify(S),label:prev.label});
  S=Object.assign(def(),JSON.parse(prev.snap));norm();
  save();updUndoBtns();go();
  toast('↩️ تم التراجع عن: '+prev.label);
}
function doRedo(){
  if(!REDO.length)return;
  const next=REDO.pop();
  UNDO.push({snap:JSON.stringify(S),label:next.label});
  S=Object.assign(def(),JSON.parse(next.snap));norm();
  save();updUndoBtns();go();
  toast('↪️ تمت إعادة: '+next.label);
}

const normAr=s=>String(s||'').toLowerCase().replace(/[إأآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();
const tById=id=>S.teachers.find(t=>t.id===id),cById=id=>S.classes.find(c=>c.id===id),rById=id=>(S.rooms||[]).find(r=>r.id===id);
const tName=id=>(tById(id)||{}).name||'؟',cName=id=>(cById(id)||{}).name||'؟',rName=id=>(rById(id)||{}).name||'';

const rng=s=>[mins(st(s)),mins(en(s))],ovl=(a,b)=>a[0]<b[1]&&b[0]<a[1];

function conflicts(s,ignore){
  const out=new Set(),r=rng(s);
  const tObj=tById(s.t);
  if(tObj&&Array.isArray(tObj.offDays)&&tObj.offDays.includes(s.day)){
    out.add('المدرّس '+tName(s.t)+' غير متاح يوم '+DN[s.day]+' (يوم راحة)');
  }
  S.slots.forEach(o=>{
    if(o.id===ignore||o.day!==s.day||!ovl(r,rng(o)))return;
    if(o.t===s.t)out.add('المدرّس '+tName(s.t)+' عنده حصة تانية في نفس الوقت ('+SI[o.sh]+' '+SHN[o.sh]+')');
    if(o.c===s.c)out.add('الفصل '+cName(s.c)+' عنده حصة مع '+tName(s.t)+' في نفس الوقت');
    if(s.r&&o.r&&s.r===o.r)out.add('القاعة '+rName(s.r)+' محجوزة في نفس الوقت للفصل '+cName(o.c));
  });
  return[...out];
}
function allConflicts(){
  const g=new Map(),out=new Set();
  S.slots.forEach(s=>{
    const tObj=tById(s.t);
    if(tObj&&Array.isArray(tObj.offDays)&&tObj.offDays.includes(s.day)){
      out.add(DN[s.day]+': '+tName(s.t)+' مجدول في يوم راحته');
    }
    const r=rng(s);
    const pairs=[['t',s.t],['c',s.c]];
    if(s.r)pairs.push(['r',s.r]);
    pairs.forEach(([k,id])=>{const key=s.day+'|'+k+'|'+id;let a=g.get(key);if(!a){a=[];g.set(key,a)}a.push({s,r})});
  });
  g.forEach((arr,key)=>{if(arr.length<2)return;arr.sort((a,b)=>a.r[0]-b.r[0]);let mx=arr[0];
    for(let i=1;i<arr.length;i++){const x=arr[i];
      if(x.r[0]<mx.r[1]){const p=key.split('|');out.add(DN[p[0]]+': '+(p[1]==='t'?tName(x.s.t)+' عنده حصتين في نفس الوقت':p[1]==='r'?'القاعة '+rName(x.s.r)+' محجوزة مرتين':'الفصل '+cName(x.s.c)+' عنده حصتين في نفس الوقت'))}
      if(x.r[1]>mx.r[1])mx=x}});
  return[...out];
}

function csvRows(text){const rows=[];let row=[],cell='',quote=false;for(let i=0;i<text.length;i++){const ch=text[i],nx=text[i+1];if(ch==='"'&&quote&&nx==='"'){cell+='"';i++;continue}if(ch==='"'){quote=!quote;continue}if(ch===','&&!quote){row.push(cell.trim());cell='';continue}if((ch==='\n'||ch==='\r')&&!quote){if(ch==='\r'&&nx==='\n')i++;row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell='';continue}cell+=ch}if(cell||row.length){row.push(cell.trim());rows.push(row)}return rows}

async function readXlsxOffline(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf),dec=new TextDecoder('utf-8');
  let eocd=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){eocd=i;break}}
  if(eocd<0)throw new Error('not zip');
  const cdOffset=dv.getUint32(eocd+16,true),cdEntries=dv.getUint16(eocd+10,true);
  const files={};let p=cdOffset;
  for(let i=0;i<cdEntries;i++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const comp=dv.getUint16(p+10,true),csize=dv.getUint32(p+20,true);
    const fnLen=dv.getUint16(p+28,true),exLen=dv.getUint16(p+30,true),cmLen=dv.getUint16(p+32,true);
    const lfhOff=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+fnLen));
    p+=46+fnLen+exLen+cmLen;
    if(name==='xl/sharedStrings.xml'||/^xl\/worksheets\/sheet\d+\.xml$/.test(name)){
      const lfn=dv.getUint16(lfhOff+26,true),lex=dv.getUint16(lfhOff+28,true);
      const slice=u8.subarray(lfhOff+30+lfn+lex,lfhOff+30+lfn+lex+csize);
      if(comp===0)files[name]=dec.decode(slice);
      else if(comp===8&&typeof DecompressionStream!=='undefined'){
        const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();
        w.write(slice);w.close();

    }

    .replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(+d))
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
  const ss=[];
  if(files['xl/sharedStrings.xml']){
    for(const si of (files['xl/sharedStrings.xml'].match(/<si\b[^>]*>[\s\S]*?<\/si>/g)||[])){
      ss.push([...si.matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)].map(m=>unesc(m[1])).join(''));
    }
  }
  const sheetKeys=Object.keys(files).filter(k=>k.startsWith('xl/worksheets/sheet')).sort();
  if(!sheetKeys.length)throw new Error('no sheet');
  for(const sk of sheetKeys){
    const xml=files[sk];
    const colIdx=ref=>{const l=(ref||'').replace(/[0-9]/g,'');let n=0;for(let i=0;i<l.length;i++)n=n*26+(l.charCodeAt(i)-64);return Math.max(0,n-1)};
    const rows=[];
    for(const rXml of (xml.match(/<row\b[^>]*>[\s\S]*?<\/row>/g)||[])){
      const row=[];
      for(const cXml of (rXml.match(/<c\b[^>]*>[\s\S]*?<\/c>/g)||[])){
        const refM=cXml.match(/\br="([^"]+)"/),tM=cXml.match(/\bt="([^"]+)"/),c=colIdx(refM?refM[1]:'A1');
        let val='';
        if(tM&&tM[1]==='inlineStr')val=[...cXml.matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)].map(m=>unesc(m[1])).join('');
        else{const vM=cXml.match(/<v>([\s\S]*?)<\/v>/);if(vM){val=unesc(vM[1]);if(tM&&tM[1]==='s')val=ss[+val]||''}}
        row[c]=val;
      }
      if(row.some(x=>String(x||'').trim()!==''))rows.push(row);
    }
    if(rows.length)return rows;
  }
  return[];
}
function readXlsTextFallback(txt){
  if(/<table\b/i.test(txt)||/<Row\b/i.test(txt)){
    const doc=new DOMParser().parseFromString(txt,'text/html');
    const trs=[...doc.querySelectorAll('tr,row')];
    const rows=trs.map(tr=>[...tr.children].map(td=>td.textContent.trim())).filter(r=>r.some(Boolean));
    if(rows.length)return rows;
  }
  return csvRows(txt.replace(/^\uFEFF/,''));
}

function detectTeacherSheet(rows){
  if(!rows||!rows.length)return{hdrIdx:-1,ix:{code:-1,nationalId:-1,name:-1,subject:-1,quota:-1,phone:-1},list:[]};
  const cleanRows=rows.filter(r=>Array.isArray(r)&&r.some(c=>String(c||'').trim()!==''));
  if(!cleanRows.length)return{hdrIdx:-1,ix:{code:-1,nationalId:-1,name:-1,subject:-1,quota:-1,phone:-1},list:[]};

  let hdrIdx=-1,ix={code:-1,nationalId:-1,name:-1,subject:-1,quota:-1,phone:-1};
  const limit=Math.min(12,cleanRows.length);
  for(let r=0;r<limit;r++){
    const hs=cleanRows[r].map(normHeader);
    const find=names=>hs.findIndex(h=>h&&!h.includes('مدرسه')&&!h.includes('مدرسة')&&names.some(n=>h===n||h.includes(n)));
    const nIdx=find(['اسمالمعلم','اسمالمدرس','اسمالموظف','الاسمرباعي','الاسمثلاثي','الاسم','name','teacher']);
    const sIdx=find(['مادهالتدريس','مادةالتدريس','المادةالدراسية','المادهالدراسيه','الماده','المادة','التخصص','تخصص','ماده','مادة','الوظيفة','الوظيفه','القسم','subject']);
    const cIdx=find(['الكود','كودالمعلم','كود','code']);
    if(nIdx>=0||(sIdx>=0&&cIdx>=0)){
      hdrIdx=r;
      ix={
        code:cIdx,
        nationalId:find(['الرقمالقومي','رقمالقومي','nationalid','national']),
        name:nIdx,
        subject:sIdx,
        quota:find(['النصاب','الحصص','quota']),
        phone:find(['التليفون','تليفون','الهاتف','هاتف','الموبايل','موبايل','الجوال','واتس','phone','mobile'])
      };
      break;
    }
  }

  if(ix.subject<0){
    const maxCols=Math.max(...cleanRows.map(r=>r.length));
    let bestSub=-1,bestSubScore=0;
    for(let col=0;col<maxCols;col++){
      if(col===ix.name)continue;
      let sc=0;
      for(let r=(hdrIdx>=0?hdrIdx+1:0);r<cleanRows.length;r++){
        const v=normAr(cleanRows[r][col]||'');
        if(v&&/(عرب|رياض|انجل|علوم|دراسات|دين|رسم|موسيق|توكاتس|تكنولوج|حاسب|فنيه|بدنيه|مهارات|قيم|english|math)/.test(v))sc++;
      }
      if(sc>bestSubScore){bestSubScore=sc;bestSub=col}
    }
    if(bestSubScore>=1)ix.subject=bestSub;
  }
  if(ix.name<0){
    const maxCols=Math.max(...cleanRows.map(r=>r.length));
    let bestCol=0,bestScore=-1;
    for(let col=0;col<maxCols;col++){
      let score=0;
      for(let r=(hdrIdx>=0?hdrIdx+1:0);r<cleanRows.length;r++){
        const v=String(cleanRows[r][col]||'').trim();
        if(v&&!/^[0-9٠-٩.,\s-]+$/.test(v)&&v.length>=3)score++;
      }
      if(score>bestScore){bestScore=score;bestCol=col}
    }
    ix.name=bestCol;
  }

  const start=hdrIdx>=0?hdrIdx+1:0;
  const list=cleanRows.slice(start).map(r=>({
    raw:r,
    code:ix.code<0?'':String(r[ix.code]||'').trim(),
    nationalId:ix.nationalId<0?'':String(r[ix.nationalId]||'').trim(),
    name:ix.name<0?'':String(r[ix.name]||'').trim(),
    subject:ix.subject<0?'':String(r[ix.subject]||'').trim(),
    quota:ix.quota<0?'':String(r[ix.quota]||'').trim(),
    phone:ix.phone<0?'':String(r[ix.phone]||'').trim()
  })).filter(x=>x.name&&!/^(الاسم|اسم المعلم|اسم المدرس|م|الإجمالي|المجموع)$/i.test(x.name)&&!/^[0-9٠-٩]+$/.test(x.name));

  return{hdrIdx,ix,cleanRows,list};
}

/* Find break position (after which period index) */
function breakAfterPeriod(sh){
  const b=S.brk[sh];if(!b||!b.s||!b.e)return -1;
  const bs=mins(b.s),P=S.periods[sh];
  for(let i=0;i<P.length-1;i++){
    if(mins(P[i].e)<=bs && bs<=mins(P[i+1].s))return i+1;
  }
  return -1;
}

function detectNowPeriod(sh){
  const n=new Date(),m=n.getHours()*60+n.getMinutes(),P=S.periods[sh]||[];
  for(let i=0;i<P.length;i++){if(m>=mins(P[i].s)&&m<=mins(P[i].e))return i+1}

  for(let i=0;i<P.length;i++){if(m<mins(P[i].s))return i+1}
  return P.length||1;

  return htmlParts||'<p class="note" style="margin-top:10px">لا توجد نتائج مطابقة للبحث في هذا المبنى أو الحصة.</p>';
}

function buildingsDlg(){

  const render=()=>{
    const listHTML=S.buildings.length
      ?S.buildings.map(b=>'<div class="dashrow" style="margin-top:6px;flex-wrap:wrap"><input data-bedit="'+b.id+'" value="'+esc(b.name)+'" style="flex:2;min-width:140px;padding:6px 10px" placeholder="اسم المبنى"><div style="display:flex;align-items:center;gap:5px"><small class="note">طوابق:</small><input type="number" min="1" max="10" data-bfl="'+b.id+'" value="'+(+b.floors||5)+'" style="width:62px;padding:6px;text-align:center"></div>'+(S.buildings.length>1?'<button class="btn red sm" data-bdel="'+b.id+'">🗑️</button>':'')+'</div>').join('')
      :'<p class="note">لا توجد مبانٍ مضافة.</p>';
    modal('<h3>🏛️ إدارة المباني والطوابق</h3><p class="note">أضف أي مبنى وحدد عدد طوابقه (أدواره) ليناسب أي مدرسة، أو عدّل أو احذف أي مبنى.</p>'
     +'<div id="bldsList">'+listHTML+'</div>'
     +'<div class="row" style="margin-top:12px;align-items:end"><div style="flex:2"><label>اسم مبنى جديد</label><input id="newBldName" placeholder="مثال: المبنى الإداري أو مبنى KG"></div><div><label>عدد الطوابق</label><input id="newBldFloors" type="number" min="1" max="10" value="3"></div><div><button class="btn g" id="addBldBtn" style="width:100%">＋ إضافة مبنى</button></div></div>'
     +'<div class="acts"><button class="btn ghost" id="bldsClose">إغلاق</button></div>');
    $('#bldsClose').onclick=()=>{closeM();go()};
    $('#addBldBtn').onclick=()=>{
      const nm=$('#newBldName').value.trim(),fl=Math.max(1,Math.min(10,+$('#newBldFloors').value||5));
      if(!nm){toast('اكتب اسم المبنى أولًا.');return}
      pushUndo('إضافة مبنى');S.buildings.push({id:uid(),name:nm,floors:fl});save();render();toast('✓ تمت إضافة '+nm+' ('+fl+' طوابق)');
    };
    document.querySelectorAll('[data-bedit]').forEach(inp=>{
      inp.onchange=()=>{const b=S.buildings.find(x=>x.id===inp.dataset.bedit);if(b&&inp.value.trim()){pushUndo('تعديل اسم مبنى');b.name=inp.value.trim();save();toast('تم التعديل ✓')}};
    });
    document.querySelectorAll('[data-bfl]').forEach(inp=>{
      inp.onchange=()=>{const b=S.buildings.find(x=>x.id===inp.dataset.bfl);if(b){pushUndo('تعديل عدد الطوابق');b.floors=Math.max(1,Math.min(10,+inp.value||5));inp.value=b.floors;save();toast('تم تحديث طوابق '+b.name+' ✓')}};
    });
    document.querySelectorAll('[data-bdel]').forEach(btn=>{
      btn.onclick=()=>{
        const bid=btn.dataset.bdel,b=S.buildings.find(x=>x.id===bid);
        if(!b||!confirm('هل تريد حذف «'+b.name+'»؟ (ستبقى الفصول كما هي بدون مبنى)'))return;
        pushUndo('حذف مبنى');
        S.buildings=S.buildings.filter(x=>x.id!==bid);
        S.classes.forEach(c=>{if(c.bld===bid)c.bld=''});
        if(UI.mapBld===bid)UI.mapBld='all';
        save();render();toast('تم حذف المبنى ✓');
      };
    });
  };
  render();
}

function vPlan(){
  if(!S.teachers.length||!S.classes.length)return'<div class="card c"><h3>ابدأ من هنا 👋</h3><p class="note">ضيف المدرسين والفصول الأول، وبعدين وزّع الحصص.</p><div class="acts"><button class="btn g" data-a="tab" data-v="teachers">👩‍🏫 المدرسين ('+S.teachers.length+')</button><button class="btn alt" data-a="tab" data-v="budget">🏫 إحصائية الفصول ('+S.classes.length+')</button></div></div>';
  const m=UI.mode,list=m==='t'?S.teachers:S.classes;
  if(!list.some(x=>x.id===UI.sel[m]))UI.sel[m]=list[0].id;
  const id=UI.sel[m];
  const partnerId=UI.smart[m]||'';
  if(partnerId && !(m==='t'?cById(partnerId):tById(partnerId)))UI.smart[m]='';

  let info='';
  if(m==='t'){
    const t=tById(id),u=used(t),q=+t.quota||0,d=q-u;
    info='<span class="pill '+(!q?'warn':d===0?'ok':d<0?'bad':'warn')+'">النصاب '+(q||'؟')+' · موزّع '+u+(q?(d>0?' · باقي '+d:d<0?' · زيادة '+(-d):' ✓'):'')+'</span>';
  }else{
    info='<span class="pill ok">حصص الفصل: '+S.slots.filter(s=>s.c===id).reduce((a,s)=>a+s.n,0)+' في الأسبوع</span>';
  }

  const P=S.periods[UI.sh],sl=S.slots.filter(s=>s.sh===UI.sh&&(m==='t'?s.t===id:s.c===id));
  const brkAfter=breakAfterPeriod(UI.sh);
  let smartOkCount=0,smartBusyCount=0;

  let g='<div class="gwrap"><table class="grid"><tr><th class="pc">الحصة</th>'+DAYS.map(d=>{const isOff=m==='t'&&Array.isArray((tById(id)||{}).offDays)&&tById(id).offDays.includes(d);return'<th style="background:'+(isOff?'#64748B':DAYC[d])+'">'+DN[d]+(isOff?' (راحة)':'')+'</th>'}).join('')+'</tr>';
  for(let p=1;p<=P.length;p++){
    g+='<tr><td class="pc">'+p+'<small>'+hm(P[p-1].s)+'</small></td>';
    for(const d of DAYS){
      const c=sl.find(x=>x.day===d&&x.p<=p&&p<x.p+x.n);
      if(c){
        if(c.p===p){
          const bad=conflicts(c,c.id).length;
          const mainLbl=m==='t'?cName(c.c):(c.sub||tName(c.t));
          const rm=c.r?rName(c.r):'';const subLbl=(m==='t'?c.sub:tName(c.t))+(rm?' · '+rm:'');
          g+='<td class="c'+(bad?' bad':'')+(UI.moveSrc===c.id?' move-src':'')+'" draggable="true" rowspan="'+c.n+'" data-sid="'+c.id+'" data-d="'+d+'" data-p="'+p+'" style="'+subjectStyleVars(c.sub)+'"><div class="cell-in"><div class="sub-svg">'+subjectIconHTML(c.sub)+'</div><div class="cell-txt"><b>'+esc(mainLbl)+'</b><small>'+esc(subLbl)+'</small></div></div></td>';
        }
      }else{
        let cls='e',ttl='';
        if(UI.smart[m]){
          const probe={t:m==='t'?id:UI.smart[m],c:m==='c'?id:UI.smart[m],day:d,sh:UI.sh,p,n:1};
          const cf=conflicts(probe,null);
          if(!cf.length){cls+=' smart-ok';smartOkCount++;ttl='متاح للتوزيع — اضغط للإضافة فورًا'}
          else{cls+=' smart-busy';smartBusyCount++;ttl=cf.join(' | ')}
        }
        g+='<td class="'+cls+'" data-d="'+d+'" data-p="'+p+'"'+(ttl?' title="'+esc(ttl)+'"':'')+'></td>';
      }
    }
    g+='</tr>';
    if(p===brkAfter){
      const b=S.brk[UI.sh];
      g+='<tr class="brk-row"><td colspan="7">☕ الفسحة ('+hm(b.s)+' - '+hm(b.e)+')</td></tr>';
    }
  }
  g+='</table></div>';

  // Selector with search filter
  const q=normAr(UI.planQ);
  const filteredList=m==='t'
    ? S.teachers.filter(x=>!q||normAr(x.name+' '+x.subject+' '+x.code).includes(q))
    : S.classes.filter(x=>!q||normAr(x.name).includes(q));
  const selOpts=m==='c'
    ? classSelectOptions(id,UI.planQ)
    : (filteredList.length?filteredList.map(x=>'<option value="'+x.id+'"'+(x.id===id?' selected':'')+'>'+esc(x.name)+(x.subject?' - '+esc(x.subject):'')+'</option>').join(''):'<option value="">لا توجد نتائج مطابقة</option>');

  // Smart partner dropdown
  const smartOpts=m==='t'
    ? '<option value="">— اختر فصلًا لتلوين الخانات المتاحة معًا —</option>'+classSelectOptions(UI.smart.t)
    : '<option value="">— اختر مدرّسًا لتلوين الخانات المتاحة معًا —</option>'+S.teachers.map(x=>'<option value="'+x.id+'"'+(x.id===UI.smart.c?' selected':'')+'>'+esc(x.name)+(x.subject?' - '+esc(x.subject):'')+'</option>').join('');

  const showSmart=UI.smartOpen||!!UI.smart[m];
  return'<div class="card">'
   +'<div class="plan-top">'
   +'<div class="seg"><button data-a="mode" data-v="t" class="'+(m==='t'?'on':'')+'">بالمدرّس</button><button data-a="mode" data-v="c" class="'+(m==='c'?'on':'')+'">بالفصل</button></div>'
   +'<div class="search-box"><input id="planSearch" placeholder="'+(m==='t'?'بحث سريع عن مدرّس...':'بحث سريع عن فصل...')+'" value="'+esc(UI.planQ)+'"></div>'
   +'<select id="pSel">'+selOpts+'</select>'
   +'</div>'
   +'<div class="plan-sub">'
   +'<div class="seg">'+['m','x','e'].map(k=>'<button data-a="sh" data-v="'+k+'" class="'+(UI.sh===k?'on':'')+'">'+SI[k]+' '+SHN[k]+'</button>').join('')+'</div>'
   +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+info
   +'<button class="smart-toggle'+(UI.moveMode?' on':'')+'" data-a="toggleMove">⇄ نقل سريع</button><button class="smart-toggle" data-a="copyPlanDlg">📋 نسخ جدول</button><button class="smart-toggle" data-a="autoGen">⚡ توليد تلقائي</button><button class="smart-toggle'+(showSmart?' on':'')+'" data-a="toggleSmart">✨ التلوين الذكي'+(UI.smart[m]?' ('+smartOkCount+')':'')+'</button></div>'
   +'</div>'
   +(UI.moveMode?'<div class="move-banner"><span>'+(UI.moveSrc?'✓ تم تحديد الحصة — اضغط على خانة فارغة لنقلها أو على حصة أخرى لتبديلهما':'وضع النقل السريع: اضغط على أي حصة أولًا لتحديدها')+'</span><button class="btn ghost sm" data-a="toggleMove">✕ إنهاء</button></div>':'')+(showSmart?'<div class="smart-bar">'
   +'<span class="smart-title">✨ تلوين الخانات المتاحة:</span>'
   +'<select id="smartSel">'+smartOpts+'</select>'
   +(UI.smart[m]?'<button class="btn ghost sm" data-a="clearSmart">✕ إلغاء</button>':'')
   +(UI.smart[m]?'<div class="smart-legend"><span><i class="dot ok"></i>متاح عند الطرفين ('+smartOkCount+')</span><span><i class="dot busy"></i>مشغول ('+smartBusyCount+')</span><span>· اضغط على أي خانة خضراء للإضافة مباشرة</span></div>':'')
   +'</div>':'')
   +g
   +'<p class="note" style="margin-top:8px">اسحب أي حصة وأفلتها في خانة فاضية لنقلها أو فوق حصة أخرى لتبديلهما، أو اضغط على أي خانة للتعديل اليدوي.</p></div>';
}

function renderTeachersList(){
  const q=normAr(UI.tQ);
  const filtered=S.teachers.filter(t=>{
    const hay=normAr([t.name,t.subject,t.code,t.phone].join(' '));
    if(q&&!hay.includes(q))return false;
    const u=used(t),qt=+t.quota||0;
    if(UI.tF==='ok')return qt>0&&u===qt;
    if(UI.tF==='under')return qt>0&&u<qt;
    if(UI.tF==='over')return qt>0&&u>qt;
    return true;
  });
  if(!filtered.length)return'<div class="card c"><p class="note">لا يوجد مدرسون مطابقون للبحث أو الفلتر الحالي.</p></div>';

  // Group by subject
  const groups=new Map();
  filtered.forEach(t=>{
    const sub=(t.subject||'').trim()||'بدون مادة';
    if(!groups.has(sub))groups.set(sub,[]);
    groups.get(sub).push(t);
  });

  if(!UI.openSubs)UI.openSubs={};
  const autoOpen=!!q||groups.size===1;

  return[...groups.entries()].map(([sub,list])=>{
    const isOpen=autoOpen||!!UI.openSubs[sub];
    const th=subjectTheme(sub==='بدون مادة'?'':sub);
    const subUsed=list.reduce((a,t)=>a+used(t),0);
    const subQuota=list.reduce((a,t)=>a+(+t.quota||0),0);
    return'<div class="sub-grp" style="--sc-bd:'+th.bd+'">'
     +'<div class="sub-grp-hdr" data-a="tSubTog" data-sub="'+esc(sub)+'">'
     +'<div class="sub-grp-l"><div class="sub-grp-ico">'+subjectIconHTML(sub==='بدون مادة'?'':sub)+'</div>'
     +'<div><b style="font-size:15px">'+esc(sub)+'</b><small class="note" style="display:block">'+list.length+' مدرّس'+(subQuota?' · النصاب '+subUsed+' / '+subQuota:'')+'</small></div></div>'
     +'<div class="sub-grp-r"><span class="pill ok">'+list.length+'</span><span style="font-size:14px;color:var(--mute)">'+(isOpen?'▾':'▸')+'</span></div>'
     +'</div>'
     +(isOpen?'<div class="sub-grp-body">'
       +list.map(t=>{

function dayFromDate(iso){
  const parts=String(iso||'').split('-').map(Number);
  if(parts.length!==3)return new Date().getDay();
  return new Date(parts[0],parts[1]-1,parts[2]).getDay();
}
function coverCandidates(slot,dateStr,absentIds){
  const r=rng(slot),day=slot.day;
  const subKey=normAr(slot.sub);
  const busySubTeachers=new Set(
    (S.subs||[]).filter(x=>x.date===dateStr&&x.sh===slot.sh&&x.p===slot.p&&x.coverId).map(x=>x.coverId)
  );
  const out=[];
  S.teachers.forEach(t=>{
    if(t.id===slot.t||absentIds.has(t.id))return;
    if(Array.isArray(t.offDays)&&t.offDays.includes(day))return;
    if(busySubTeachers.has(t.id))return;
    const hasClass=S.slots.some(o=>o.t===t.id&&o.day===day&&ovl(r,rng(o)));
    if(hasClass)return;
    const sameSub=!!(subKey&&normAr(t.subject)===subKey);
    const daySubs=(S.subs||[]).filter(x=>x.date===dateStr&&x.coverId===t.id).length;
    const wkLoad=used(t);
    out.push({t,sameSub,daySubs,wkLoad});
  });
  out.sort((a,b)=>{
    if(a.sameSub!==b.sameSub)return a.sameSub?-1:1;
    if(a.daySubs!==b.daySubs)return a.daySubs-b.daySubs;
    return a.wkLoad-b.wkLoad;
  });
  return out;
}

function applyClassBudget(){
  const b=S.budget||{stage:'prim',counts:{}};
  const st=STAGES[b.stage]||STAGES.prim;
  const wanted=[];
  st.grades.forEach(g=>{
    const cnt=Math.max(0,Math.min(40,+b.counts[g]||0));
    const pref=(st.prefix&&st.prefix[g])||(g+'/');
    for(let n=1;n<=cnt;n++)wanted.push(pref+n);
  });
  if(!wanted.length){toast('اكتب عدد الفصول في صف واحد على الأقل.');return}
  pushUndo('توليد الفصول من الإحصائية');
  const wantedSet=new Set(wanted);
  let added=0,removed=0,keptBusy=0;
  // Remove unused numbered/KG classes not in new budget (keep any class that has scheduled slots)
  S.classes=S.classes.filter(c=>{
    if(wantedSet.has(c.name))return true;
    const isManaged=classIsNumbered(c.name)||/^KG[12]\//.test(c.name);
    if(!isManaged)return true;
    const hasSlots=S.slots.some(s=>s.c===c.id);
    if(hasSlots){keptBusy++;return true}
    removed++;return false;
  });
  const existing=new Set(S.classes.map(c=>c.name));
  wanted.forEach(name=>{
    if(!existing.has(name)){S.classes.push({id:uid(),name});existing.add(name);added++}
  });
  // Sort classes naturally
  S.classes.sort((a,b)=>a.name.localeCompare(b.name,'en',{numeric:true}));
  save();go();
  toast('✓ تم توليد '+wanted.length+' فصل ('+(added?'أُضيف '+added:'')+(added&&removed?' · ':'')+(removed?'حُذف '+removed:'')+((!added&&!removed)?'محدّث بالفعل':'')+')'+(keptBusy?' · تم الإبقاء على '+keptBusy+' فصل به حصص':''));
}

   +'<p class="note" style="margin-top:6px">سيتم نسخ حصص هذا اليوم في الفترة الحالية مع تخطي أي تعارض أو يوم راحة.</p>'
   +'</div>'
   +'<div class="acts"><button class="btn g" id="cpOk">📋 تنفيذ النسخ</button><button class="btn ghost" id="cpNo">إلغاء</button></div>');
  let mode='c';
  $('#cpTabC').onclick=()=>{mode='c';$('#cpTabC').classList.add('on');$('#cpTabD').classList.remove('on');$('#cpBodyC').hidden=false;$('#cpBodyD').hidden=true};
  $('#cpTabD').onclick=()=>{mode='d';$('#cpTabD').classList.add('on');$('#cpTabC').classList.remove('on');$('#cpBodyD').hidden=false;$('#cpBodyC').hidden=true};
  $('#cpNo').onclick=closeM;
  $('#cpOk').onclick=()=>{
    let copied=0,skipped=0;
    if(mode==='c'){
      const fc=$('#cpFromC').value,tc=$('#cpToC').value;
      if(!fc||!tc||fc===tc){toast('اختر فصلين مختلفين.');return}
      const src=S.slots.filter(s=>s.sh===sh&&s.c===fc);
      if(!src.length){toast('الفصل المصدر فارغ.');return}
      pushUndo('نسخ جدول فصل');
      src.forEach(s=>{
        const probe=Object.assign({},s,{id:uid(),c:tc});
        if(!conflicts(probe,null).length){S.slots.push(probe);copied++}else skipped++;
      });
    }else{
      const fd=+$('#cpFromD').value,td=+$('#cpToD').value;
      if(fd===td){toast('اختر يومين مختلفين.');return}
      const src=S.slots.filter(s=>s.sh===sh&&s.day===fd);
      if(!src.length){toast('اليوم المصدر فارغ.');return}
      pushUndo('نسخ جدول يوم');
      src.forEach(s=>{
        const probe=Object.assign({},s,{id:uid(),day:td});
        if(!conflicts(probe,null).length){S.slots.push(probe);copied++}else skipped++;
      });
    }
    save();closeM();go();
    toast('✓ تم نسخ '+copied+' حصة'+(skipped?' (تم تخطي '+skipped+' بسبب التعارض)':''));
  };
}

function getClassLocForDay(c,day){
  if(c&&c.fly&&typeof c.fly==='object'){
    const pair=DAY_PAIRS.find(dp=>dp.days.includes(+day));
    if(pair&&c.fly[pair.id]&&(c.fly[pair.id].bld||c.fly[pair.id].floor!=='')){
      return{bld:c.fly[pair.id].bld||c.bld||'',floor:c.fly[pair.id].floor!==undefined&&c.fly[pair.id].floor!==''?String(c.fly[pair.id].floor):String(c.floor||''),isFly:true,room:c.fly[pair.id].room||''};
    }
  }
  return{bld:(c&&c.bld)||'',floor:String((c&&c.floor)||''),isFly:false,room:''};
}
function isFlyingClass(c){
  if(!c||!c.fly)return false;
  return DAY_PAIRS.some(dp=>c.fly[dp.id]&&(c.fly[dp.id].bld||c.fly[dp.id].floor!==''));
}

function loadPresetClasses(){
  if(!confirm('سيتم إضافة وتحديث الـ '+PRESET_CLASSES.length+' فصل من الورقتين (المبنى الأساسي والفرعي والأدوار الخمسة والفصل الطائر). موافق؟'))return;
  pushUndo('استيراد فصول الورقتين');
  if(!Array.isArray(S.buildings)||!S.buildings.length)S.buildings=def().buildings;
  if(!S.buildings.some(b=>b.id==='main'))S.buildings.unshift({id:'main',name:'المبنى الأساسي',floors:5});
  if(!S.buildings.some(b=>b.id==='sub'))S.buildings.push({id:'sub',name:'المبنى الفرعي',floors:5});
  const byName=new Map(S.classes.map(c=>[c.name,c]));
  PRESET_CLASSES.forEach(([name,bld,floor,fly])=>{
    let c=byName.get(name);
    if(!c){c={id:uid(),name};S.classes.push(c);byName.set(name,c)}
    c.bld=bld;c.floor=floor;
    if(fly)c.fly=JSON.parse(JSON.stringify(fly));else delete c.fly;
  });
  S.classes.sort((a,b)=>a.name.localeCompare(b.name,'en',{numeric:true}));
  S.budget={stage:'prim',counts:{1:9,2:10,3:13,4:14,5:15,6:18}};
  save();closeM();go();
  toast('✓ تم تحميل '+PRESET_CLASSES.length+' فصل بتوزيع المباني والأدوار والفصل الطائر!');
}

function computeQuality(){
  const issues=[];
  const cf=allConflicts();
  if(cf.length)issues.push({lvl:'bad',title:'تعارضات الجدول ('+cf.length+')',items:cf});

  // Check teacher consecutive periods (>=4 in a row) or heavy days (>=6 periods)
  const tStress=[];
  S.teachers.forEach(t=>{
    DAYS.forEach(d=>{
      ['m','x','e'].forEach(sh=>{
        const periods=new Set();
        S.slots.filter(s=>s.t===t.id&&s.day===d&&s.sh===sh).forEach(s=>{for(let k=0;k<s.n;k++)periods.add(s.p+k)});
        if(!periods.size)return;
        const arr=[...periods].sort((a,b)=>a-b);
        let run=1,maxRun=1;
        for(let i=1;i<arr.length;i++){if(arr[i]===arr[i-1]+1){run++;if(run>maxRun)maxRun=run}else run=1}
        if(maxRun>=4)tStress.push(t.name+' ('+DN[d]+' - '+SHN[sh]+'): '+maxRun+' حصص متصلة بدون راحة');
        else if(arr.length>=6)tStress.push(t.name+' ('+DN[d]+' - '+SHN[sh]+'): '+arr.length+' حصص في يوم واحد');
      });
    });
  });
  if(tStress.length)issues.push({lvl:'warn',title:'ضغط الحصص على المدرسين ('+tStress.length+')',items:tStress});

  // Check class gaps (empty periods between first & last period) and subject repetition (>=3 same subject in one day)
  const cGaps=[],cRep=[];
  S.classes.forEach(c=>{
    DAYS.forEach(d=>{
      ['m','x','e'].forEach(sh=>{
        const sl=S.slots.filter(s=>s.c===c.id&&s.day===d&&s.sh===sh);
        if(!sl.length)return;
        const periods=new Set(),subCnt={};
        sl.forEach(s=>{
          for(let k=0;k<s.n;k++)periods.add(s.p+k);
          const k=s.sub||'—';subCnt[k]=(subCnt[k]||0)+s.n;
        });
        const arr=[...periods].sort((a,b)=>a-b);
        for(let p=arr[0];p<=arr[arr.length-1];p++){
          if(!periods.has(p)){cGaps.push('فصل '+c.name+' ('+DN[d]+'): فراغ في الحصة '+p);break}
        }
        Object.entries(subCnt).forEach(([sub,cnt])=>{if(cnt>=3)cRep.push('فصل '+c.name+' ('+DN[d]+'): مادة '+sub+' ('+cnt+' حصص في نفس اليوم)')});
      });
    });
  });
  if(cGaps.length)issues.push({lvl:'warn',title:'فجوات في جدول الفصول ('+cGaps.length+')',items:cGaps});
  if(cRep.length)issues.push({lvl:'warn',title:'تكرار نفس المادة في يوم واحد ('+cRep.length+')',items:cRep});

  // Quota balance check
  const qDiff=[];
  S.teachers.forEach(t=>{const q=+t.quota||0,u=used(t);if(q&&u!==q)qDiff.push(t.name+': موزّع '+u+' من أصل '+q)});
  if(qDiff.length)issues.push({lvl:'warn',title:'فروق الأنصبة ('+qDiff.length+')',items:qDiff});

  const penalty=cf.length*15+tStress.length*5+cGaps.length*4+cRep.length*4+qDiff.length*3;
  const score=S.slots.length?Math.max(10,Math.min(100,100-penalty)):0;
  return{score,issues};
}

function buildPrintSection(kind,id,sh){
  const isAll=sh==='all';
  const P=S.periods[isAll?'m':sh];
  const shLabel=isAll?'كل الفترات':('الفترة '+SHN[sh]);
  const brk=!isAll&&S.brk[sh]&&S.brk[sh].s&&S.brk[sh].e?' · الفسحة: '+hm(S.brk[sh].s)+' - '+hm(S.brk[sh].e):'';
  const mainTitle=(S.school.name||'جدول المدرسة')+' — '+(kind==='general'?'الجدول العام الأسبوعي':kind==='teacher'?'جدول المدرّس':'جدول الفصل');
  const badgeLbl=kind==='general'?'الجدول':kind==='teacher'?'المدرّس':'الفصل الدراسي';
  const badgeVal=kind==='general'?shLabel:kind==='teacher'?tName(id):cName(id);

  // Count periods per subject for the footer legend
  const counts=new Map();
  const matchingSlots=S.slots.filter(s=>(isAll||s.sh===sh)&&(kind==='general'||(kind==='teacher'?s.t===id:s.c===id)));
  matchingSlots.forEach(s=>{const k=s.sub||'مادة';counts.set(k,(counts.get(k)||0)+s.n)});

  const rows=DAYS.map(d=>{
    let tds='';
    for(let i=0;i<P.length;){
      const p=i+1;
      const items=matchingSlots.filter(s=>s.day===d&&s.p<=p&&p<s.p+s.n);
      if(!items.length){tds+='<td class="p-empty"></td>';i++;continue}
      if(kind!=='general'&&items.length===1){
        const s=items[0];
        let span=1;
        // Merge consecutive periods of the exact same slot (or adjacent identical subject+teacher/class)
        if(s.p===p&&s.n>1){span=Math.min(s.n,P.length-i)}
        else{
          while(i+span<P.length){
            const nx=matchingSlots.filter(x=>x.day===d&&x.p<=(p+span)&&(p+span)<x.p+x.n);
            if(nx.length===1&&nx[0].sub===s.sub&&nx[0].t===s.t&&nx[0].c===s.c&&nx[0].sh===s.sh)span++;
            else break;
          }
        }
        const primary=kind==='teacher'?cName(s.c):(s.sub||tName(s.t));
        const rm=s.r?rName(s.r):'';const secondary=(kind==='teacher'?s.sub:tName(s.t))+(rm?' · '+rm:'');
        tds+='<td class="p-slot" colspan="'+span+'" style="'+subjectStyleVars(s.sub)+'"><div class="p-card'+(span===1?' single':'')+'"><div class="p-ico">'+subjectIconHTML(s.sub)+'</div><div class="p-txt"><b>'+esc(primary)+'</b><small>'+esc(secondary)+(isAll?' · '+SI[s.sh]:'')+'</small></div></div></td>';
        i+=span;
      }else{
        const s0=items[0];
        tds+='<td class="p-slot" style="'+subjectStyleVars(s0.sub)+'">'+items.map(s=>'<div style="font-size:9px;line-height:1.15"><b>'+esc(cName(s.c))+'</b> <small>'+esc(s.sub||tName(s.t))+'</small></div>').join('<hr>')+'</td>';
        i++;
      }
    }
    return'<tr><td class="day">'+DN[d]+'</td>'+tds+'</tr>';
  }).join('');

  const legendHTML=[...counts.entries()].map(([sub,cnt])=>{
    const th=subjectTheme(sub);
    const cntTxt=cnt===1?'حصة واحدة':cnt===2?'حصتان':cnt+' حصص';
    return'<span><i style="background:'+th.bd+'"></i>'+esc(sub)+' ('+cntTxt+')</span>';
  }).join('');

  const schoolMeta=[S.school.name||'جدول المدرسة',S.school.admin,S.school.gov].filter(Boolean).join(' · ')+' · '+shLabel+brk;
  return'<section class="print-page">'
   +'<div class="p-banner">'
   +'<div class="p-banner-r"><div class="p-banner-ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></div>'
   +'<div><h1>'+esc(mainTitle)+'</h1><div class="p-sub">'+esc(schoolMeta)+'</div></div></div>'
   +'<div class="p-badge"><small>'+esc(badgeLbl)+'</small><b>'+esc(badgeVal)+'</b></div>'
   +'</div>'
   +'<div class="p-body"><table class="print-table"><thead><tr><th class="day">اليوم / الحصة</th>'
   +P.map((_,i)=>'<th>'+pLabel(i)+'</th>').join('')
   +'</tr></thead><tbody>'+rows+'</tbody></table></div>'
   +'<div class="p-footer"><div class="p-legend">'+(legendHTML||'<span>لا توجد حصص مسجلة</span>')+'</div><div>تاريخ الطباعة: '+esc(printStamp())+'</div></div>'
   +'</section>';
}


function buildExcelSheetXML(sheetName,title,subTitle,kind,id,sh){
  const xesc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const safeName=String(sheetName||'جدول').replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31);
  const isAll=sh==='all',P=S.periods[isAll?'m':sh];
  let rows='<Row><Cell ss:StyleID="title" ss:MergeAcross="'+P.length+'"><Data ss:Type="String">'+xesc(title)+'</Data></Cell></Row>';
  if(subTitle)rows+='<Row><Cell ss:StyleID="sub" ss:MergeAcross="'+P.length+'"><Data ss:Type="String">'+xesc(subTitle)+'</Data></Cell></Row>';
  rows+='<Row><Cell ss:StyleID="hdr"><Data ss:Type="String">اليوم / الحصة</Data></Cell>'
    +P.map((pr,i)=>'<Cell ss:StyleID="hdr"><Data ss:Type="String">حصة '+(i+1)+(isAll?'':' ('+hm(pr.s)+')')+'</Data></Cell>').join('')+'</Row>';
  DAYS.forEach(d=>{
    rows+='<Row ss:Height="36"><Cell ss:StyleID="day"><Data ss:Type="String">'+xesc(DN[d])+'</Data></Cell>';
    for(let i=0;i<P.length;i++){
      const p=i+1;
      const items=S.slots.filter(s=>(isAll||s.sh===sh)&&s.day===d&&s.p<=p&&p<s.p+s.n&&(kind==='general'||(kind==='teacher'?s.t===id:s.c===id)));
      const txt=items.map(s=>{
        const main=kind==='teacher'?cName(s.c):kind==='class'?(s.sub||tName(s.t)):cName(s.c);
        const sec=kind==='teacher'?s.sub:tName(s.t);
        const rm=s.r?(' - '+rName(s.r)):'';
        return main+(sec?' ('+sec+rm+')':'');
      }).join(' | ');
      rows+='<Cell ss:StyleID="'+(txt?'cell':'empty')+'"><Data ss:Type="String">'+xesc(txt)+'</Data></Cell>';
    }
    rows+='</Row>';
  });
  const cols='<Column ss:Width="82"/>'+P.map(()=>'<Column ss:Width="95"/>').join('');
  return'<Worksheet ss:Name="'+xesc(safeName)+'"><Table>'+cols+rows+'</Table><WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><DisplayRightToLeft/><PageSetup><Layout x:Orientation="Landscape"/></PageSetup></WorksheetOptions></Worksheet>';
}
function downloadExcelWorkbook(sheetsXML,filename){
  const xml='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?>'
   +'<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'
   +'<Styles>'
   +'<Style ss:ID="title"><Font ss:Bold="1" ss:Size="14" ss:Color="#FFFFFF"/><Interior ss:Color="#1B4353" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/></Style>'
   +'<Style ss:ID="sub"><Font ss:Size="10" ss:Color="#334155"/><Interior ss:Color="#F1F5F9" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/></Style>'
   +'<Style ss:ID="hdr"><Font ss:Bold="1" ss:Size="10" ss:Color="#FFFFFF"/><Interior ss:Color="#0F766E" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>'
   +'<Style ss:ID="day"><Font ss:Bold="1" ss:Size="10" ss:Color="#1B4353"/><Interior ss:Color="#E2E8F0" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>'
   +'<Style ss:ID="cell"><Font ss:Bold="1" ss:Size="9.5" ss:Color="#0F172A"/><Interior ss:Color="#ECFDF5" ss:Pattern="Solid"/><Alignment ss:Horizontal="Center" ss:Vertical="Center" ss:WrapText="1"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1"/></Borders></Style>'
   +'<Style ss:ID="empty"><Alignment ss:Horizontal="Center" ss:Vertical="Center"/><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#CBD5E1"/><Border ss:Position="Left" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#CBD5E1"/><Border ss:Position="Right" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#CBD5E1"/><Border ss:Position="Top" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#CBD5E1"/></Borders></Style>'
   +'</Styles>'+sheetsXML+'</Workbook>';
  const blob=new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  toast('تم تصدير جدول Excel بنجاح ✓');
}
function exportScheduleExcel(kind,id){
  if(kind!=='general'&&!id){toast('اختر عنصرًا للتصدير أولًا.');return}
  const sh=(S.printCfg&&S.printCfg.sh)||UI.printSh||'m';
  const title=kind==='general'?'الجدول العام':kind==='teacher'?'جدول المدرّس: '+tName(id):'جدول الفصل: '+cName(id);
  const sub=[S.school.name||'جدول المدرسة',S.school.admin,S.school.gov,sh==='all'?'كل الفترات':SHN[sh]].filter(Boolean).join(' · ');
  const sheet=buildExcelSheetXML(kind==='general'?'الجدول العام':kind==='teacher'?tName(id):cName(id),title,sub,kind,id,sh);
  downloadExcelWorkbook(sheet,'timetable-'+kind+'-'+new Date().toISOString().slice(0,10)+'.xls');
}
function exportAllScheduleExcel(kind){
  const sh=(S.printCfg&&S.printCfg.sh)||UI.printSh||'m';
  const list=kind==='teacher'?S.teachers:S.classes.filter(c=>S.slots.some(s=>s.c===c.id&&(sh==='all'||s.sh===sh)));
  if(!list.length){toast(kind==='teacher'?'لا يوجد مدرسون للتصدير.':'لا توجد فصول بها حصص للتصدير.');return}
  const sub=[S.school.name||'جدول المدرسة',sh==='all'?'كل الفترات':SHN[sh]].filter(Boolean).join(' · ');
  const usedNames=new Set();
  const sheets=list.map((x,idx)=>{
    let nm=(x.name||('شيت'+(idx+1))).replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,27);
    if(usedNames.has(nm))nm=nm+'_'+(idx+1);
    usedNames.add(nm);
    return buildExcelSheetXML(nm,(kind==='teacher'?'جدول المدرّس: ':'جدول الفصل: ')+x.name,sub,kind,x.id,sh);
  }).join('');
  downloadExcelWorkbook(sheets,'all-'+(kind==='teacher'?'teachers':'classes')+'-'+new Date().toISOString().slice(0,10)+'.xls');
}

function buildMiniTeacherCard(t,sh){

function printAll(kind){
  applyPrintCfg();const sh=(S.printCfg&&S.printCfg.sh)||UI.printSh;UI.printLayout=(S.printCfg&&S.printCfg.layout)||UI.printLayout;
  const list=kind==='teacher'
    ? S.teachers
    : S.classes.filter(c=>S.slots.some(s=>s.c===c.id&&(sh==='all'||s.sh===sh)));
  if(!list.length){toast(kind==='teacher'?'لا يوجد مدرسون للطباعة.':'لا توجد فصول بها حصص في هذه الفترة.');return}
  if(kind==='teacher'&&UI.printLayout==='4'){
    const sheets=[];
    for(let i=0;i<list.length;i+=4){
      const chunk=list.slice(i,i+4);
      sheets.push('<section class="print-sheet-4">'+chunk.map(t=>buildMiniTeacherCard(t,sh)).join('')+'</section>');
    }
    $('#printArea').innerHTML=sheets.join('');
  }else{
    $('#printArea').innerHTML=list.map(x=>buildPrintSection(kind,x.id,sh)).join('');
  }
  setTimeout(()=>window.print(),80);
}

function vSubjectLogos(){

function slotDlg(sid,day,p){
  const ex=sid?S.slots.find(s=>s.id===sid):null;
  const defT=UI.mode==='t'?UI.sel.t:(UI.smart.c||S.teachers[0].id);
  const defC=UI.mode==='c'?UI.sel.c:(UI.smart.t||S.classes[0].id);
  const cur=ex||{t:defT,c:defC,sub:'',r:'',day,sh:UI.sh,p,n:1};
  if(!ex)cur.sub=(tById(cur.t)||{}).subject||'';
  const P=S.periods[cur.sh],opt=(a,v)=>a.map(x=>'<option value="'+x.id+'"'+(x.id===v?' selected':'')+'>'+esc(x.name)+'</option>').join('');
  const roomOpts='<option value="">— الفصل نفسه (بدون قاعة خاصة) —</option>'+opt(S.rooms||[],cur.r||'');
  modal('<h3>'+(ex?'تعديل حصة':'إضافة حصة')+' ('+SI[cur.sh]+' '+SHN[cur.sh]+')</h3><label>المدرّس</label><select id="sT">'+opt(S.teachers,cur.t)+'</select><label>الفصل</label><select id="sC">'+classSelectOptions(cur.c)+'</select>'
   +'<div class="row"><div><label>المادة</label><input id="sS" value="'+esc(cur.sub)+'"></div><div><label>القاعة / المعمل (اختياري)</label><select id="sR">'+roomOpts+'</select></div></div>'
   +'<div class="row"><div><label>اليوم</label><select id="sD">'+DAYS.map(d=>'<option value="'+d+'"'+(d===cur.day?' selected':'')+'>'+DN[d]+'</option>').join('')+'</select></div><div><label>تبدأ من</label><select id="sP">'+P.map((q,i)=>'<option value="'+(i+1)+'"'+(i+1===cur.p?' selected':'')+'>الحصة '+(i+1)+' ('+hm(q.s)+')</option>').join('')+'</select></div><div><label>المدة</label><select id="sN"><option value="1">حصة</option><option value="2"'+(cur.n===2?' selected':'')+'>حصتين</option></select></div></div>'
   +'<div id="sLive" class="live-status ok"></div><label id="sForceWrap" style="display:none;align-items:center;gap:8px;margin-top:8px;cursor:pointer;color:var(--ink)"><input type="checkbox" id="sForce" style="width:auto"> تجاوز التنبيه والحفظ يدويًا</label>'
   +'<div class="err" id="sE"></div><div class="acts"><button class="btn g" id="sOk">حفظ</button><button class="btn ghost" id="sNo">إلغاء</button></div>'+(ex?'<div class="acts"><button class="btn red" id="sDel">🗑️ حذف الحصة</button></div>':''));
  let lastSub=cur.sub;
  const checkLive=()=>{
    const s={t:$('#sT').value,c:$('#sC').value,r:$('#sR').value,day:+$('#sD').value,sh:cur.sh,p:+$('#sP').value,n:+$('#sN').value};
    const lv=$('#sLive');
    if(s.p+s.n-1>P.length){lv.className='live-status bad';lv.textContent='⚠️ الحصتين خارج عدد الحصص المتاح.';return}
    const cf=conflicts(s,sid);
    const fw=$('#sForceWrap');
    if(cf.length){lv.className='live-status bad';lv.innerHTML='⚠️ '+cf.map(esc).join('<br>');if(fw)fw.style.display='flex'}
    else{lv.className='live-status ok';lv.textContent='✓ الخانة متاحة تمامًا بدون تعارض';if(fw)fw.style.display='none'}
  };
  checkLive();
  $('#sT').onchange=()=>{const t=tById($('#sT').value);if(!$('#sS').value||$('#sS').value===lastSub){lastSub=t.subject||'';$('#sS').value=lastSub}checkLive()};
  ['#sC','#sR','#sD','#sP','#sN'].forEach(sel=>$(sel).onchange=checkLive);
  $('#sNo').onclick=closeM;
  if(ex)$('#sDel').onclick=()=>{if(confirm('تحذف الحصة دي؟')){pushUndo('حذف حصة');S.slots=S.slots.filter(s=>s.id!==sid);save();closeM();go();toast('تم حذف الحصة')}}
  $('#sOk').onclick=()=>{
    const s={id:sid||uid(),t:$('#sT').value,c:$('#sC').value,r:$('#sR').value,sub:$('#sS').value.trim(),day:+$('#sD').value,sh:cur.sh,p:+$('#sP').value,n:+$('#sN').value};
    if(s.p+s.n-1>P.length){$('#sE').textContent='الحصتين خارج عدد الحصص.';return}
    const cf=conflicts(s,sid);
    if(cf.length&&!$('#sForce').checked){$('#sE').innerHTML=cf.map(esc).join('<br>')+'<br><small>يمكنك تفعيل «تجاوز التنبيه» بالأسفل للحفظ اليدوي.</small>';return}
    pushUndo(sid?'تعديل حصة':'إضافة حصة');
    if(sid)Object.assign(ex,s);else S.slots.push(s);
    save();closeM();go();
  };
}

    const teachers=S.teachers.filter(t=>(+t.quota||0)>0);
    if(!teachers.length){$('#agErr').textContent='أضف نصابًا للمدرسين أولًا ليتمكن البرنامج من التوزيع.';return}
    pushUndo('توليد تلقائي للجدول');
    if(mode==='reset'){S.slots=S.slots.filter(s=>s.sh!==sh)}
    let added=0,unplaced=0;
    const tasks=[];
    teachers.forEach(t=>{
      const rem=Math.max(0,(+t.quota||0)-used(t));
      for(let i=0;i<rem;i++)tasks.push(t);
    });
    tasks.forEach(t=>{
      let placed=false;
      const orderedCls=[...clsList].sort((a,b)=>{
        const ca=S.slots.filter(s=>s.c===a.id&&s.sub===t.subject).length;
        const cb=S.slots.filter(s=>s.c===b.id&&s.sub===t.subject).length;
        return ca-cb;
      });
      for(const c of orderedCls){
        if(placed)break;
        const orderedDays=[...DAYS].sort((a,b)=>{
          const da=S.slots.filter(s=>s.c===c.id&&s.day===a&&s.sh===sh).length;
          const db=S.slots.filter(s=>s.c===c.id&&s.day===b&&s.sh===sh).length;
          return da-db;
        });
        for(const d of orderedDays){
          if(Array.isArray(t.offDays)&&t.offDays.includes(d))continue;
          const sameSubDay=S.slots.filter(s=>s.c===c.id&&s.day===d&&s.sh===sh&&s.sub===(t.subject||'')).reduce((a,s)=>a+s.n,0);
          if(sameSubDay>=maxDay)continue;
          for(let p=1;p<=P.length;p++){
            const probe={id:uid(),t:t.id,c:c.id,r:'',sub:t.subject||'',day:d,sh,p,n:1};
            if(!conflicts(probe,null).length){
              S.slots.push(probe);added++;placed=true;break;
            }
          }
          if(placed)break;
        }
      }
      if(!placed)unplaced++;
    });
    save();closeM();go();
    toast('✓ تم توزيع '+added+' حصة تلقائيًا'+(unplaced?' (تعذّر توزيع '+unplaced+' حصة بسبب القيود)':''));
  };
}

const b64e=t=>btoa(unescape(encodeURIComponent(t))),b64d=b=>decodeURIComponent(escape(atob(b.replace(/\s/g,''))));
function gh(method,repo,path,body,raw){
  const u=CFG.api+'/repos/'+repo+'/contents/'+path.split('/').map(encodeURIComponent).join('/')+(method==='GET'?'?t='+Date.now():'');
  return fetch(u,{method,cache:'no-store',headers:Object.assign({'Authorization':'Bearer '+CFG.token,'Accept':raw?'application/vnd.github.raw+json':'application/vnd.github+json'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
}
async function ghGet(repo,path){
  const r=await gh('GET',repo,path);if(r.status===404)return null;if(!r.ok)throw new Error('http '+r.status);
  const j=await r.json();let text;
  if(j.content&&j.encoding==='base64')text=b64d(j.content);else{const rr=await gh('GET',repo,path,null,true);text=await rr.text()}
  return{sha:j.sha,text};
}
async function ghPut(repo,path,text,sha,msg){
  const body={message:msg,content:b64e(text)};if(sha)body.sha=sha;
  const r=await gh('PUT',repo,path,body);
  if(r.status===409||r.status===422){const e=new Error('conflict');e.conflict=true;throw e}
  if(!r.ok)throw new Error('http '+r.status);
  const j=await r.json();return j.content.sha;
}

/* ---------- Screenshot Capture (Offline & Online) ---------- */
async function takeScreenshot(){
  const savePng=async canvas=>{
    const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
    if(!blob)throw new Error('blob');
    const name='school-screenshot-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.png';
    const f=new File([blob],name,{type:'image/png'});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    toast('📸 تم حفظ صورة الشاشة بنجاح ✓');
  };

  // Method 1: Native crisp tab capture (Chrome / Edge Desktop — 100% offline)
  if(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia){
    try{
      const stream=await navigator.mediaDevices.getDisplayMedia({video:{cursor:'never'},audio:false,preferCurrentTab:true});
      const vid=document.createElement('video');
      vid.srcObject=stream;vid.muted=true;
      await new Promise(r=>{vid.onloadedmetadata=()=>{vid.play();setTimeout(r,120)}});
      const canvas=document.createElement('canvas');
      canvas.width=vid.videoWidth||1280;canvas.height=vid.videoHeight||720;
      canvas.getContext('2d').drawImage(vid,0,0,canvas.width,canvas.height);
      stream.getTracks().forEach(t=>t.stop());
      await savePng(canvas);
      return;
    }catch(e){
      if(e&&e.name==='NotAllowedError'){toast('تم إلغاء تصوير الشاشة.');return}
    }
  }

  // Method 2: Pure-DOM SVG foreignObject fallback (for browsers without getDisplayMedia)
  try{
    const el=$('#main')||document.body;
    const w=Math.max(el.scrollWidth,window.innerWidth),h=Math.max(el.scrollHeight,window.innerHeight);
    const styles=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n');
    const clone=document.body.cloneNode(true);
    clone.querySelectorAll('script,#toast,dialog').forEach(x=>x.remove());
    const xhtml=new XMLSerializer().serializeToString(clone);
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml" dir="rtl"><style>'+styles+'</style>'+xhtml+'</div></foreignObject></svg>';
    const img=new Image();
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml;charset=utf-8'}));
    await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
    const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0);URL.revokeObjectURL(url);
    await savePng(canvas);
  }catch(e){
    toast('في الموبايل استخدم زر الشاشة بالهاتف، أو على الكمبيوتر اسمح بتصوير النافذة عند ظهور الرسالة.');
  }
}

let voiceRec=null,voiceTimer=null;
function stopVoice(){
  clearTimeout(voiceTimer);voiceTimer=null;
  const btn=$('#btnVoice');if(btn)btn.classList.remove('listening');
  if(voiceRec){
    const r=voiceRec;voiceRec=null;
    try{r.onresult=r.onerror=r.onend=null;r.abort()}catch(e){}
  }
}
function runVoiceCmd(raw){
  const cmd=normAr(raw);
  if(!cmd)return;
  toast('🎙️ سمعت: «'+raw+'»');
  if(/تراجع|رجوع/.test(cmd)){doUndo();return}
  if(/اعاده|كرر/.test(cmd)){doRedo();return}
  if(/ليلي|داكن|مظلم/.test(cmd)){applyTheme('dark');return}
  if(/فاتح|نهاري|ابيض/.test(cmd)){applyTheme('light');return}
  if(/جوده|توازن|فحص/.test(cmd)){qualityDlg();return}
  if(/نسخه احتياطيه|احفظ نسخه/.test(cmd)){$('[data-a="bk"]')&&$('[data-a="bk"]').click();return}
  if(/توليد تلقائي|وزع تلقائي/.test(cmd)){UI.tab='plan';go();autoGenDlg();return}
  if(/اطبع العام|الجدول العام/.test(cmd)){UI.tab='print';go();printTable('general',null);return}

  const navMap=[
    ['dashboard',/رئيسيه|لوحه/],
    ['plan',/توزيع|الجدول/],
    ['subs',/احتياطي|غياب/],
    ['sup',/اشراف|طابور|ادوار/],
    ['teachers',/مدرسين|معلمين/],
    ['classes',/^فصول|الفصول|قاعات/],
    ['budget',/احصائيه/],
    ['print',/طباعه/],
    ['publish',/نشر/],
    ['backup',/نسخ|استرجاع/],
    ['settings',/اعدادات|مواعيد/]
  ];
  for(const [tab,rx] of navMap){
    if(rx.test(cmd)&&!cmd.includes('جدول ')){UI.tab=tab;go();return}
  }

  const mSched=cmd.match(/(?:جدول|افتح|ابحث عن)\s+(.+)/);
  if(mSched){
    const q=mSched[1].trim();
    const t=S.teachers.find(x=>normAr(x.name).includes(q));
    if(t){UI.tab='plan';UI.mode='t';UI.sel.t=t.id;go();return}
    const c=S.classes.find(x=>normAr(x.name).includes(q));
    if(c){UI.tab='plan';UI.mode='c';UI.sel.c=c.id;go();return}
  }
  toast('🎙️ لم أفهم الأمر «'+raw+'» — جرّب: افتح الاحتياطي، تراجع، فحص الجودة، أو افتح جدول [الاسم]');
}
function toggleVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=$('#btnVoice');
  if(!SR){toast('الأوامر الصوتية مدعومة في متصفح Chrome وEdge على الكمبيوتر والأندرويد.');return}
  if(voiceRec){stopVoice();toast('🎙️ تم إيقاف الميكروفون');return}
  try{
    const rec=new SR();
    voiceRec=rec;
    rec.lang='ar-EG';
    rec.continuous=false;
    rec.interimResults=false;
    rec.maxAlternatives=1;
    btn.classList.add('listening');
    toast('🎙️ تكلّم الآن بالأمر (وسيتوقف الميكروفون تلقائيًا)...');
    voiceTimer=setTimeout(()=>{if(voiceRec===rec){stopVoice();toast('🎙️ انتهى وقت الاستماع')}},7000);
    rec.onresult=e=>{const txt=e.results[0]&&e.results[0][0]&&e.results[0][0].transcript;stopVoice();if(txt)runVoiceCmd(txt)};
    rec.onerror=e=>{stopVoice();toast(e.error==='not-allowed'?'اسمح للمتصفح باستخدام الميكروفون أولًا.':'تعذر سماع الصوت، جرّب مرة أخرى.')};
    rec.onend=()=>{if(voiceRec===rec)stopVoice()};
    rec.start();
  }catch(e){stopVoice();toast('تعذر تشغيل الميكروفون.')}
}
