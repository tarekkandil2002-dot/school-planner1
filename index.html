<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <title>سجل الطلاب الذكي | مستر طارق</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #334155;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            padding-bottom: 70px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        header {
            background-color: var(--bg-card);
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            transform: translateZ(0);
        }
        header h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #60a5fa;
        }
        .badge-fast {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 12px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }
        .stat-card {
            background: var(--bg-card);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border);
            text-align: center;
            transform: translateZ(0);
        }
        .stat-val {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .stat-lbl {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        input, select, button {
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.9rem;
            outline: none;
        }
        input, select {
            background: var(--bg-input);
            color: var(--text-primary);
            padding: 9px 12px;
            flex: 1;
            min-width: 120px;
        }
        button {
            background: var(--accent);
            color: white;
            padding: 9px 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
        }
        button:active {
            opacity: 0.85;
        }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); }
        .btn-secondary { background: var(--bg-input); color: var(--text-primary); }
        .btn-sm { padding: 5px 9px; font-size: 0.8rem; }

        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 14px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }
        .tab-btn {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 7px 14px;
            white-space: nowrap;
        }
        .tab-btn.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .student-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .student-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transform: translateZ(0);
            will-change: transform;
        }
        .student-card.alert-4 {
            border-right: 4px solid var(--warning);
        }
        .st-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .st-name {
            font-weight: 700;
            font-size: 1rem;
        }
        .st-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }
        .st-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
        }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal.open { display: flex; }
        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <h1>سجل الطلاب الذكي</h1>
    <span class="badge-fast">صاروخ ⚡</span>
</header>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-val" id="statTotal">0</div>
            <div class="stat-lbl">إجمالي الطلاب</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" style="color: var(--warning);" id="statDue">0</div>
            <div class="stat-lbl">مستحق الدفع (4 حصص)</div>
        </div>
        <div class="stat-card">
            <div class="stat-val" style="color: var(--success);" id="statPaid">0</div>
            <div class="stat-lbl">خالص الشهر</div>
        </div>
    </div>

    <div class="tabs" id="navTabs">
        <button class="tab-btn active" data-tab="students">الطلاب والحضور</button>
        <button class="tab-btn" data-tab="timetable">الجدول الأسبوعي</button>
        <button class="tab-btn" data-tab="backup">النسخ الاحتياطي</button>
    </div>

    <!-- قسم الطلاب -->
    <div id="tab-students">
        <div class="controls">
            <input type="text" id="searchInput" placeholder="بحث بالاسم أو المجموعة...">
            <select id="groupFilter">
                <option value="all">كل المجموعات</option>
            </select>
            <button id="openAddModalBtn">+ طالب</button>
        </div>

        <div class="student-list" id="studentList"></div>

        <div class="pagination" id="paginationControls">
            <button class="btn-secondary btn-sm" id="prevPageBtn">السابق</button>
            <span id="pageInfo" style="font-size: 0.85rem; color: var(--text-secondary);">صفحة 1</span>
            <button class="btn-secondary btn-sm" id="nextPageBtn">التالي</button>
        </div>
    </div>

    <!-- قسم الجدول -->
    <div id="tab-timetable" class="hidden">
        <div class="controls">
            <input type="text" id="ttDay" placeholder="اليوم (مثال: السبت)">
            <input type="text" id="ttGroup" placeholder="المجموعة والموعد">
            <button id="addTtBtn">إضافة للجدول</button>
        </div>
        <div class="student-list" id="ttList"></div>
    </div>

    <!-- قسم النسخ الاحتياطي -->
    <div id="tab-backup" class="hidden">
        <div class="student-card">
            <p class="st-meta">احفظ نسخة احتياطية من بيانات الطلاب والجدول أو استرجعها في أي وقت.</p>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="btn-success" id="exportBtn">تصدير نسخة (JSON)</button>
                <button class="btn-secondary" id="importTriggerBtn">استيراد نسخة</button>
                <input type="file" id="importFile" accept=".json" class="hidden">
            </div>
        </div>
    </div>
</div>

<!-- نافذة إضافة طالب -->
<div class="modal" id="addModal">
    <div class="modal-box">
        <h3 style="margin-bottom: 4px;">إضافة طالب جديد</h3>
        <input type="text" id="stNameInput" placeholder="اسم الطالب">
        <input type="text" id="stGroupInput" placeholder="المجموعة / الصف (مثال: رابعة ابتدائي)">
        <input type="tel" id="stPhoneInput" placeholder="رقم واتساب ولي الأمر (مثال: 2010xxxxxxxx)">
        <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px;">
            <button class="btn-secondary" id="closeModalBtn">إلغاء</button>
            <button class="btn-success" id="saveStudentBtn">حفظ الطالب</button>
        </div>
    </div>
</div>

<script>
(() => {
    const STORAGE_KEY = 'smart_student_registry_v2';
    let state = {
        students: [],
        timetable: []
    };

    let currentPage = 1;
    const ITEMS_PER_PAGE = 15; // تقليل العدد لكل صفحة لضمان نعومة الاسكرول 100%
    let searchQuery = '';
    let selectedGroup = 'all';
    let saveTimer = null;

    function loadData() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
                const parsed = JSON.parse(raw);
                state.students = Array.isArray(parsed.students) ? parsed.students : [];
                state.timetable = Array.isArray(parsed.timetable) ? parsed.timetable : [];
            }
        } catch (e) {
            console.error('Error loading data', e);
        }
    }

    function scheduleSave() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {
                console.error('Storage full or error', e);
            }
        }, 500);
    }

    function updateStatsAndFilters() {
        const total = state.students.length;
        let due = 0;
        let paid = 0;
        const groups = new Set();

        for (let i = 0; i < total; i++) {
            const s = state.students[i];
            if (s.sessions >= 4) due++;
            else paid++;
            if (s.group) groups.add(s.group);
        }

        document.getElementById('statTotal').textContent = total;
        document.getElementById('statDue').textContent = due;
        document.getElementById('statPaid').textContent = paid;

        const filterEl = document.getElementById('groupFilter');
        const currentVal = filterEl.value;
        let optionsHtml = '<option value="all">كل المجموعات</option>';
        groups.forEach(g => {
            optionsHtml += `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`;
        });
        filterEl.innerHTML = optionsHtml;
        if (groups.has(currentVal) || currentVal === 'all') {
            filterEl.value = currentVal;
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function renderStudents() {
        const listEl = document.getElementById('studentList');
        const q = searchQuery.toLowerCase();

        const filtered = state.students.filter(s => {
            const matchGroup = selectedGroup === 'all' || s.group === selectedGroup;
            const matchQuery = !q || s.name.toLowerCase().includes(q) || (s.group && s.group.toLowerCase().includes(q));
            return matchGroup && matchQuery;
        });

        const totalPages = Math.max(1, Math.ceil(filtered.length / ITEMS_PER_PAGE));
        if (currentPage > totalPages) currentPage = totalPages;

        const start = (currentPage - 1) * ITEMS_PER_PAGE;
        const pageItems = filtered.slice(start, start + ITEMS_PER_PAGE);

        if (pageItems.length === 0) {
            listEl.innerHTML = '<div class="stat-card" style="color: var(--text-secondary);">لا يوجد طلاب مطابقون للبحث.</div>';
        } else {
            let html = '';
            for (let i = 0; i < pageItems.length; i++) {
                const s = pageItems[i];
                const isAlert = s.sessions >= 4;
                html += `
                <div class="student-card ${isAlert ? 'alert-4' : ''}" data-id="${s.id}">
                    <div class="st-top">
                        <div>
                            <div class="st-name">${escapeHtml(s.name)}</div>
                            <div class="st-meta">${escapeHtml(s.group || 'بدون مجموعة')} • الحصص: <strong>${s.sessions}</strong> / 4</div>
                        </div>
                        <span class="badge-fast" style="${isAlert ? 'background:rgba(245,158,11,0.2);color:#fbbf24;' : ''}">
                            ${isAlert ? 'مستحق الدفع' : 'نشط'}
                        </span>
                    </div>
                    <div class="st-actions">
                        <button class="btn-success btn-sm" data-action="attend">+ حصة</button>
                        <button class="btn-secondary btn-sm" data-action="reset">تجديد شهر</button>
                        <button class="btn-secondary btn-sm" data-action="whatsapp">واتساب</button>
                        <button class="btn-danger btn-sm" data-action="delete">حذف</button>
                    </div>
                </div>`;
            }
            listEl.innerHTML = html;
        }

        document.getElementById('pageInfo').textContent = `صفحة ${currentPage} من ${totalPages} (${filtered.length} طالب)`;
        document.getElementById('prevPageBtn').disabled = currentPage <= 1;
        document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
    }

    function renderTimetable() {
        const ttList = document.getElementById('ttList');
        if (state.timetable.length === 0) {
            ttList.innerHTML = '<div class="stat-card" style="color: var(--text-secondary);">لا توجد مواعيد مضافة في الجدول.</div>';
            return;
        }
        ttList.innerHTML = state.timetable.map((item, idx) => `
            <div class="student-card" style="flex-direction: row; justify-content: space-between; align-items: center;">
                <div>
                    <div class="st-name">${escapeHtml(item.day)}</div>
                    <div class="st-meta">${escapeHtml(item.group)}</div>
                </div>
                <button class="btn-danger btn-sm" data-tt-del="${idx}">حذف</button>
            </div>
        `).join('');
    }

    document.getElementById('studentList').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const card = btn.closest('.student-card');
        const id = card.dataset.id;
        const action = btn.dataset.action;
        const idx = state.students.findIndex(s => s.id === id);
        if (idx === -1) return;

        const student = state.students[idx];

        if (action === 'attend') {
            student.sessions = (student.sessions || 0) + 1;
            scheduleSave();
            updateStatsAndFilters();
            renderStudents();
        } else if (action === 'reset') {
            student.sessions = 0;
            scheduleSave();
            updateStatsAndFilters();
            renderStudents();
        } else if (action === 'whatsapp') {
            if (!student.phone) {
                alert('لا يوجد رقم هاتف مسجل لهذا الطالب.');
                return;
            }
            const cleanPhone = student.phone.replace(/[^0-9]/g, '');
            const msg = encodeURIComponent(`تقرير الطالب: ${student.name}\nالمجموعة: ${student.group || '-'}\nعدد الحصص المسجلة: ${student.sessions} من 4`);
            window.open(`https://wa.me/${cleanPhone}?text=${msg}`, '_blank');
        } else if (action === 'delete') {
            if (confirm(`حذف الطالب ${student.name}؟`)) {
                state.students.splice(idx, 1);
                scheduleSave();
                updateStatsAndFilters();
                renderStudents();
            }
        }
    });

    document.getElementById('navTabs').addEventListener('click', (e) => {
        const btn = e.target.closest('.tab-btn');
        if (!btn) return;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const target = btn.dataset.tab;
        ['students', 'timetable', 'backup'].forEach(t => {
            document.getElementById('tab-' + t).classList.toggle('hidden', t !== target);
        });
        if (target === 'timetable') renderTimetable();
    });

    let searchTimer = null;
    document.getElementById('searchInput').addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            searchQuery = e.target.value.trim();
            currentPage = 1;
            renderStudents();
        }, 250);
    });

    document.getElementById('groupFilter').addEventListener('change', (e) => {
        selectedGroup = e.target.value;
        currentPage = 1;
        renderStudents();
    });

    document.getElementById('prevPageBtn').addEventListener('click', () => {
        if (currentPage > 1) { currentPage--; renderStudents(); window.scrollTo({top: 0, behavior: 'smooth'}); }
    });
    document.getElementById('nextPageBtn').addEventListener('click', () => {
        currentPage++; renderStudents(); window.scrollTo({top: 0, behavior: 'smooth'});
    });

    const addModal = document.getElementById('addModal');
    document.getElementById('openAddModalBtn').addEventListener('click', () => {
        addModal.classList.add('open');
        document.getElementById('stNameInput').focus();
    });
    document.getElementById('closeModalBtn').addEventListener('click', () => {
        addModal.classList.remove('open');
    });
    document.getElementById('saveStudentBtn').addEventListener('click', () => {
        const name = document.getElementById('stNameInput').value.trim();
        const group = document.getElementById('stGroupInput').value.trim();
        const phone = document.getElementById('stPhoneInput').value.trim();
        if (!name) return alert('يرجى إدخال اسم الطالب');

        state.students.unshift({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            name,
            group,
            phone,
            sessions: 0
        });

        document.getElementById('stNameInput').value = '';
        document.getElementById('stGroupInput').value = '';
        document.getElementById('stPhoneInput').value = '';
        addModal.classList.remove('open');

        scheduleSave();
        updateStatsAndFilters();
        currentPage = 1;
        renderStudents();
    });

    document.getElementById('addTtBtn').addEventListener('click', () => {
        const day = document.getElementById('ttDay').value.trim();
        const group = document.getElementById('ttGroup').value.trim();
        if (!day || !group) return;
        state.timetable.push({ day, group });
        document.getElementById('ttDay').value = '';
        document.getElementById('ttGroup').value = '';
        scheduleSave();
        renderTimetable();
    });

    document.getElementById('ttList').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-tt-del]');
        if (!btn) return;
        state.timetable.splice(Number(btn.dataset.ttDel), 1);
        scheduleSave();
        renderTimetable();
    });

    document.getElementById('exportBtn').addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `students-backup-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
    });

    document.getElementById('importTriggerBtn').addEventListener('click', () => {
        document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const imported = JSON.parse(ev.target.result);
                if (imported.students) {
                    state.students = imported.students;
                    state.timetable = imported.timetable || [];
                    scheduleSave();
                    updateStatsAndFilters();
                    renderStudents();
                    alert('تم استيراد البيانات بنجاح!');
                }
            } catch (err) {
                alert('ملف غير صالح.');
            }
        };
        reader.readAsText(file);
    });

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed:', err));
        });
    }

    loadData();
    updateStatsAndFilters();
    renderStudents();
})();
</script>
</body>
</html>
